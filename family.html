*{box-sizing:border-box}html,body{margin:0}
body{font-family:'GE SS Two','Myriad Pro',Tahoma,sans-serif;color:var(--navy);background:radial-gradient(1200px 500px at 85% -10%,#d9ecfa 0,transparent 60%),linear-gradient(180deg,#f3f7fc,#e8eef8);min-height:100vh;font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#082B5A,#0b3f7d);color:#fff;border-bottom:4px solid var(--sky);box-shadow:0 8px 20px -14px rgba(8,43,90,.8)}
.top .hin{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:40px}.top .t{font-weight:800;font-size:17px;line-height:1.3}.top .s{font-size:12.5px;color:#BFD7EE}
.top .grow{flex:1;min-width:0}
.ib{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.ib svg{width:22px;height:22px}.ib .dot{position:absolute;top:-4px;inset-inline-end:-4px;background:#e2463b;color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:800}
main{max-width:1180px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid #dbe5f3;border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13.5px}
label.l{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}
.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;background:#f7f9fd;min-height:48px}
.in:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(58,177,219,.3)}
textarea.in{min-height:96px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;border:0;border-radius:14px;padding:11px 18px;background:linear-gradient(180deg,#0a72c4,#005499);color:#fff;cursor:pointer;box-shadow:0 5px 0 -1px #022a56,0 10px 16px -8px rgba(0,84,153,.6);min-height:46px;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 -1px #022a56}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line);box-shadow:0 3px 0 -1px #d3dfee}
.btn.ok{background:linear-gradient(180deg,#34a26a,#2E8B57);box-shadow:0 5px 0 -1px #1b5a37,0 10px 16px -8px rgba(46,139,87,.6)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-weight:800;font-size:12.5px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.info{background:#e5f3fb;color:#06648f}.tag.mute{background:#eef1f5;color:#4b5a70}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;font-size:30px;margin-bottom:4px}
/* الدخول */
.auth{max-width:460px;margin:24px auto}
.hero{border-radius:24px;background:linear-gradient(135deg,#082B5A,#005499 60%,#3AB1DB);color:#fff;padding:22px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:23px}.hero p{margin:4px 0 0;color:#d6e8f8}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef3fa;border-radius:16px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;color:var(--blue);cursor:pointer;min-height:44px}
.seg button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(8,43,90,.15)}
.pw{position:relative}.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer;min-height:40px;padding:0 8px}
.err{color:var(--bad);font-weight:700;min-height:1.6em;margin:8px 0 0}
.ltr{direction:ltr;text-align:right}

.kids{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.kid{flex:none;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px 8px 10px;cursor:pointer;min-height:58px;box-shadow:0 3px 0 -1px #d3dfee}
.kid .av{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#3AB1DB,#005499);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.kid b{display:block;line-height:1.3}.kid span{font-size:12.5px;color:var(--muted)}
.kid[aria-pressed="true"]{border-color:var(--navy);background:linear-gradient(180deg,#fff,#eef5fd);box-shadow:0 0 0 3px rgba(58,177,219,.35)}

.lay{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
nav.side{position:sticky;top:84px;background:#fff;border:1px solid #dbe5f3;border-radius:var(--r);padding:8px;box-shadow:var(--sh)}
nav.side button,.bnav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:14px;padding:10px 12px;font-weight:800;color:#30476b;cursor:pointer;min-height:46px;text-align:start;position:relative}
nav.side button svg,.bnav button svg{width:22px;height:22px;flex:none}
nav.side button[aria-current="page"]{background:linear-gradient(90deg,#e6f1fb,#f5f9fe);color:var(--navy);box-shadow:inset -4px 0 0 var(--sky)}
nav.side .n,.bnav .n{margin-inline-start:auto;background:#e2463b;color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.bnav{display:none}
@media (max-width:860px){.lay{grid-template-columns:1fr}nav.side{display:none}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;box-shadow:0 -8px 20px -14px rgba(8,43,90,.5)}
  .bnav button{flex:1 0 64px;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 4px;min-height:54px;justify-content:center;text-align:center}
  .bnav button[aria-current="page"]{color:var(--blue);background:#eaf3fc}
  .bnav .n{position:absolute;top:2px;inset-inline-end:10px;margin:0}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi{border-radius:18px;padding:12px 14px;background:linear-gradient(180deg,#fff,#f4f8fd);border:1px solid #dbe5f3;box-shadow:0 3px 0 -1px #dbe5f3}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{font-size:13px;color:var(--muted)}

.list .it .x{min-width:0;flex:1}.list .it b{display:block}
.bar{height:10px;background:var(--pale);border-radius:99px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:99px}

.les{border:1px solid var(--line);border-inline-start:4px solid var(--sky);border-radius:14px;padding:9px 12px;margin-bottom:6px;background:#fff}
.les .hw{margin-top:6px;font-size:14px;background:var(--warnbg);border-radius:10px;padding:4px 9px}
.les .pf{margin-top:6px;font-size:14px;background:var(--pale);border-radius:10px;padding:4px 9px}
.note{border:1px solid #bfe0f1;background:#eef8fd;color:#0b4f72;border-radius:14px;padding:10px 12px;font-size:14px;margin:8px 0}

.cl .c[aria-current="true"]{border-color:var(--navy);background:#eef5fd}

.bub small{display:block;font-size:11px;opacity:.75;margin-top:2px}

.stp li.cur{border-color:var(--blue);background:linear-gradient(180deg,#fff,#e6f1fb);box-shadow:0 0 0 3px rgba(58,177,219,.3)}

.x-close{border:0;background:#eef3fa;border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:20px;color:var(--navy)}

.q{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}

.q img{max-width:100%;max-height:280px;border-radius:12px;margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#f7f9fd;font-weight:700;text-align:start;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:#eaf3fc}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.prog{height:8px;background:var(--pale);border-radius:99px;overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--green))}
.ord{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin-top:6px;background:#f7f9fd}
.ord span{flex:1}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:0 auto;width:max-content;max-width:90vw;background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;z-index:60;box-shadow:var(--sh);font-weight:700}
.toast.err{background:var(--bad)}
.spin{width:34px;height:34px;border:4px solid var(--pale);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 10px 30px}
@media (max-width:420px){.top .t{font-size:15px}.top .s{display:none}.top img{height:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,nav,.bnav,.noprint,footer{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>

  }

        return `<ol class="stp" aria-label="مراحل الطلب">${stages.map(([k, n, e], i) => `<li class="${seen[k] || i <= cur ? 'on' : ''} ${i === cur ? 'cur' : ''}"><span class="d" aria-hidden="true">${e}</span><b>${n}</b>${seen[k] ? `<small>${esc(new Date(seen[k].at).toLocaleTimeString('ar-SA', { hour: 'numeric', minute: '2-digit' }))}${seen[k].name && seen[k].name !== 'ولي الأمر' ? ' · ' + esc(seen[k].name) : ''}</small>` : ''}</li>`).join('')}</ol>`; };
      V.innerHTML = `${act.map(c => `<div class="card pk-act ${c.status === 'called' ? 'pk-called' : ''}"><div class="row sp"><div><h2 style="margin:0">${esc(c.name)}</h2><div class="small muted">${esc(c.class || '')} · ${esc(c.reason || 'استئذان')} · المستلم: ${esc(c.person || '')}</div></div>${PEND[c.status] ? `<span class="tag ${PEND[c.status][1]}">${PEND[c.status][0]}</span>` : ''}</div>${stepper(c)}
        ${c.status === 'requested' ? '<div class="note">بانتظار اعتماد المدرسة — يصلك التحديث هنا تلقائياً.</div>' : ''}
        ${['approved', 'coming'].includes(c.status) ? `<div class="note">${cfg.auto !== false ? 'فعّل التتبع وأنت في الطريق: عند اقترابك من المدرسة (' + AR(cfg.radius || 300) + ' م) يُرسل النداء تلقائياً لشاشة الفصل والمسؤولين.' : 'عند وصولك اضغط «وصلت» أو أبلغ البوابة.'}</div>
          <div class="row">${geo.call === c.id ? `<span class="tag info" role="status">📍 ${esc(geo.msg)}</span><button class="btn ghost sm" data-gs="1">إيقاف التتبع</button>` : `<button class="btn ok" data-gt="${c.id}">🚗 أنا في الطريق — تفعيل التتبع</button>`}${cfg.lat && cfg.lng ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${cfg.lat},${cfg.lng}">الاتجاهات للمدرسة</a>` : ''}</div>` : ''}
        ${c.status === 'called' ? '<div class="note" style="background:var(--okbg);border-color:#bfe5cd;color:var(--ok);font-weight:800">📣 تم النداء — يُجهَّز ابنك للخروج إلى البوابة.</div>' : ''}
        ${c.status === 'released' ? '<div class="note" style="background:var(--okbg);border-color:#bfe5cd;color:var(--ok);font-weight:800">🚶 خرج ابنك من الفصل ويتجه للبوابة.</div>' : ''}
        ${c.status === 'handed' ? '<div class="note" style="background:#fff8e8;border-color:#f3d9a4;color:#7a4b00;font-weight:800">🤝 سلّمت المدرسة ابنك — أكّد الاستلام لإغلاق الطلب (إلزامي).</div>' : ''}
        ${cf && ['called', 'released', 'handed'].includes(c.status) ? `<button class="btn ok wide pk-cf" data-cf="${c.id}" style="margin-top:10px;min-height:56px;font-size:18px">✍️ تأكيد استلام ابني ${esc(first(c.name))}</button>` : ''}
        ${['requested', 'approved', 'coming'].includes(c.status) ? `<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-cx="${c.id}">إلغاء الطلب</button></div>` : ''}</div>`).join('')}
      <div class="card"><h2>طلب استئذان جديد</h2><p class="small muted">${cfg.approve ? 'يُراجَع الطلب من المدرسة، ثم ' : ''}عند اقترابك من المدرسة يُنادى ابنك على شاشة الفصل ويُبلَّغ المسؤولون، وتُوثَّق كل مرحلة.${cfg.from && cfg.to ? ` متاح من ${esc(cfg.from)} إلى ${esc(cfg.to)}.` : ''}</p>
        <form id="pf2" novalidate><div class="grid g2" style="gap:8px"><div><label class="l" for="pk">الابن</label><select class="in" id="pk">${H.kids.map(k => `<option value="${k.id}" ${k.id === kid ? 'selected' : ''}>${esc(k.name)} — ${esc(k.class || '')}</option>`).join('')}</select></div>
          <div><label class="l" for="pr">السبب</label><select class="in" id="pr">${(cfg.reasons && cfg.reasons.length ? cfg.reasons : ['موعد طبي', 'ظرف عائلي', 'وعكة صحية', 'سفر', 'أخرى']).map(x => `<option>${esc(x)}</option>`).join('')}</select></div>
          <div><label class="l" for="pp">من سيستلم الطالب</label><input class="in" id="pp" value="${esc(H.parent || '')}" maxlength="120"></div>
          <div><label class="l" for="pn">ملاحظة (اختياري)</label><input class="in" id="pn" maxlength="500"></div></div>
          <button class="btn ok wide" style="margin-top:14px" id="ps2">إرسال طلب الاستئذان</button><p class="err" id="pe2" role="alert"></p></form></div>
      ${old.length ? `<div class="card"><h2>السجل</h2><div class="list">${old.slice(0, 20).map(c => `<div class="it"><div class="x"><b>${esc(c.name)}</b><span class="small muted">${esc(ad(c.day))} · ${esc(c.reason || '')}</span></div><span class="tag ${PEND[c.status] ? PEND[c.status][1] : c.status === 'done' ? 'ok' : 'info'}">${PEND[c.status] ? PEND[c.status][0] : (PST.find(x => x[0] === c.status) || [, c.status])[1]}</span></div>`).join('')}</div></div>` : ''}`;
      V.querySelectorAll('[data-gt]').forEach(b => b.onclick = () => geoStart(b.dataset.gt, draw));
      V.querySelectorAll('[data-gs]').forEach(b => b.onclick = () => { geoStop(); draw(); });
      V.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('fam_pickup_confirm', { p_token: tok, p_id: b.dataset.cf }); await loadPick(); pkSync(); draw(); toast('✓ تم تأكيد الاستلام — شكراً لك'); }));
      if ('Notification' in window && Notification.permission === 'default' && act.length && P.cfg.alerts !== false && !V.querySelector('#nperm')) { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = '<div class="row sp"><span>🔔 فعّل تنبيهات الجهاز لتصلك مراحل الاستئذان فوراً</span><button class="btn sm" id="nperm">تفعيل التنبيهات</button></div>'; V.prepend(d); d.querySelector('#nperm').onclick = () => Notification.requestPermission().then(() => d.remove()); }
      V.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => busy(b, async () => { await rpc('fam_pickup_cancel', { p_token: tok, p_id: b.dataset.cx }); if (geo.call === b.dataset.cx) geoStop(); await loadPick(); draw(); toast('أُلغي الطلب'); }));
      const f = V.querySelector('#pf2'); f.onsubmit = e => { e.preventDefault(); const er = V.querySelector('#pe2'); er.textContent = '';
        busy(V.querySelector('#ps2'), async () => { try { const r = await rpc('fam_pickup_req', { p_token: tok, p_student: V.querySelector('#pk').value, p_reason: V.querySelector('#pr').value, p_person: V.querySelector('#pp').value.trim(), p_due: null, p_note: V.querySelector('#pn').value.trim() || null });
          toast(r.status === 'approved' ? 'اعتُمد الطلب — فعّل التتبع عندما تتحرك' : 'أُرسل الطلب للمدرسة'); await loadPick(); draw(); } catch (x) { er.textContent = x.message; } }); };
    };
    draw();
    clearInterval(poll); poll = setInterval(async () => { if (view !== 'pick' || document.visibilityState !== 'visible' || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) return; try { await loadPick(); draw(); } catch (_) { } }, 15000);
  }

  /* تنبيهات الاستئذان في كل الصفحات: صوت، اهتزاز، إشعار الجهاز، وشريط يطلب التأكيد */
  let pkTimer = null, pkPrev = null;
  const PKMSG = { approved: n => `✅ اعتُمد استئذان ${n} — فعّل التتبع عند التحرك`, rejected: n => `لم يُعتمد استئذان ${n}`, called: n => `📣 تم النداء على ${n} — يُجهَّز للخروج`, released: n => `🚶 خرج ${n} من الفصل ويتجه للبوابة`, handed: n => `🤝 سُلّم ${n} — أكّد الاستلام`, cancelled: n => `أُلغي استئذان ${n}` };
  function pkAlert(t) { toast(t); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) { } try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.connect(g); g.connect(x.destination); o.frequency.value = 988; g.gain.setValueAtTime(.18, x.currentTime); g.gain.exponentialRampToValueAtTime(.001, x.currentTime + .7); o.start(); o.stop(x.currentTime + .7); } catch (_) { }
    try { if ('Notification' in window && Notification.permission === 'granted') { const o = { body: t, icon: 'assets/icon-192.png', badge: 'assets/icon-192.png', tag: 'dina-pickup', renotify: true, lang: 'ar', dir: 'rtl' }; navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification('بوابة ولي الأمر', o) : new Notification('بوابة ولي الأمر', o)).catch(() => new Notification('بوابة ولي الأمر', o)) : new Notification('بوابة ولي الأمر', o); } } catch (_) { } }
  function pkBanner() { const el = document.getElementById('pkb'); if (!el || !P) return; const cf = P.cfg && P.cfg.confirm !== false, need = (P.calls || []).filter(c => ['called', 'released', 'handed'].includes(c.status));
    el.innerHTML = need.length && view !== 'pick' ? `<button class="card" data-go3="pick" style="display:flex;width:100%;align-items:center;gap:10px;border-color:${need.some(c => c.status === 'handed') ? '#f3d9a4' : '#9fd9b6'};background:${need.some(c => c.status === 'handed') ? '#fff8e8' : '#e3f5ea'};cursor:pointer;text-align:start;font:inherit;color:inherit"><span style="font-size:26px" aria-hidden="true">${need.some(c => c.status === 'handed') ? '🤝' : '📣'}</span><span style="flex:1"><b>${need.map(c => esc(first(c.name))).join('، ')}: ${need.some(c => c.status === 'handed') ? 'سُلّم — أكّد الاستلام' : 'تم النداء'}</b>${cf ? '<br><span class="small">اضغط لتأكيد الاستلام</span>' : ''}</span></button>` : '';
    el.querySelectorAll('[data-go3]').forEach(b => b.onclick = () => go('pick')); }
  function pkSync() { const st = {}; ((P && P.calls) || []).forEach(c => st[c.id] = c.status); pkPrev = st; pkBanner(); }
  async function pkCheck() { if (!tok || !H || !H.pickup) return; try { P = await rpc('fam_pickup_list', { p_token: tok }); } catch (_) { return; }
    const st = {}; (P.calls || []).forEach(c => st[c.id] = c.status);
    if (pkPrev && P.cfg && P.cfg.alerts !== false) (P.calls || []).forEach(c => { if (pkPrev[c.id] && pkPrev[c.id] !== c.status && PKMSG[c.status]) pkAlert(PKMSG[c.status](first(c.name))); });
    pkPrev = st; pkBanner(); }
  function pkWatch() { clearInterval(pkTimer); pkPrev = null; if (!H || !H.pickup) return; pkCheck(); pkTimer = setInterval(pkCheck, 20000); }

  /* ---------------- كلمة المرور ---------------- */
  function pwDialog() {
    const M = modal('تغيير كلمة المرور', `<form id="pf"><label class="l" for="p0">كلمة المرور الحالية</label><input class="in" type="password" id="p0" autocomplete="current-password"><label class="l" for="p1">الجديدة (٦ خانات على الأقل)</label><input class="in" type="password" id="p1" autocomplete="new-password"><label class="l" for="p2">تأكيد الجديدة</label><input class="in" type="password" id="p2" autocomplete="new-password"><button class="btn wide" style="margin-top:14px" id="ps">حفظ</button><p class="err" id="pe" role="alert"></p><p class="small muted">يُخرج تغييرُ كلمة المرور الأجهزةَ الأخرى من حسابك.</p></form>`);
    const el = M.el; el.querySelector('#pf').onsubmit = e => { e.preventDefault(); const er = el.querySelector('#pe'), a = el.querySelector('#p1').value; if (a.length < 6) { er.textContent = ERR.WEAK; return; } if (a !== el.querySelector('#p2').value) { er.textContent = 'كلمتا المرور غير متطابقتين'; return; }
      busy(el.querySelector('#ps'), async () => { try { await rpc('fam_password', { p_token: tok, p_old: el.querySelector('#p0').value, p_new: a }); M.close(); toast('تم تغيير كلمة المرور ✓'); } catch (x) { er.textContent = x.message; } }); };
  }

  window.addEventListener('pageshow', () => { });
  tok ? start() : auth();
})();
</script>
</body>
</html>
