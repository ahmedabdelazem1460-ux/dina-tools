<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة دينا — الخطة الأسبوعية والنصاب والجدول</title>
<meta name="theme-color" content="#082B5A">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Tajawal';font-weight:500;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Tajawal';font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Tajawal';font-weight:800;src:url(fonts/tajawal-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Tajawal';font-weight:500;src:url(fonts/tajawal-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Tajawal';font-weight:700;src:url(fonts/tajawal-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Tajawal';font-weight:800;src:url(fonts/tajawal-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'GE SS Two';font-weight:300;font-display:swap;src:url(fonts/gess-two-light.woff2) format('woff2')}
@font-face{font-family:'GE SS Two';font-weight:400 500;font-display:swap;src:url(fonts/gess-two-medium.woff2) format('woff2')}
@font-face{font-family:'GE SS Two';font-weight:600 900;font-display:swap;src:url(fonts/gess-two-bold.woff2) format('woff2')}
@font-face{font-family:'Myriad Pro';font-weight:300 400;font-display:swap;src:url(fonts/myriad-pro-regular.woff2) format('woff2')}
@font-face{font-family:'Myriad Pro';font-weight:500 600;font-display:swap;src:url(fonts/myriad-pro-semibold.woff2) format('woff2')}
@font-face{font-family:'Myriad Pro';font-weight:700 900;font-display:swap;src:url(fonts/myriad-pro-bold.woff2) format('woff2')}
:root{
  --navy:#082B5A;--sky:#3AB1DB;--blue:#005499;--pale:#E4EBF5;--line:#84B7E3;--mid:#5E9BD3;--soft:#6EA7DA;
  --green:#BADF93;--purple:#AE95DA;--lav:#DAD5EB;
  --bg:#EEF3FA;--card:#fff;--ink:#082B5A;--muted:#4D6A8F;--faint:#5F7896;--border:#D5E1F0;
  --ok:#2E8B57;--oktx:#23704A;--okbg:#E5F4EA;--warn:#8A5A12;--warnbg:#FFF4DC;--bad:#B83A3A;--badbg:#FBE7E7;
  --r:16px;--r-sm:10px;
  --sh1:0 1px 2px rgba(8,43,90,.06),0 4px 10px -2px rgba(8,43,90,.08);
  --sh2:0 1px 0 rgba(255,255,255,.9) inset,0 2px 4px rgba(8,43,90,.06),0 16px 32px -12px rgba(8,43,90,.22);
  --sh3:0 24px 60px -16px rgba(8,43,90,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'GE SS Two','Myriad Pro','Tajawal',system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(circle at 1px 1px,rgba(58,177,219,.18) 1px,transparent 1.3px) 0 0/22px 22px,
  linear-gradient(180deg,#F5F8FC,#EAF0F8)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0A3268,var(--navy));color:#fff;box-shadow:0 6px 20px -8px rgba(8,43,90,.6)}
.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--sky),var(--mid),var(--sky))}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1500px;margin:0 auto}
.top img.logo{height:44px}
.top .ttl{font-weight:800;font-size:17px;line-height:1.1;white-space:nowrap}
.top .ttl small{display:block;font-weight:500;font-size:12px;color:var(--sky)}
.top .grow{flex:1}
.pick{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:4px 4px 4px 10px}
.pick label{font-size:12px;color:#BFD6EE;padding-inline-start:6px}
.pick select{background:transparent;border:0;color:#fff;font-weight:700;padding:6px 4px;outline:none;max-width:210px}
.pick select option{color:var(--ink)}
.userbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;color:#fff;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:800}
.menu{position:absolute;top:64px;left:22px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--sh3);padding:8px;min-width:220px;z-index:40}
.menu button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--pale)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu .who b{display:block}.menu .who span{font-size:12px;color:var(--muted)}

/* ---------- nav ---------- */
.nav{max-width:1500px;margin:14px auto 0;padding:0 22px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap;background:rgba(255,255,255,.6);border:1px solid var(--border)}
.nav a svg{width:18px;height:18px}
.nav a.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 8px 18px -8px rgba(8,43,90,.7)}
.nav a .cnt{background:var(--sky);color:var(--navy);border-radius:20px;padding:0 7px;font-size:12px}
main{max-width:1500px;margin:0 auto;padding:18px 22px 80px}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);border:1px solid rgba(213,225,240,.7);padding:20px}
.card+.card{margin-top:16px}
.card h2{margin:0 0 4px;font-size:20px;font-weight:800}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head .grow{flex:1;min-width:200px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;
  background:linear-gradient(180deg,#0B3A78,var(--navy));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 0 #04193A,0 8px 16px -6px rgba(8,43,90,.6);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 1px 0 #04193A}
.btn svg{width:18px;height:18px}
.btn.sky{background:linear-gradient(180deg,#5BC2E5,var(--sky));color:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 0 #1F8DB5,0 8px 16px -6px rgba(58,177,219,.7)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--border);box-shadow:0 3px 0 var(--border)}
.btn.ok{background:linear-gradient(180deg,#3AA36C,var(--ok));box-shadow:0 4px 0 #1D6340}
.btn.bad{background:#fff;color:var(--bad);border:1px solid #EBC2C2;box-shadow:0 3px 0 #EBC2C2}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;min-height:36px}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;background:#FBFDFF;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(58,177,219,.18);background:#fff}
textarea.in{resize:vertical;min-height:44px;line-height:1.6}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.st-empty{background:#F0F3F8;color:var(--muted)}
.st-draft{background:var(--pale);color:var(--blue)}
.st-submitted{background:#E1F3FA;color:#0F5F82}
.st-returned{background:var(--warnbg);color:var(--warn)}
.st-approved{background:var(--okbg);color:var(--oktx)}
.st-open{background:#E1F3FA;color:#0F5F82}.st-locked{background:#F0F3F8;color:var(--muted)}.st-published{background:var(--okbg);color:var(--oktx)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;color:var(--line);margin-bottom:8px}
.bar{height:10px;border-radius:10px;background:var(--pale);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--sky),var(--blue))}
.bar.done i{background:linear-gradient(90deg,#7CC796,var(--ok))}

/* KPI tiles */
.kpi{position:relative;overflow:hidden;background:#fff;border-radius:var(--r);box-shadow:var(--sh2);padding:16px 18px;border:1px solid rgba(213,225,240,.7)}
.kpi .k{font-size:13px;color:var(--muted);font-weight:700}
.kpi .v{font-size:32px;font-weight:800;line-height:1.15;margin-top:4px}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:700}
.kpi .d{font-size:12px;color:var(--faint);margin-top:2px}
.kpi::after{content:"";position:absolute;left:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;border:10px solid var(--pale)}
.kpi.navy{background:linear-gradient(160deg,#0B3A78,var(--navy));color:#fff}.kpi.navy .k,.kpi.navy .d{color:#BFD6EE}.kpi.navy::after{border-color:rgba(58,177,219,.25)}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:13px;color:var(--muted);text-align:start;font-weight:800;padding:10px 10px;border-bottom:2px solid var(--pale);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
.tbl td{padding:10px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
.tbl tr:hover td{background:#F8FBFE}
.tbl tr.click{cursor:pointer}
.scroll{overflow:auto;max-width:100%}

/* teacher portal */
.dayhead{display:flex;align-items:center;gap:12px;margin:22px 0 10px}
.dayhead .dn{background:var(--navy);color:#fff;border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:0 6px 14px -6px rgba(8,43,90,.6)}
.dayhead .dd{color:var(--muted);font-size:14px}
.dayhead .ln{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--line))}
.lesson{display:grid;grid-template-columns:120px 1fr;gap:0;background:#fff;border-radius:var(--r);box-shadow:var(--sh1);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.lesson .side{background:linear-gradient(170deg,var(--pale),#F4F8FC);padding:14px 12px;display:flex;flex-direction:column;gap:6px;border-inline-end:1px solid var(--border)}
.lesson .side .pn{font-size:26px;font-weight:800;color:var(--sky);line-height:1}
.lesson .side .pw{font-size:12px;color:var(--muted);font-weight:700}
.lesson .side .cl{font-weight:800;font-size:15px}
.lesson .side .sj{font-size:13px;color:var(--blue);font-weight:700}
.lesson .main{padding:14px;display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.lesson .main .full{grid-column:1/-1}
.lesson .main .field{margin:0}
.lesson.returned{border-color:#F0C97A;box-shadow:0 0 0 3px rgba(240,201,122,.25)}
.lesson.approved .main{opacity:.85}
.rnote{grid-column:1/-1;background:var(--warnbg);color:#7A5210;border-radius:10px;padding:8px 12px;font-size:14px}
.savestate{font-size:12px;color:var(--faint);min-height:16px}
.sticky-foot{position:sticky;bottom:12px;z-index:5;margin-top:18px}
.sticky-foot .card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px)}

/* class grid */
.cgrid{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.cgrid th{background:var(--sky);color:var(--navy);padding:10px;font-weight:800;text-align:center}
.cgrid th:first-child{border-start-start-radius:12px}.cgrid th:last-child{border-start-end-radius:12px}
.cgrid td{border-bottom:1px solid #E7EEF7;padding:8px;vertical-align:top;background:#fff}
.cgrid tr.alt td{background:#F6F9FD}
.cgrid td.per{background:var(--navy)!important;color:#fff;text-align:center;font-weight:800;width:62px;vertical-align:middle}
.cgrid td.dayc{background:var(--pale)!important;font-weight:800;text-align:center;vertical-align:middle;width:74px;writing-mode:horizontal-tb}
.cgrid textarea{width:100%;resize:none;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px;resize:vertical;min-height:38px;line-height:1.5}
.cgrid textarea:hover{border-color:var(--border)}.cgrid textarea:focus{border-color:var(--sky);background:#fff;outline:none}
.cls-list{display:flex;flex-direction:column;gap:6px}
.cls-list button{display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:start;border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700}
.cls-list button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cls-list button .bar{width:60px;height:6px}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}

/* timetable */
.tt{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
.tt th{font-size:13px;color:var(--muted);font-weight:800;padding:6px}
.tt td{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;text-align:center;font-size:13px;height:58px;vertical-align:middle}
.tt td .s{font-weight:800}.tt td .t{font-size:12px;color:var(--blue)}
.tt td.noteach .t{color:var(--bad)}
.tt td.chg{border-color:var(--sky);box-shadow:0 0 0 2px rgba(58,177,219,.35);background:#F1FAFD}
.tt td select{width:100%;border:1px solid var(--border);border-radius:8px;padding:3px;font-size:12px;background:#fff}
.tt td.dayh{background:var(--navy);color:#fff;font-weight:800;border:0}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(8,26,54,.55);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--sh3);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;position:relative}
.modal.wide{width:min(1000px,100%)}
.modal.full{width:min(1100px,100%);height:calc(100vh - 32px);display:flex;flex-direction:column;padding:14px}
.modal h3{margin:0 0 14px;font-size:19px;font-weight:800}
.modal .x{position:absolute;top:14px;left:14px;border:0;background:var(--pale);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--navy)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;box-shadow:var(--sh3);font-weight:700;pointer-events:auto;max-width:92vw}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{position:relative;overflow:hidden;background:linear-gradient(160deg,#0B3A78,var(--navy) 60%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(58,177,219,.35) 1.2px,transparent 1.5px) 0 0/26px 26px;opacity:.5}
.login .art > *{position:relative}
.login .art img{width:240px}
.login .art h1{font-size:44px;font-weight:800;margin:0;line-height:1.2}
.login .art p{color:#BFD6EE;font-size:18px;max-width:440px}
.login .art .deco{position:absolute;left:-80px;bottom:-80px;width:380px;opacity:.5}
.login .form{display:grid;place-items:center;padding:32px}
.login .box{width:min(400px,100%)}
.login .box h2{font-size:26px;margin:0 0 6px;font-weight:800}
.err-line{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}
.demo-banner{background:var(--warnbg);color:#7A5210;text-align:center;padding:6px;font-size:13px;font-weight:700}

.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--pale);border-top-color:var(--sky);animation:sp 0.8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--pale);margin:-4px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--sky)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px}
.sec-box{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;background:#FAFCFF}
.notice{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:#E8F5FB;color:#155E7E}.notice.warn{background:var(--warnbg);color:#7A5210}.notice.bad{background:var(--badbg);color:#8A2424}.notice.ok{background:var(--okbg);color:#1E6040}
.drop{border:2px dashed var(--line);border-radius:16px;padding:26px;text-align:center;background:#F7FBFE;cursor:pointer}
.drop:hover{background:#EEF7FC}
code.k{background:var(--pale);border-radius:6px;padding:1px 6px;font-size:13px}

.grid>*,.split>*{min-width:0}
@media (max-width:1180px){.top .ttl{display:none}.top-in{flex-wrap:wrap}.pick{flex:1 1 auto}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
@media (max-width:760px){
  .top-in{padding:8px 12px;gap:8px;flex-wrap:wrap}.top img.logo{height:34px}.top .ttl{display:none}
  .pick{order:3;flex:1 1 45%;min-width:0}.pick select{max-width:none;width:100%}.pick label{display:none}
  .nav{padding:0 12px}main{padding:14px 12px 90px}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  .lesson{grid-template-columns:1fr}.lesson .side{flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px;border-inline-end:0;border-bottom:1px solid var(--border)}
  .lesson .main{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login .art{padding:28px;min-height:auto}.login .art h1{font-size:30px}.login .art img{width:170px}.login .art .deco{display:none}
  .card{padding:16px}.kpi .v{font-size:26px}
}
@media print{.top,.nav,.sticky-foot,.bnav{display:none}}

/* ---------- تصفّح كموظف + رسائل ---------- */
.viewas{background:linear-gradient(90deg,#3AB1DB,#5BC2E5);color:#082B5A;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px;font-size:14px;flex-wrap:wrap;position:sticky;top:0;z-index:31}
.userbtn.icon-only{position:relative;padding:8px 10px}
.badge{position:absolute;top:-6px;left:-6px;background:#E2574C;color:#fff;border-radius:20px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid #082B5A}
.inbox{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:420px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.inbox .lst{border-inline-end:1px solid var(--border);overflow:auto;max-height:60vh;background:#FAFCFF}
.inbox .lst button{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid var(--border);background:none;padding:12px 14px}
.inbox .lst button.on{background:var(--pale)}.inbox .lst button.unread b{color:var(--blue)}
.inbox .lst button.unread::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sky);margin-inline-end:6px}
.inbox .rd{padding:16px;overflow:auto;max-height:60vh}
.inbox .msg{background:#F6F9FD;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;white-space:pre-line;line-height:1.7}
.inbox .msg.me{background:#fff;border-color:var(--sky)}
@media (max-width:760px){.inbox{grid-template-columns:1fr}.inbox .lst{max-height:30vh}}
/* التنفيذ اليومي */
.ex-pending{--exc:#E8B931;--exb:#FFF8E1}.ex-done{--exc:#2E8B57;--exb:#E5F4EA}.ex-modified{--exc:#7CC796;--exb:#F0FAF3}.ex-not_done{--exc:#B83A3A;--exb:#FBE7E7}
.exdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--exc);box-shadow:0 0 0 3px var(--exb);vertical-align:middle}
.expill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--exb);color:#082B5A;border:1px solid var(--exc)}
.exrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-inline-start:6px solid var(--exc);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.exrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.exrow .acts .btn.on{outline:3px solid var(--exc)}
.lang-row{display:grid;grid-template-columns:28px 1fr 1fr;gap:10px;align-items:start;border-bottom:1px solid var(--border);padding:10px 0}
.lang-row del{color:var(--bad);text-decoration:line-through;background:var(--badbg);border-radius:4px;padding:0 2px}
.lang-row ins{color:var(--oktx);text-decoration:none;background:var(--okbg);border-radius:4px;padding:0 2px}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rep-card{border:1px solid var(--border);border-radius:16px;padding:16px;background:linear-gradient(170deg,#fff,#F4F8FD);text-align:start;font:inherit;cursor:pointer}
.rep-card:hover{border-color:var(--sky)}
.assignlink{color:var(--bad);font-weight:800;text-decoration:underline dotted}.rep-card b{display:block;font-size:16px;margin-bottom:4px}
/* ---------- وصول وتفاعل ---------- */
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.in:focus-visible{outline:none}
button,a,select,[role=button],.click{cursor:pointer}
@media (pointer:coarse){.btn,.btn.sm,.nav a,.tabs button,.cls-list button{min-height:44px}.chk input{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.kpi.btnlike{cursor:pointer;text-align:start;font:inherit;width:100%;border:1px solid rgba(213,225,240,.7);transition:transform .15s ease,box-shadow .15s ease}
.kpi.btnlike:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 8px rgba(8,43,90,.08),0 22px 40px -14px rgba(8,43,90,.3)}
.kpi .more{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--blue);font-weight:800;z-index:1}
.kpi.navy .more{color:#BFD6EE}
.drill .tbl td{font-size:14px}
.chip-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip-filter button{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;color:var(--muted)}
.chip-filter button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* بطاقات الصفحات الإضافية والقوالب */
.xp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.xp{border:1px solid var(--border);border-radius:14px;padding:14px;background:linear-gradient(170deg,#fff,#F6F9FD);position:relative}
.xp .k{font-size:12px;font-weight:800;color:var(--blue)}.xp .tt{font-weight:800;font-size:16px;margin:4px 0 6px}
.xp .acts{display:flex;gap:6px;margin-top:10px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tpl{border:2px solid var(--border);border-radius:14px;padding:10px;background:#fff;text-align:center;font-weight:800;position:relative}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl.on{border-color:var(--sky);box-shadow:0 0 0 4px rgba(58,177,219,.18)}
.tpl .pv{height:92px;border-radius:8px;background:var(--pale);margin-bottom:8px;position:relative;overflow:hidden}
.tpl .pv i{position:absolute;display:block;border-radius:3px}
.tpl small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.rows-editor .r{display:grid;gap:8px;margin-bottom:8px;align-items:start}
.tgrid summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tgrid summary::-webkit-details-marker{display:none}
.tgrid summary::before{content:"▾";color:var(--blue);transition:transform .2s}.tgrid:not([open]) summary::before{transform:rotate(90deg)}
.tg{margin-top:12px;table-layout:fixed;min-width:720px}.tg th,.tg td{text-align:center;vertical-align:middle;padding:6px}.tg tbody th{background:var(--pale);width:96px}
.tg td.tg-free{color:var(--faint)}.tg td.tg-hol{background:var(--warnbg);color:var(--warn);font-weight:700}
.tg-c{display:flex;flex-direction:column;gap:2px;width:100%;min-height:52px;justify-content:center;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:6px 4px;font:inherit;color:var(--ink);cursor:pointer;margin:2px 0;border-inline-start:4px solid var(--sky)}
.tg-c b{font-size:13px;line-height:1.3}.tg-c span{font-size:11px;color:var(--muted)}
.tg-c.ok{border-inline-start-color:var(--ok);background:var(--okbg)}.tg-c.todo{border-inline-start-color:#E0A526}
.tg-c:hover,.tg-c:focus-visible{box-shadow:var(--sh2)}
.tg-key{display:inline-block;width:18px;min-height:14px;height:14px;padding:0;margin:0 4px;cursor:default}
/* شريط التنقل السفلي على الجوال */
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:35;background:#fff;border-top:1px solid var(--border);box-shadow:0 -8px 24px -12px rgba(8,43,90,.35);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:800;text-decoration:none;min-height:52px;border-radius:12px}
  .bnav svg{width:22px;height:22px}
  .bnav .on{color:var(--navy);background:var(--pale)}
  main{padding-bottom:110px}
  .sticky-foot{bottom:78px}
}
.sheet{position:fixed;inset:auto 0 0 0;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--sh3);z-index:61;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet a{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:800}
.sheet a svg{width:22px;height:22px;color:var(--blue)}
.sheet a.on{background:var(--pale)}
/* الانضمام */
.claim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.claim{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;background:#fff;display:flex;align-items:center;gap:10px;text-align:start;font-weight:700}
.claim.mine{border-color:var(--sky);background:#F1FAFD}
.claim.taken{opacity:.6}
.claim .c{flex:1}.claim .c small{display:block;color:var(--muted);font-weight:500}
</style>
