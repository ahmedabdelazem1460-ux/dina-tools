<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابي — مدارس دينا العالمية</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:'GE SS Two';font-weight:400 500;src:url(fonts/gess-two-medium.woff2) format('woff2');font-display:swap}
@font-face{font-family:'GE SS Two';font-weight:600 900;src:url(fonts/gess-two-bold.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Myriad Pro';font-weight:400;src:url(fonts/myriad-pro-regular.woff2) format('woff2');font-display:swap}
:root{--navy:#082B5A;--blue:#005499;--sky:#3AB1DB;--pale:#E4EBF5;--line:#C9D7EC;--ok:#17814a;--okbg:#e3f5ea;--bad:#c62d22;--badbg:#fde8e6;--warn:#a85d00;--warnbg:#fff1d6;--muted:#566384}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'GE SS Two','Myriad Pro',Tahoma,sans-serif;color:var(--navy);background:linear-gradient(180deg,#f2f6fc,#e6edf8);min-height:100vh;font-size:16px;line-height:1.7}
header{background:var(--navy);color:#fff;padding:14px 16px;border-bottom:4px solid var(--sky);display:flex;align-items:center;gap:12px}
header img{height:42px}header .t{font-weight:800;font-size:18px}header .s{font-size:13px;color:#BFD7EE}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dbe5f3;border-radius:20px;padding:18px;box-shadow:0 2px 3px rgba(8,43,90,.08),0 12px 26px -10px rgba(8,43,90,.25);margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13.5px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#f7f9fd;color:var(--navy)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(58,177,219,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 20px;background:linear-gradient(180deg,#0a72c4,#005499);color:#fff;cursor:pointer;box-shadow:0 6px 0 -1px #022a56,0 10px 16px -6px rgba(0,84,153,.5);min-height:48px}
.btn:active{transform:translateY(2px)}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line);box-shadow:none}.btn:disabled{opacity:.6}
.q{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}
.q .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;margin-inline-end:6px}
.q .pts{font-size:12px;color:var(--blue)}.q img{max-width:100%;max-height:260px;border-radius:12px;margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#f7f9fd;font-weight:700}
.opt input{width:22px;height:22px;accent-color:var(--blue);flex:none}.opt.on{border-color:var(--blue);background:#eaf3fc}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.bar{height:10px;background:var(--pale);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue))}
.top{position:sticky;top:0;z-index:5;background:rgba(242,246,252,.95);backdrop-filter:blur(6px);padding:10px 0;display:flex;gap:10px;align-items:center}
.timer{font-weight:800;background:var(--navy);color:#fff;border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.res{text-align:center}.res .big{font-size:52px;font-weight:800;line-height:1.1}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.exp{font-size:14px;background:var(--pale);border-radius:10px;padding:8px 10px;margin-top:8px}
.gap{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
a{color:var(--blue)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{font:inherit;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hi{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#3AB1DB,#005499);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.day{margin-bottom:12px}.day h3{font-size:16px;margin:0 0 6px;color:var(--blue)}.it{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;background:#fff}.it b{display:block}.it .hw{margin-top:4px;font-size:14px;background:var(--warnbg);border-radius:10px;padding:4px 8px}.it .pf{margin-top:4px;font-size:14px;background:var(--pale);border-radius:10px;padding:4px 8px}
.qz{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}.kp div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff;font-size:13px;color:var(--muted)}.kp b{display:block;font-size:22px;color:var(--navy)}
.code{font-family:'Myriad Pro',monospace;letter-spacing:3px;text-transform:uppercase;text-align:center;font-size:22px;direction:ltr}
.empty{text-align:center;color:var(--muted);padding:16px}
</style>
<script src="digits.js?v=1794208453"></script>
</head>
<body>
<header><img src="assets/logo_white.svg" alt="مدارس دينا العالمية"><div><div class="t" id="ht">حسابي</div><div class="s" id="hs">مدارس دينا العالمية — بوابة الطالب</div></div></header>
<main id="m"><div class="card">جارٍ التحميل…</div></main>
<footer>مدارس دينا العالمية · Dinaaedu · 920035881</footer>
<script src="config.js?v=1794208453"></script>
<script>
(function () {
  const C = window.APP_CONFIG, m = document.getElementById('m');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AR = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const KQ = { quiz: 'اختبار قصير', worksheet: 'ورقة عمل', homework: 'واجب إلكتروني', remedial: 'ورقة دعم علاجية' };
  const KR = { worksheet: 'ورقة عمل', review: 'ملف مراجعة', test: 'اختبار', presentation: 'عرض تقديمي', video: 'فيديو', image: 'صورة', file: 'ملف', folder: 'مجلد', link: 'رابط' };
  const LS = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { } }, del: k => { try { localStorage.removeItem(k); } catch (_) { } } };
  const ERR = { BAD_CODE: 'الرمز غير صحيح أو متوقف — راجع معلمك أو إدارة المدرسة', INACTIVE: 'هذا الحساب غير نشط حالياً' };
  async function rpc(fn, body) { const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: C.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok) throw new Error(ERR[j.message] || j.message || 'تعذّر الاتصال'); return j; }
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  let code = (new URLSearchParams(location.search).get('c') || LS.get('dina_me') || '').toUpperCase(), tab = LS.get('dina_me_t') || 'week', week = null, D = null;

  function login(msg) {
    m.innerHTML = `<div class="card"><h1>دخول الطالب</h1><p class="muted small">اكتب رمز الدخول الموجود في بطاقتك (يعطيك إياه معلمك أو يُرسل لولي أمرك).</p>
      <label for="cd">رمز الدخول</label><input id="cd" class="code" autocomplete="one-time-code" maxlength="9" placeholder="XXXX-XXXX" value="${esc(code)}" inputmode="text">
      <div style="margin-top:14px"><button class="btn" id="go" style="width:100%">دخول</button></div><p class="small" id="er" role="alert" style="color:var(--bad)">${esc(msg || '')}</p></div>`;
    const i = document.getElementById('cd'); i.oninput = () => { let v = i.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4); i.value = v; };
    document.getElementById('go').onclick = () => { code = i.value.trim(); if (code.length < 9) { document.getElementById('er').textContent = 'الرمز ٨ خانات'; return; } load(); };
    i.onkeydown = e => { if (e.key === 'Enter') document.getElementById('go').click(); };
  }
  async function load() {
    m.innerHTML = '<div class="card">جارٍ التحميل…</div>';
    try { D = await rpc('student_portal', { p_code: code, p_week: week }); } catch (e) { LS.del('dina_me'); return login(e.message); }
    LS.set('dina_me', code); LS.set('dina_stu', JSON.stringify({ name: D.student.name, cls: D.student.class_id, no: D.student.no || '' }));
    if (!new URLSearchParams(location.search).get('c')) history.replaceState(null, '', location.pathname);
    paint();
  }
  function paint() {
    const s = D.student, todo = (D.quizzes || []).filter(z => !+z.done), first = (s.name || '').trim().split(/\s+/)[0];
    document.getElementById('hs').textContent = [D.school, D.section].filter(Boolean).join(' — ');
    m.innerHTML = `<div class="card"><div class="hi"><div style="display:flex;gap:12px;align-items:center"><div class="av" aria-hidden="true">${esc(first.slice(0, 1))}</div><div><h1 style="margin:0">أهلاً ${esc(first)}</h1><div class="muted small">${esc(s.name)} · ${esc(s.class)}</div></div></div><button class="btn ghost" id="out" style="min-height:40px;padding:6px 14px">خروج</button></div>
      <div class="kp"><div><b>${AR(todo.length)}</b>مطلوب منك الآن</div><div><b>${AR((D.results || []).length)}</b>اختبار أنجزته</div><div><b>${AR((D.plan || []).filter(e => (e.homework || '').trim()).length)}</b>واجب في الخطة</div></div></div>
      <div class="tabs" role="tablist">${[['week', 'خطة الأسبوع'], ['todo', `اختباراتي وواجباتي${todo.length ? ' (' + AR(todo.length) + ')' : ''}`], ['res', 'نتائجي'], ['src', 'المصادر']].map(([k, n]) => `<button role="tab" data-t="${k}" class="${tab === k ? 'on' : ''}" aria-selected="${tab === k}">${n}</button>`).join('')}</div><div id="b"></div>`;
    document.getElementById('out').onclick = () => { LS.del('dina_me'); LS.del('dina_stu'); code = ''; login(); };
    m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; LS.set('dina_me_t', tab); paint(); });
    const B = document.getElementById('b');
    if (tab === 'week') {
      const days = [...new Set((D.plan || []).map(e => e.day))].sort();
      B.innerHTML = `<div class="card"><div class="hi"><h2 style="margin:0">خطة الأسبوع ${D.week ? esc(D.week.word) : ''}</h2>${(D.weeks || []).length > 1 ? `<select id="wk" style="width:auto" aria-label="الأسبوع">${D.weeks.map(w => `<option value="${w.id}" ${D.week && D.week.id === w.id ? 'selected' : ''}>الأسبوع ${esc(w.word)}</option>`).join('')}</select>` : ''}</div>
        ${days.length ? days.map(d => `<div class="day"><h3>${DAYS[d]}</h3>${D.plan.filter(e => e.day === d).map(e => `<div class="it"><b>${esc(e.subject || '')}</b>${e.topic ? `<div>${esc(e.topic)}</div>` : ''}${(e.homework || '').trim() ? `<div class="hw">الواجب: ${linkify(e.homework)}</div>` : ''}${e.perf && e.perf.text ? `<div class="pf">مهمة أدائية: ${esc(e.perf.text)}${e.perf.due ? ' — التسليم: ' + esc(e.perf.due) : ''}</div>` : ''}</div>`).join('')}</div>`).join('') : '<div class="empty">لم تُنشر خطة هذا الأسبوع بعد.</div>'}</div>`;
      const wk = document.getElementById('wk'); if (wk) wk.onchange = () => { week = wk.value; load(); };
    } else if (tab === 'todo') {
      B.innerHTML = `<div class="card"><h2>اختباراتي وواجباتي</h2>${(D.quizzes || []).map(z => `<div class="qz"><div><b>${esc(z.title)}</b><div class="small muted">${esc(KQ[z.kind] || '')} · ${esc(z.subject || '')}${z.close ? ' · يُغلق ' + esc(new Date(z.close).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' })) : ''}</div></div>${+z.done ? '<span class="tag ok">أُنجز ✓</span>' : `<a class="btn" style="min-height:40px;padding:6px 14px" href="${base}student.html?q=${encodeURIComponent(z.code)}">ابدأ</a>`}</div>`).join('') || '<div class="empty">لا يوجد مطلوب حالياً 👏</div>'}</div>`;
    } else if (tab === 'res') {
      B.innerHTML = `<div class="card"><h2>نتائجي</h2>${(D.results || []).map(r => { const p = r.max ? Math.round(100 * r.score / r.max) : 0; return `<div class="qz"><div><b>${esc(r.title)}</b><div class="small muted">${esc(KQ[r.kind] || '')} · ${esc(new Date(r.at).toLocaleDateString('ar-SA'))}${r.pending ? ' · فيه أسئلة يصححها المعلم' : ''}</div></div><span class="tag ${p >= 80 ? 'ok' : p >= 50 ? 'warn' : 'bad'}">${AR(r.score)} / ${AR(r.max)}</span></div>`; }).join('') || '<div class="empty">لا توجد نتائج بعد.</div>'}</div>`;
    } else {
      B.innerHTML = `<div class="card"><h2>المصادر</h2>${(D.resources || []).map(r => `<div class="qz"><div><b>${esc(r.title)}</b><div class="small muted">${esc(KR[r.kind] || '')} · ${esc(r.subject || 'عام')}${r.note ? ' · ' + esc(r.note) : ''}</div></div><a class="btn ghost" style="min-height:40px;padding:6px 14px" href="${esc(r.url)}" target="_blank" rel="noopener">فتح</a></div>`).join('') || '<div class="empty">لا توجد مصادر مشاركة لفصلك.</div>'}</div>`;
    }
  }
  const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.includes('student.html?q=') ? 'افتح الاختبار' : 'رابط'}</a>`);
  code ? load() : login();
})();
</script>
</body>
</html>
