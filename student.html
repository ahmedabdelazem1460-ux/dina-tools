<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة الطالب — مدارس دينا العالمية</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:'GE SS Two';font-weight:400 500;src:url(fonts/gess-two-medium.woff2) format('woff2');font-display:swap}
@font-face{font-family:'GE SS Two';font-weight:600 900;src:url(fonts/gess-two-bold.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Myriad Pro';font-weight:400;src:url(fonts/myriad-pro-regular.woff2) format('woff2');font-display:swap}
:root{--navy:#082B5A;--blue:#005499;--sky:#3AB1DB;--pale:#E4EBF5;--line:#C9D7EC;--ok:#17814a;--okbg:#e3f5ea;--bad:#c62d22;--badbg:#fde8e6;--warn:#a85d00;--warnbg:#fff1d6;--muted:#566384}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'GE SS Two','Myriad Pro',Tahoma,sans-serif;color:var(--navy);background:linear-gradient(180deg,#f2f6fc,#e6edf8);min-height:100vh;font-size:16px;line-height:1.7}
header{background:var(--navy);color:#fff;padding:14px 16px;border-bottom:4px solid var(--sky);display:flex;align-items:center;gap:12px}
header img{height:42px}header .t{font-weight:800;font-size:18px}header .s{font-size:13px;color:#BFD7EE}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dbe5f3;border-radius:20px;padding:18px;box-shadow:0 2px 3px rgba(8,43,90,.08),0 12px 26px -10px rgba(8,43,90,.25);margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13.5px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#f7f9fd;color:var(--navy)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(58,177,219,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 20px;background:linear-gradient(180deg,#0a72c4,#005499);color:#fff;cursor:pointer;box-shadow:0 6px 0 -1px #022a56,0 10px 16px -6px rgba(0,84,153,.5);min-height:48px}
.btn:active{transform:translateY(2px)}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line);box-shadow:none}.btn:disabled{opacity:.6}
.q{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}
.q .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;margin-inline-end:6px}
.q .pts{font-size:12px;color:var(--blue)}.q img{max-width:100%;max-height:260px;border-radius:12px;margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#f7f9fd;font-weight:700}
.opt input{width:22px;height:22px;accent-color:var(--blue);flex:none}.opt.on{border-color:var(--blue);background:#eaf3fc}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.bar{height:10px;background:var(--pale);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue))}
.top{position:sticky;top:0;z-index:5;background:rgba(242,246,252,.95);backdrop-filter:blur(6px);padding:10px 0;display:flex;gap:10px;align-items:center}
.timer{font-weight:800;background:var(--navy);color:#fff;border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.res{text-align:center}.res .big{font-size:52px;font-weight:800;line-height:1.1}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.exp{font-size:14px;background:var(--pale);border-radius:10px;padding:8px 10px;margin-top:8px}
.gap{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
a{color:var(--blue)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html.lang-en body,html.lang-en input,html.lang-en select,html.lang-en textarea,html.lang-en button{font-family:'Myriad Pro','GE SS Two',Tahoma,sans-serif}
.blk{line-height:2.4;margin-top:8px}.bl{display:inline-block;width:auto;min-width:110px;max-width:220px;margin:0 4px;padding:4px 8px;border:0;border-bottom:2px dashed #3AB1DB;border-radius:6px;background:#F5F9FD}.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.bank button{border:1px solid #84B7E3;background:#fff;border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer;color:#082B5A}.mt{display:grid;gap:6px;margin-top:8px}.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;border:1px solid #D5E1F0;border-radius:12px;padding:6px 10px}.or{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}.or li{display:flex;align-items:center;gap:8px;border:1px solid #D5E1F0;border-radius:12px;padding:6px 10px;background:#fff}.or li span{width:26px;height:26px;border-radius:50%;background:#E4EBF5;display:grid;place-items:center;font-weight:800;font-size:13px}.or li b{flex:1}.or li button{border:1px solid #D5E1F0;background:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer}.or li button:disabled{opacity:.3}
/* ===== واجهة الاختبار التفاعلية ===== */
.qz-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 20px;color:#fff;background:radial-gradient(circle at 85% 0%,#3AB1DB 0,rgba(58,177,219,0) 45%),linear-gradient(135deg,#082B5A,#005499);box-shadow:0 18px 40px -18px rgba(8,43,90,.6);margin-bottom:14px}
.qz-hero:after{content:'';position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.qz-hero .k{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.qz-hero h1{font-size:clamp(22px,5vw,30px);margin:10px 0 4px;line-height:1.35}.qz-hero p{margin:0;color:#CFE3F5;font-size:14px}
.qz-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;position:relative;z-index:1}
.qz-meta div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px}.qz-meta b{display:block;font-size:20px}.qz-meta span{font-size:12px;color:#CFE3F5}
.qz-top{position:sticky;top:0;z-index:6;background:rgba(242,246,252,.96);backdrop-filter:blur(8px);padding:10px 0 8px;margin:-6px 0 10px}
.qz-row{display:flex;align-items:center;gap:10px}
.qz-step{font-weight:800;font-size:14px;white-space:nowrap}
.qz-seg{flex:1;display:flex;gap:3px;height:8px}.qz-seg i{flex:1;border-radius:99px;background:#D5E1F0;transition:background .25s}.qz-seg i.a{background:#3AB1DB}.qz-seg i.f{background:#E0A33A}.qz-seg i.c{background:#082B5A}
.qz-ring{position:relative;width:54px;height:54px;flex:none}.qz-ring svg{transform:rotate(-90deg)}.qz-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.qz-ring.low b{color:#c62d22}.qz-ring.low circle.v{stroke:#c62d22}.qz-ring.low{animation:qzp 1s infinite}
@keyframes qzp{50%{transform:scale(1.06)}}
.qz-nav-b{border:1.5px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:none}
.q.slide{display:none;border:0;border-radius:22px;padding:20px 18px;box-shadow:0 2px 3px rgba(8,43,90,.06),0 16px 34px -14px rgba(8,43,90,.28);animation:qzin .28s ease}
.q.slide.cur{display:block}
@keyframes qzin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.q.slide .qh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.q.slide .n{width:38px;height:38px;border-radius:12px;font-size:16px;flex:none;background:linear-gradient(135deg,#005499,#3AB1DB)}
.q.slide .qt{font-size:clamp(17px,4.2vw,20px);font-weight:800;line-height:1.7}
.q.slide .pts{display:inline-block;margin-top:2px;background:#EAF3FC;border-radius:99px;padding:1px 10px;font-weight:700}
.q.slide .opt{min-height:56px;border-radius:16px;padding:10px 14px;font-size:16px;transition:border-color .15s,background .15s,transform .1s}
.q.slide .opt:hover{border-color:#84B7E3}.q.slide .opt:active{transform:scale(.99)}
.q.slide .opt input{position:absolute;opacity:0;width:1px;height:1px}
.q.slide .opt .lt{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#E4EBF5;color:var(--navy);font-weight:800;flex:none;transition:background .15s,color .15s}
.q.slide .opt.on{border-color:var(--blue);background:#EAF3FC;box-shadow:0 0 0 3px rgba(0,84,153,.12)}.q.slide .opt.on .lt{background:var(--blue);color:#fff}
.q.slide .opt:focus-within{outline:3px solid #3AB1DB;outline-offset:2px}
.qz-flag{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;margin-inline-start:auto}
.qz-flag[aria-pressed=true]{border-color:#E0A33A;background:#FFF4DE;color:#8A5600}
.qz-foot{display:flex;gap:10px;margin:14px 0 6px}.qz-foot .btn{flex:1}
.qz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.qz-grid button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--navy);cursor:pointer;position:relative}
.qz-grid button.a{background:#E8F4FB;border-color:#3AB1DB}.qz-grid button.f:after{content:'';position:absolute;top:4px;inset-inline-end:4px;width:8px;height:8px;border-radius:50%;background:#E0A33A}.qz-grid button.c{outline:3px solid #082B5A;outline-offset:1px}
.qz-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:10px 0 0}.qz-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:4px;vertical-align:middle;border:1.5px solid var(--line)}
.qz-sheet{position:fixed;inset:0;z-index:20;background:rgba(8,43,90,.45);display:flex;align-items:flex-end;justify-content:center}
.qz-sheet>div{background:#fff;width:min(760px,100%);border-radius:24px 24px 0 0;padding:18px 18px 22px;max-height:86vh;overflow:auto;animation:qzup .25s ease}
@keyframes qzup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.qz-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.qz-sum div{border-radius:14px;padding:10px;text-align:center;background:#F3F7FC}.qz-sum b{display:block;font-size:22px}
.qz-res{position:relative;overflow:hidden;text-align:center;border-radius:24px;padding:24px 18px;background:#fff;box-shadow:0 18px 40px -18px rgba(8,43,90,.4);margin-bottom:14px}
.qz-score{--p:0;width:180px;height:180px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--c,#2E8B57) calc(var(--p)*1%),#E4EBF5 0);transition:--p 1s}
.qz-score>div{width:144px;height:144px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}.qz-score b{font-size:44px;line-height:1}.qz-score span{font-size:13px;color:var(--muted)}
.qz-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}.qz-stats div{border-radius:14px;padding:10px;background:#F3F7FC}.qz-stats b{display:block;font-size:22px}
.qz-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}.qz-conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:qzf 2.4s ease-in forwards}
@keyframes qzf{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.q.slide,.qz-sheet>div{animation:none}.qz-conf{display:none}.qz-ring.low{animation:none}}

/* ===== واجهات الطالب (يختارها المعلم عند إنشاء التكليف): dina (الافتراضية) · sky · green · night · kids ===== */
/* السماوية — فاتحة ومشرقة */
html[data-qt=sky] body{background:linear-gradient(180deg,#F4FBFE,#E1F2FB)}
html[data-qt=sky] header{background:#fff;color:var(--navy);border-bottom-color:#3AB1DB;box-shadow:0 6px 18px -12px rgba(8,43,90,.4)}html[data-qt=sky] header .s{color:var(--muted)}
html[data-qt=sky] .qz-hero{color:var(--navy);background:radial-gradient(circle at 88% 0,#BADF93 0,rgba(186,223,147,0) 42%),linear-gradient(135deg,#DDF2FB,#fff);border:1px solid #BFE3F3;box-shadow:0 18px 40px -22px rgba(58,177,219,.9)}
html[data-qt=sky] .qz-hero p,html[data-qt=sky] .qz-meta span{color:var(--muted)}html[data-qt=sky] .qz-hero .k{background:#fff;border-color:#BFE3F3;color:var(--blue)}
html[data-qt=sky] .qz-meta div{background:#fff;border-color:#CDE9F6}html[data-qt=sky] .qz-hero:after{background:rgba(58,177,219,.12)}
html[data-qt=sky] .qz-top{background:rgba(244,251,254,.96)}html[data-qt=sky] .q.slide .n{background:linear-gradient(135deg,#3AB1DB,#005499)}
html[data-qt=sky] .q.slide,html[data-qt=sky] .card{border:1px solid #CDE9F6}
/* النمو — أخضر دينا */
html[data-qt=green]{--blue:#1F6E45;--sky:#2E8B57;--pale:#E6F2DC;--line:#C5DDB4}
html[data-qt=green] body{background:linear-gradient(180deg,#F6FBF1,#E7F3DD)}
html[data-qt=green] header{background:linear-gradient(90deg,#15573A,#1F6E45);border-bottom-color:#BADF93}html[data-qt=green] header .s{color:#DDF0CC}
html[data-qt=green] .qz-hero{background:radial-gradient(circle at 85% 0,#BADF93 0,rgba(186,223,147,0) 42%),linear-gradient(135deg,#15573A,#23774A)}html[data-qt=green] .qz-hero p,html[data-qt=green] .qz-meta span{color:#DDF0CC}
html[data-qt=green] .btn{background:linear-gradient(180deg,#2E8B57,#1F6E45);box-shadow:0 6px 0 -1px #124A30,0 10px 16px -6px rgba(31,110,69,.5)}html[data-qt=green] .btn.ghost{background:#fff;color:#1F6E45;box-shadow:none}
html[data-qt=green] .qz-top{background:rgba(246,251,241,.96)}html[data-qt=green] .q.slide .n{background:linear-gradient(135deg,#1F6E45,#2E8B57)}
html[data-qt=green] .q.slide .pts{background:#E6F2DC}html[data-qt=green] .q.slide .opt.on{background:#EDF7E4;box-shadow:0 0 0 3px rgba(46,139,87,.16)}html[data-qt=green] .opt.on{background:#EDF7E4}
html[data-qt=green] .qz-seg i.a{background:#2E8B57}html[data-qt=green] .qz-seg i.c{background:#15573A}html[data-qt=green] .qz-seg i{background:#D5E6C7}
html[data-qt=green] .q.slide .opt:hover{border-color:#8CC29F}html[data-qt=green] .q.slide .opt:focus-within{outline-color:#2E8B57}
html[data-qt=green] .qz-ring circle.v{stroke:#2E8B57}html[data-qt=green] .bar i{background:linear-gradient(90deg,#BADF93,#2E8B57)}
/* الليلية — داكنة */
html[data-qt=night]{--navy:#EAF2FB;--blue:#7CCDEE;--sky:#3AB1DB;--pale:#143762;--line:#2A5486;--muted:#A9C0DA;--ok:#7BD9A2;--okbg:#0F3D2A;--bad:#FF9D94;--badbg:#4A1B19;--warn:#F2C879;--warnbg:#44330F;color-scheme:dark}
html[data-qt=night] body{background:linear-gradient(180deg,#061A38,#04142C)}
html[data-qt=night] header{background:#04142C}html[data-qt=night] header .t{color:#fff}
html[data-qt=night] .card,html[data-qt=night] .q,html[data-qt=night] .q.slide,html[data-qt=night] .qz-res,html[data-qt=night] .qz-sheet>div{background:#0E2C56;border-color:#1F4577;box-shadow:0 16px 34px -18px rgba(0,0,0,.7)}
html[data-qt=night] input,html[data-qt=night] select,html[data-qt=night] textarea,html[data-qt=night] .bl{background:#0A2347;color:#EAF2FB;border-color:#2A5486}html[data-qt=night] ::placeholder{color:#8FA9C6}
html[data-qt=night] .btn{background:linear-gradient(180deg,#5BC3E6,#3AB1DB);color:#04142C;box-shadow:0 6px 0 -1px #1B6F90,0 10px 16px -6px rgba(58,177,219,.4)}
html[data-qt=night] .btn.ghost,html[data-qt=night] .qz-nav-b,html[data-qt=night] .qz-flag,html[data-qt=night] .qz-grid button,html[data-qt=night] .bank button,html[data-qt=night] .or li,html[data-qt=night] .or li button{background:#0A2347;color:#EAF2FB;border-color:#2A5486;box-shadow:none}
html[data-qt=night] .opt{background:#0A2347}html[data-qt=night] .opt.on,html[data-qt=night] .q.slide .opt.on{background:#123B6B;border-color:#3AB1DB;box-shadow:0 0 0 3px rgba(58,177,219,.22)}
html[data-qt=night] .q.slide .opt .lt,html[data-qt=night] .or li span{background:#1B4273;color:#EAF2FB}html[data-qt=night] .q.slide .opt.on .lt{background:#3AB1DB;color:#04142C}
html[data-qt=night] .q.slide .pts,html[data-qt=night] .qz-sum div,html[data-qt=night] .qz-stats div,html[data-qt=night] .exp{background:#143762}
html[data-qt=night] .qz-top,html[data-qt=night] .top{background:rgba(6,26,56,.95)}html[data-qt=night] .qz-seg i{background:#1F4577}html[data-qt=night] .qz-seg i.c{background:#fff}
html[data-qt=night] .qz-hero{background:radial-gradient(circle at 85% 0,rgba(58,177,219,.55) 0,rgba(58,177,219,0) 45%),linear-gradient(135deg,#0A2347,#123B6B);border:1px solid #1F4577}
html[data-qt=night] .qz-score{background:conic-gradient(var(--c,#7BD9A2) calc(var(--p)*1%),#1B4273 0)}html[data-qt=night] .qz-score>div{background:#0E2C56}
html[data-qt=night] .timer,html[data-qt=night] .q .n{background:#3AB1DB;color:#04142C}html[data-qt=night] .q.slide .n{background:linear-gradient(135deg,#3AB1DB,#7CCDEE);color:#04142C}
html[data-qt=night] .qz-flag[aria-pressed=true]{background:#44330F;color:#F2C879;border-color:#E0A33A}html[data-qt=night] .qz-grid button.a{background:#123B6B;border-color:#3AB1DB}html[data-qt=night] .qz-grid button.c{outline-color:#fff}
html[data-qt=night] .mr,html[data-qt=night] .qz-legend i{border-color:#2A5486}html[data-qt=night] .qz-ring circle:not(.v){stroke:#1F4577}html[data-qt=night] .qz-sheet{background:rgba(0,0,0,.6)}
html[data-qt=night] [style*="background:#E8F4FB"]{background:#123B6B!important}html[data-qt=night] [style*="background:#FFF4DE"]{background:#44330F!important}
html[data-qt=night] [style*="color:#17814a"]{color:#7BD9A2!important}html[data-qt=night] [style*="color:#c62d22"]{color:#FF9D94!important}html[data-qt=night] [style*="color:#a85d00"]{color:#F2C879!important}
html[data-qt=night] footer{color:#8FA9C6}html[data-qt=night] a{color:#7CCDEE}
/* المرحة — للصفوف الأولية */
html[data-qt=kids] body{font-size:18px;background:#EEF8FD radial-gradient(circle at 12px 12px,rgba(58,177,219,.22) 2.5px,transparent 3px) 0 0/34px 34px}
html[data-qt=kids] header{background:linear-gradient(90deg,#005499,#1F6E45);border-bottom:6px solid #BADF93;border-radius:0 0 26px 26px}
html[data-qt=kids] .qz-hero{border-radius:32px;background:radial-gradient(circle at 12% 110%,rgba(186,223,147,.55) 0,rgba(186,223,147,0) 42%),linear-gradient(135deg,#005499,#1F6E45)}
html[data-qt=kids] .card,html[data-qt=kids] .q.slide,html[data-qt=kids] .qz-res{border-radius:28px;border:2px solid #BFE3F3}
html[data-qt=kids] .btn{border-radius:99px;min-height:56px;font-size:18px;background:linear-gradient(180deg,#2E8B57,#1F6E45);box-shadow:0 7px 0 -1px #124A30,0 12px 18px -6px rgba(31,110,69,.5)}html[data-qt=kids] .btn.ghost{background:#fff;color:#005499;box-shadow:none;border-width:2px}

    // معالجات الإجابة (كما هي) + انتقال تلقائي عند أول اختيار

  }
  function blankHTML(q, v) { let a = []; try { a = JSON.parse(v || '[]'); } catch (_) { } const n = q.blanks || 1; let k = 0; const RE = /\.{3,}|…+|_{3,}/g;
    const inp = i => `<input class="bl" data-bl="${q.id}|${i}" data-n="${n}" value="${esc(a[i] || '')}" aria-label="الفراغ ${AR(i + 1)}">`;
    let body = esc(q.body).replace(RE, () => k < n ? inp(k++) : '……'); let extra = ''; while (k < n) extra += inp(k++);
    return `<div class="blk">${body.includes('class="bl"') ? body : ''}${extra}</div>${q.bank ? `<div class="bank"><span class="small muted">بنك الكلمات:</span>${q.bank.map(w => `<button type="button" data-bk="${esc(w)}">${esc(w)}</button>`).join('')}</div>` : ''}`; }
  function matchHTML(q, v) { let a = []; try { a = JSON.parse(v || '[]'); } catch (_) { } const n = (q.left || []).length;
    return `<div class="mt">${(q.left || []).map((l, i) => `<div class="mr"><b>${esc(l)}</b><span>←</span><select data-mt="${q.id}|${i}" data-n="${n}" aria-label="ما يقابل ${esc(l)}"><option value="">اختر</option>${(q.right || []).map(r => `<option ${a[i] === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div>`; }
  function orderHTML(q, v) { return `<ol class="or" data-or="${q.id}" data-items="${esc(JSON.stringify(q.items || []))}"></ol>`; }
  function result(Q, qs, ans, r, info) {
    info = info || {};
    const p = r.max ? Math.round(r.score / r.max * 100) : 0; const [l, c, col] = p >= 80 ? ['ممتاز — متمكن', 'ok', '#2E8B57'] : p >= 50 ? ['جيد — واصل التدريب', 'warn', '#D99A2B'] : ['تحتاج إلى مراجعة', 'bad', '#c62d22'];
    const R = Object.fromEntries((r.review || []).map(x => [x.id, x]));
    const nOk = (r.review || []).filter(x => x.ok === true).length, nBad = (r.review || []).filter(x => x.ok === false).length, nMan = (r.review || []).filter(x => x.ok !== true && x.ok !== false).length;
    const mm = Math.floor((info.secs || 0) / 60), ss = (info.secs || 0) % 60;
    const name = JSON.parse(LS.get('dina_stu') || '{}').name || '';
    m.innerHTML = `<section class="qz-res">${p >= 80 ? `<div class="qz-conf" aria-hidden="true">${Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${['#3AB1DB', '#2E8B57', '#BADF93', '#005499', '#E0A33A'][i % 5]};animation-delay:${(i % 9) * 0.12}s"></i>`).join('')}</div>` : ''}
      <p class="muted" style="margin:0">${info.auto ? 'انتهى الوقت وسُلّمت إجاباتك تلقائياً' : 'تم تسليم إجاباتك'}${name ? ' يا ' + esc(name) : ''}</p>
      <div class="qz-score" id="scr" style="--c:${col}" role="img" aria-label="النتيجة ${AR(p)} بالمئة"><div><b id="scn">٠٪</b><span>${AR(r.score)} من ${AR(r.max)}</span></div></div>
      <p style="margin:4px 0 0"><span class="tag ${c}">${l}</span></p>
      <div class="qz-stats">${r.review ? `<div><b style="color:#17814a">${AR(nOk)}</b><span class="small">صحيحة</span></div><div><b style="color:#c62d22">${AR(nBad)}</b><span class="small">خاطئة</span></div>${nMan ? `<div><b style="color:#a85d00">${AR(nMan)}</b><span class="small">يصححها المعلم</span></div>` : ''}` : ''}<div><b>${AR(mm)}:${AR(String(ss).padStart(2, '0'))}</b><span class="small">الوقت المستغرق</span></div></div>
      ${r.pending ? '<p class="small muted">الأسئلة المقالية سيصححها معلمك.</p>' : ''}${!r.review ? '<p class="small muted">سيعرض معلمك الإجابات الصحيحة لاحقاً.</p>' : ''}
      <div class="qz-foot" style="justify-content:center">${r.left > 0 ? `<button class="btn" type="button" id="again">محاولة أخرى (بقي ${AR(r.left)})</button>` : ''}${LS.get('dina_me') ? '<a class="btn ghost" href="me.html">العودة إلى حسابي</a>' : ''}</div></section>` +
      (r.review ? `<h2 style="margin:6px 4px 10px">مراجعة الإجابات</h2>` + qs.map((q, i) => { const x = R[q.id] || {}; const mine = ans[q.id];
        const fmt = v => { try { const a = JSON.parse(v); return Array.isArray(a) ? a.filter(Boolean).join(' · ') : v; } catch (_) { return v; } };
        const body = ['blank', 'match', 'order'].includes(q.type) ? `<div class="small">إجابتك: <b>${esc(fmt(mine) || '—')}</b><br>الصحيح: <b>${esc(x.answer || '')}</b>${x.pts != null ? ` · درجتك ${AR(x.pts)} من ${AR(q.points)}` : ''}</div>` : q.type === 'multi' ? (() => { const R2 = String(x.answer || '').split(',').filter(Boolean), M = (() => { try { return JSON.parse(mine || '[]'); } catch (_) { return []; } })(); return q.options.map((o, k) => `<div class="opt ${R2.includes(String(k)) ? 'right' : M.includes(String(k)) ? 'wrong' : ''}">${esc(o)}${R2.includes(String(k)) ? ' ✓' : ''}${M.includes(String(k)) ? ' <small>(اخترتها)</small>' : ''}</div>`).join('') + (x.pts != null ? `<div class="small">درجتك ${AR(x.pts)} من ${AR(q.points)}</div>` : ''); })() : q.type === 'mcq' ? q.options.map((o, k) => `<div class="opt ${String(k) === String(x.answer) ? 'right' : String(k) === String(mine) ? 'wrong' : ''}" dir="auto">${LET[k] ? `<b>${esc(LET[k])})</b>&nbsp;` : ''}${esc(o)}${String(k) === String(x.answer) ? ' ✓' : String(k) === String(mine) ? ' ✗' : ''}</div>`).join('') : `<div class="small">إجابتك: <b>${esc(mine || '—')}</b>${q.type !== 'essay' ? ` · الصحيح: <b>${esc(String(x.answer || '').split('|')[0])}</b>` : ''}</div>`;
        return `<div class="q"><div><span class="n">${AR(i + 1)}</span><b>${esc(q.body)}</b> ${x.ok === true ? '<span class="tag ok">صحيح</span>' : x.ok === false ? (x.pts > 0 ? '<span class="tag warn">صحيح جزئياً</span>' : '<span class="tag bad">خطأ</span>') : '<span class="tag warn">يُصحَّح يدوياً</span>'}</div>${body}${x.explanation ? `<div class="exp">${esc(x.explanation)}</div>` : ''}</div>`; }).join('') : '');
    const ag = document.getElementById('again'); if (ag) ag.onclick = () => quiz();
    window.scrollTo(0, 0);
    // عدّاد النتيجة
    const el = document.getElementById('scr'), n = document.getElementById('scn'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.style.setProperty('--p', p); n.textContent = AR(p) + '٪'; return; }
    const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / 1100), v = Math.round(p * (1 - Math.pow(1 - k, 3))); el.style.setProperty('--p', v); n.textContent = AR(v) + '٪'; if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step);
  }
  async function plan() {
    let R; try { R = await rpc('remedial_public', { p_token: tok }); } catch (e) { m.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
    if (!R) { m.innerHTML = '<div class="card"><h2>الرابط غير صالح</h2></div>'; return; }
    document.getElementById('ht').textContent = R.kind === 'enrichment' ? 'خطتي الإثرائية' : 'خطتي العلاجية'; document.getElementById('hs').textContent = [R.teacher, R.school].filter(Boolean).join(' · ');
    m.innerHTML = `<div class="card"><h1>${esc(R.student)}</h1><p class="muted">${R.kind === 'enrichment' ? 'أحسنت! هذه أنشطة تزيد تميّزك.' : 'هذه المهارات تحتاج تدريباً إضافياً — اتبع الخطوات بالترتيب.'}</p><div class="bar"><i style="width:${R.progress}%"></i></div><p class="small">التقدم ${AR(R.progress)}٪${R.status === 'done' ? ' · <span class="tag ok">اكتملت</span>' : ''}</p></div>
      ${R.gaps && R.gaps.length ? `<div class="card"><h2>المهارات المطلوب تحسينها</h2>${R.gaps.map(g => `<div class="gap"><span>${esc(g.lesson)} — ${LV[g.level] || ''}</span><span class="tag ${g.p >= 60 ? 'warn' : 'bad'}">${AR(g.p)}٪</span></div>`).join('')}</div>` : ''}
      ${R.actions ? `<div class="card"><h2>الخطوات</h2><p style="white-space:pre-line;margin:0">${esc(R.actions)}</p></div>` : ''}
      ${(R.resources || []).length ? `<div class="card"><h2>شرح ومصادر</h2>${R.resources.map(x => `<p style="margin:6px 0"><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t || x.u)}</a></p>`).join('')}</div>` : ''}
      ${(R.quizzes || []).length ? `<div class="card"><h2>أوراق الدعم والتحقق</h2>${R.quizzes.map(z => `<p style="margin:8px 0"><a class="btn ghost" href="student.html?q=${encodeURIComponent(z.code)}">${esc(z.title)}</a></p>`).join('')}</div>` : ''}`;
  }
  async function paperRes() {
    let R; try { R = await rpc('paper_result_public', { p_token: prt }); } catch (e) { m.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
    if (!R) { m.innerHTML = '<div class="card"><h2>النتيجة غير متاحة</h2><p class="muted">قد تكون المشاركة متوقفة أو الرابط غير صحيح. تواصل مع المعلم.</p></div>'; return; }
    document.getElementById('ht').textContent = 'نتيجة الاختبار'; document.getElementById('hs').textContent = [R.subject, R.school].filter(Boolean).join(' · ');
    const p = R.max ? Math.round(R.score / R.max * 100) : 0; const [l, c] = p >= 80 ? ['ممتاز', 'ok'] : p >= 50 ? ['جيد', 'warn'] : ['يحتاج إلى متابعة', 'bad'];
    m.innerHTML = `<div class="card res"><h1 style="margin:0 0 4px">${esc(R.student)}</h1><p class="muted small">${esc(R.class || '')} · ${esc(R.exam)}${R.date ? ' · ' + AR(R.date) : ''}</p>
      ${R.absent ? '<p><span class="tag bad">غائب عن الاختبار</span></p>' : `<div class="big">${AR(R.score)} / ${AR(R.max)}</div><p><span class="tag ${c}">${l}</span> ${AR(p)}٪</p>`}</div>
      ${R.comment ? `<div class="card"><h2>ملاحظة المعلم</h2><p style="margin:0;white-space:pre-line">${esc(R.comment)}</p></div>` : ''}
      ${R.sheet ? `<div class="card"><h2>ورقة الإجابة</h2><img src="${esc(R.sheet)}" alt="ورقة إجابة الطالب" style="width:100%;border-radius:10px;border:1px solid #e3e9f2"></div>` : ''}`;
  }
  if (code) quiz(); else if (prt) paperRes(); else if (tok) plan(); else m.innerHTML = '<div class="card"><h2>بوابة الطالب</h2><p class="muted">افتح الرابط الذي أرسله معلمك.</p></div>';
})();
</script>
