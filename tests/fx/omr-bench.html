function warp(src, o) {

  const c = document.createElement('canvas'); const rot90 = o.rot90 ? 1 : 0; c.width = rot90 ? H : W; c.height = rot90 ? W : H; const x = c.getContext('2d');
  x.fillStyle = o.bg || '#fff'; x.fillRect(0, 0, c.width, c.height); x.save(); x.translate(c.width / 2, c.height / 2); x.rotate(((o.deg || 0) + (rot90 ? 90 : 0)) * Math.PI / 180);

  x.putImageData(d, 0, 0); return c;
}
async function lighten(cv, amt) { // قلم خفيف: تفتيح البكسلات الداكنة داخل الدوائر فقط يتم بتعديل التعبئة
  return cv; }
