/* ================= PDF: قراءة الأوراق الممسوحة ودمج الصور وتصديرها ================= */
var PDFJS_VER = '3.11.174';
function readAsArrayBuffer(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error('تعذرت قراءة الملف')); fr.onload=()=>res(fr.result); fr.readAsArrayBuffer(file); });
}
function isPdfFile(f){ return /pdf/i.test(f.type||'') || /\.pdf$/i.test(f.name||''); }
function grayFromCanvas(c){
  const w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data, g=new Uint8Array(w*h);
  for(let i=0,p=0;i<g.length;i++,p+=4) g[i]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114)|0;
  return g;
}
/* يعيد مولِّدًا غير متزامن: صفحة بصفحة (لتوفير الذاكرة) */
async function openPdfPages(file){
  if(typeof pdfjsLib==='undefined') throw new Error('مكتبة PDF لم تُحمَّل — تحقق من الاتصال بالإنترنت');
  try{ if(pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VER+'/build/pdf.worker.min.js'; }catch(e){}
  const buf = await readAsArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  return {
    numPages: pdf.numPages,
    async page(n){
      const pg = await pdf.getPage(n), v1 = pg.getViewport({scale:1}), sc = OMR_MAXSIDE/Math.max(v1.width,v1.height), vp = pg.getViewport({scale:sc});
      const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx, viewport:vp}).promise;
      return {gray:grayFromCanvas(c), w:c.width, h:c.height, dataURL:c.toDataURL('image/jpeg',0.6)};
    }
  };
}
/* تحويل أي ملف (صورة/PDF) إلى قائمة عناصر قابلة للقراءة، بالتتابع */
async function omrSources(files, onItem){
  for(const f of files){
    if(isPdfFile(f)){
      let doc; try{ doc = await openPdfPages(f); }catch(e){ await onItem({name:f.name, error:e.message||String(e)}); continue; }
      for(let n=1;n<=doc.numPages;n++){
        const name=f.name+' — صفحة '+n;
        try{ await onItem({name, im: await doc.page(n)}); }catch(e){ await onItem({name, error:'تعذر عرض الصفحة: '+(e.message||e)}); }
      }
    } else {
      try{ await onItem({name:f.name, im: await loadImageGray(f)}); }catch(e){ await onItem({name:f.name, error:e.message||String(e)}); }
    }
  }
}
async function omrScanCore(exam, files, o){

/* ---- كاتب PDF بسيط: صفحة لكل صورة JPEG (بدون مكتبات) ---- */
function dataUrlToBytes(durl){
  const b=atob(durl.split(',')[1]), a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a;
}
function buildPdfFromJpegs(pages){
  const enc=s=>{ const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i)&255; return a; };
  const chunks=[], offsets=[]; let pos=0;
  const push=u8=>{ chunks.push(u8); pos+=u8.length; };
  const addObj=(id,head,stream)=>{ offsets[id]=pos; push(enc(id+' 0 obj\n'+head+(stream?'\nstream\n':'\n'))); if(stream){ push(stream); push(enc('\nendstream\n')); } push(enc('endobj\n')); };
  push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  const n=pages.length, kids=[]; for(let i=0;i<n;i++) kids.push((3+i*3)+' 0 R');
  addObj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  addObj(2,'<< /Type /Pages /Count '+n+' /Kids ['+kids.join(' ')+'] >>');
  pages.forEach((p,i)=>{
    const pid=3+i*3, cid=pid+1, iid=pid+2, W=595.28, H=Math.round(W*p.h/p.w*100)/100;
    addObj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
    const content=enc('q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q');
    addObj(cid,'<< /Length '+content.length+' >>',content);
    addObj(iid,'<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>',p.bytes);
  });
  const total=3+n*3, xref=pos; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++) x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  push(enc(x));
  const out=new Uint8Array(pos); let o=0; chunks.forEach(c=>{ out.set(c,o); o+=c.length; }); return out;
}
function fileToJpegPage(file, maxSide, q){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader(); fr.onerror=()=>reject(new Error('تعذرت قراءة '+file.name));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>reject(new Error(file.name+' ليس صورة صالحة'));
      img.onload=()=>{ let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const sc=Math.min(1,maxSide/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve({bytes:dataUrlToBytes(c.toDataURL('image/jpeg',q)), w, h}); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
async function mergeImagesToPdf(fileList, thenScan){
  const files=[...fileList].filter(f=>!isPdfFile(f)); if(!files.length){ toast('اختر صورًا (JPG/PNG)'); return; }
  files.sort((a,b)=>a.name.localeCompare(b.name,'ar',{numeric:true}));
  toast('جارٍ دمج '+files.length+' صورة…');
  const pages=[]; for(const f of files){ try{ pages.push(await fileToJpegPage(f,2400,0.85)); }catch(e){ toast(e.message); return; } }
  const pdf=buildPdfFromJpegs(pages);
  downloadBlob(new Blob([pdf],{type:'application/pdf'}), 'أوراق_ممسوحة_'+files.length+'_صفحة.pdf');
  toast('تم دمج '+files.length+' صورة في ملف PDF واحد');
  if(thenScan) await omrScanFiles(files);
}

function watchRefresh(){ const el=document.getElementById('watchPanel'); if(el) el.innerHTML=watchPanelHTML(); }
async function watchPick(){

async function watchResume(){
  const rec=WATCH.saved; if(!rec||!rec.handle) return;

    let p = rec.handle.queryPermission ? await rec.handle.queryPermission({mode:rec.moveDone?'readwrite':'read'}) : 'granted';
    if(p!=='granted' && rec.handle.requestPermission) p = await rec.handle.requestPermission({mode:rec.moveDone?'readwrite':'read'});

  }catch(e){ toast('تعذر استئناف المراقبة — اختر المجلد من جديد'); return; }
  if(!DB.exams.find(x=>x.id===rec.examId)){ toast('النموذج المرتبط بالمراقبة لم يعد موجودًا'); return; }
  WATCH.moveDone=!!rec.moveDone; WATCH.interval=rec.interval||4000; omrUI().examId=rec.examId;
  await watchBegin(rec.handle, rec.examId, true);

async function watchForget(){ await watchForgetHandle(); WATCH.saved=null; watchRefresh(); }
async function watchBegin(handle, examId, readExisting){
  WATCH.handle=handle; WATCH.name=handle.name||'المجلد'; WATCH.examId=examId; WATCH.pending={}; WATCH.stats={read:0,fail:0,wait:0}; WATCH.log=[];
  const seen=watchSeenLoad();
  if(!readExisting){ try{ for await (const h of handle.values()){ if(h.kind==='file' && WATCH_EXT.test(h.name)){ const f=await h.getFile(); seen.add(watchSig(f)); } } watchSeenSave(); }catch(e){} }
  WATCH.running=true; watchLog('info','بدأت المراقبة'+(readExisting?' (مع قراءة الموجود)':'')); watchRefresh();
  clearInterval(WATCH.timer); WATCH.timer=setInterval(()=>watchTick(false), WATCH.interval); watchTick(false);
}
function watchStop(){ clearInterval(WATCH.timer); WATCH.timer=null; WATCH.running=false; WATCH.pending={}; watchLog('info','أُوقفت المراقبة'); watchRefresh(); }
function watchRetryFailed(){
  const seen=watchSeenLoad(); let c=0; (WATCH.failedSigs||[]).forEach(s=>{ if(seen.delete(s)) c++; }); WATCH.failedSigs=[]; watchSeenSave();
  toast(c?'ستُعاد قراءة '+c+' ملف في الفحص القادم':'لا توجد ملفات فاشلة في هذه الجلسة'); watchTick(true);
}
async function watchMove(file, dirName){
  if(!WATCH.moveDone) return;
  try{
    const dest=await WATCH.handle.getDirectoryHandle(dirName,{create:true});
    const fh=await dest.getFileHandle(file.name,{create:true}); const wr=await fh.createWritable(); await wr.write(file); await wr.close();
    await WATCH.handle.removeEntry(file.name);
  }catch(e){ watchLog('info','تعذر نقل «'+file.name+'»: '+(e.message||e)); }
}
async function watchTick(force){
  if(!WATCH.running || WATCH.busy) return;
  const exam=DB.exams.find(x=>x.id===WATCH.examId); if(!exam){ watchStop(); return; }
  WATCH.busy=true;
  try{
    const ready=[]; const nowPending={};
    for await (const h of WATCH.handle.values()){
      if(h.kind!=='file' || !WATCH_EXT.test(h.name)) continue;
      let f; try{ f=await h.getFile(); }catch(e){ continue; }
      const sig=watchSig(f); if(watchSeenLoad().has(sig)) continue;
      const prev=WATCH.pending[h.name], stable = prev && prev.size===f.size && prev.mtime===f.lastModified;
      if(stable && f.size>0 && (force || Date.now()-f.lastModified>1200)) ready.push({f,sig});
      else nowPending[h.name]={size:f.size, mtime:f.lastModified};
    }
    WATCH.pending=nowPending;
    for(const it of ready){
      const r=await omrScanCore(exam,[it.f],{append:true});
      watchSeenLoad().add(it.sig); watchSeenSave();
      if(r.okN>0){ WATCH.stats.read+=r.okN; watchLog('ok','قُرئ «'+it.f.name+'» ('+r.okN+' ورقة)'); await watchMove(it.f, WATCH_DONE_DIR); }
      else { WATCH.stats.fail++; (WATCH.failedSigs=WATCH.failedSigs||[]).push(it.sig); watchLog('fail','تعذرت قراءة «'+it.f.name+'»: '+(r.lastError||'')); await watchMove(it.f, WATCH_FAIL_DIR); }
    }
    if(ready.length){
      const nRev=examSheets(exam).filter(sheetNeedsReview).length;
      toast('📥 قُرئت '+ready.length+' ملف — '+nRev+' ورقة تحتاج مراجعة');
      const u=omrUI(); if(UI.tab==='omr' && u.examId===exam.id && u.view==='scan') renderApp();
    }
  }catch(e){ watchLog('fail','خطأ في المراقبة: '+(e.message||e)); }
  WATCH.busy=false; watchRefresh();
}

/* ================= مرونة النموذج: أنواع الأسئلة والتخطيط والربط بالفصول ================= */
function qTypeName(q){ return Q_TYPES[qType(q)]||q.type; }
function letterIndexOf(q, ch){
  ch=String(ch||'').trim(); if(!ch) return -1; const t=qType(q);
  if(t==='tf'){ if(/^(ص|صح|صحيح|T|1|true)$/i.test(ch)) return 0; if(/^(خ|خطأ|خطا|F|2|false)$/i.test(ch)) return 1; return -1; }
  if(t==='scale'){ return /^[1-7]$/.test(ch) ? parseInt(ch)-1 : -1; }
  const ar={'أ':0,'ا':0,'إ':0,'آ':0,'ب':1,'ج':2,'د':3,'ه':4,'و':5};
  if(ar[ch]!==undefined) return ar[ch];
  const u=ch.toUpperCase(); if(/^[A-F]$/.test(u)) return u.charCodeAt(0)-65;
  if(/^[1-6]$/.test(ch)) return parseInt(ch)-1;
  return -1;
}
function tokenToMarks(q, tok){
  tok=String(tok||'').trim(); if(!tok || /^[-_.*\s]+$/.test(tok)) return [];
  const t=qType(q);
  if(t==='num'){ const d=tok.replace(/\D/g,''); if(!d) return []; return d.padStart(qDigits(q),'0').slice(-qDigits(q)).split('').map(Number); }
  const m=new Set(); const chars = (t==='tf') ? [tok] : [...tok.replace(/هـ/g,'ه')];
  chars.forEach(c=>{ const i=letterIndexOf(q,c); if(i>=0 && i<qOptCount(q)) m.add(i); });
  const arr=[...m].sort((a,b)=>a-b); return (t==='multi') ? arr : arr;
}
function applyKeyString(){
  const e=currentExam(); const toks=tokenizeAnswerString((document.getElementById('keyStr')||{}).value||'');
  const scorable=e.questions.filter(q=>qIsChoiceKeyed(q)); let n=0;
  toks.forEach((t,i)=>{ const q=scorable[i]; if(!q) return; const m=tokenToMarks(q,t); if(m.length){ q.key = qType(q)==='multi' ? m : [m[0]]; n++; } });
  saveDB(); toast('عُيّن مفتاح '+n+' سؤال'); renderApp();
}
function setKeyFromSheet(sheetId){
  const e=currentExam(), sh=DB.sheets.find(s=>s.id===sheetId); if(!e||!sh) return;
  let n=0; e.questions.forEach(q=>{ const a=sh.answers[q.n]; if(!a||!a.marks.length) return; const t=qType(q);
    if(t==='num'){ if(a.marks.every(m=>m>=0)){ q.keyNum=a.marks.join(''); n++; } }
    else if(qIsChoiceKeyed(q)){ q.key = t==='multi' ? a.marks.slice() : [a.marks[0]]; n++; } });
  saveDB(); toast('اعتُمدت الورقة كمفتاح إجابة ('+n+' سؤال)'); omrGo('edit');
}
/* ---- تحرير الأسئلة ---- */
function applyQType(q, val){
  q.type=val; delete q.multi;
  if(val==='tf'){ q.opts=2; q.key=(q.key||[]).filter(k=>k<2).slice(0,1); if(q.points===0) q.points=1; }
  else if(val==='manual'){ q.key=[]; if(!q.points) q.points=1; }
  else if(val==='scale'){ q.opts=Math.max(3,Math.min(7,q.opts||5)); q.key=[]; q.points=0; }
  else if(val==='num'){ q.digits=q.digits||2; q.keyNum=q.keyNum||''; q.key=[]; if(!q.points) q.points=1; }
  else { if((q.opts||0)<3) q.opts=4; if(val==='mcq' && (q.key||[]).length>1) q.key=[q.key[0]]; if(!q.points) q.points=1; }
}
function qUpdate(i,key,val){
  const e=currentExam(), q=e.questions[i]; if(!q) return;
  if(key==='type') applyQType(q,val);
  else if(key==='opts'){ q.opts=parseInt(val)||4; q.key=(q.key||[]).filter(k=>k<qOptCount(q)); }
  else if(key==='digits') q.digits=Math.max(1,Math.min(4,parseInt(val)||2));
  else if(key==='keyNum') q.keyNum=String(val).replace(/\D/g,'');
  else if(key==='points') q.points=Math.max(0,Number(val)||0);
  else if(key==='skillId') q.skillId=val||null;
  else if(key==='skillName') q.skillName=String(val).trim();
  else if(key==='section') q.section=String(val).trim();
  else if(key==='partial') q.partial=!!val;
  saveDB(); renderApp();
}
function qToggleKey(i,j){
  const q=currentExam().questions[i]; q.key=q.key||[]; const p=q.key.indexOf(j);
  if(qType(q)==='multi'){ if(p>=0) q.key.splice(p,1); else q.key.push(j); } else q.key = p>=0 ? [] : [j];
  q.key.sort((a,b)=>a-b); saveDB(); renderApp();
}
function qBulk(kind){
  const e=currentExam(); const v=(document.getElementById('bulkVal_'+kind)||{}).value;
  e.questions.forEach(q=>{
    if(kind==='type') applyQType(q,v);
    if(kind==='opts' && (qType(q)==='mcq'||qType(q)==='multi'||qType(q)==='scale')){ q.opts=parseInt(v)||4; q.key=(q.key||[]).filter(k=>k<qOptCount(q)); }
    if(kind==='points' && qType(q)!=='scale'){ q.points=Math.max(0,Number(v)||0); }
  });
  saveDB(); toast('تم التطبيق على كل الأسئلة'); renderApp();
}
function qAdd(){
  const n=Math.max(1,Math.min(50,parseInt((document.getElementById('addN')||{}).value)||5)), e=currentExam(), last=e.questions[e.questions.length-1]||{};
  const t=(document.getElementById('addType')||{}).value||qType(last)||'mcq';
  for(let k=0;k<n;k++){ const q=makeQuestions(1,last.opts||4,t)[0]; q.n=e.questions.length+1; if(t!=='scale') q.points=last.points||1; e.questions.push(q); }
  saveDB(); renderApp();
}

function examSet(key,val){
  const e=currentExam(); if(!e) return;
  if(key==='idDigits') val=Math.max(1,Math.min(8,parseInt(val)||6));
  if(key==='showIdGrid') val=!!val;
  if(key==='subjectId'){ val=val||null; if(val){ const s=DB.subjects.find(x=>x.id===val); if(s && !e.subjectName) e.subjectName=s.name; if(s && !examTargets(e).length) e.targets=[{grade:s.grade,section:s.section}]; } }
  e[key]=val; saveDB(); renderApp();
}
/* ---- المراجعة: عرض كل الأنواع ---- */
function statusInfo(r, a){
  if(r.status==='correct') return ['✓ صحيحة','var(--good)'];
  if(r.status==='partial') return ['◐ جزئية','#b7791f'];
  if(r.status==='wrong') return ['✗ خاطئة','var(--bad)'];
  if(r.status==='blank') return ['⬜ فراغ','var(--warn)'];
  if(r.status==='double') return ['⚠ مزدوجة','#d35400'];
  if(r.status==='nokey') return ['بلا مفتاح','var(--muted)'];
  if(r.status==='survey') return ['استبانة','var(--blue)'];
  return ['يدوي','var(--muted)'];
}
function toggleMark(sheetId, n, j){
  const exam=currentExam(), sh=DB.sheets.find(s=>s.id===sheetId); if(!sh||!exam) return;
  const q=exam.questions.find(x=>x.n===n); if(!q) return; const t=qType(q);
  const a = sh.answers[n] = sh.answers[n] || {marks:[], flag:'blank', scores:[]};
  const p=a.marks.indexOf(j);
  if(p>=0) a.marks.splice(p,1);
  else if(t==='multi' || a.marks.length===0) a.marks.push(j);
  else a.marks=[j];
  a.marks.sort((x,y)=>x-y); a.flag = a.marks.length===0?'blank':(a.marks.length>1&&t!=='multi'?'double':'ok'); a.edited=true;
  saveDB(); renderApp();
}
function setNumAnswer(sheetId,n,val){
  const exam=currentExam(), sh=DB.sheets.find(s=>s.id===sheetId), q=exam.questions.find(x=>x.n===n);
  const d=String(val).replace(/\D/g,''); const a=sh.answers[n]=sh.answers[n]||{marks:[],flag:'blank',scores:[]};
  a.marks = d ? d.padStart(qDigits(q),'0').slice(-qDigits(q)).split('').map(Number) : []; a.flag=a.marks.length?'ok':'blank'; a.edited=true; saveDB(); renderApp();
}
function reviewCellHTML(exam, sh, q, r, a){
  const t=qType(q);
  if(t==='manual') return `<input type="number" step="any" min="0" max="${q.points}" value="${(sh.manual||{})[q.n]!=null?sh.manual[q.n]:''}" style="width:70px" onchange="setManualPts('${sh.id}',${q.n},this.value)"> / ${q.points}`;
  if(t==='num') return `<input value="${esc(a.marks&&a.marks.length?a.marks.map(m=>m<0?'؟':m).join(''):'')}" placeholder="${'؟'.repeat(qDigits(q))}" style="width:90px;${a.marks&&a.marks.some(m=>m<0)?'border-color:var(--bad)':''}" onchange="setNumAnswer('${sh.id}',${q.n},this.value)">`;
  return Array.from({length:qOptCount(q)},(_,j)=>{
    const sel=a.marks.includes(j), key=(q.key||[]).includes(j), showKey = key && r.status!=='correct' && t!=='scale';
    let bg='#fff',col='var(--ink)',bd='var(--line)', bw='1px solid';
    if(sel){ bw='2px solid'; if(t==='scale'){bg='#eaf2fb';col='var(--blue)';bd='var(--blue)';} else if(r.status==='correct'){bg='var(--good-bg)';col='var(--good)';bd='var(--good)';} else if(r.status==='double'){bg='#fdebd8';col='#d35400';bd='#d35400';} else if(r.status==='partial'){bg='#fdf3e0';col='#b7791f';bd='#b7791f';} else {bg='var(--bad-bg)';col='var(--bad)';bd='var(--bad)';} }
    else if(showKey){ bw='2px dashed'; bd='var(--good)'; }
    return `<button type="button" onclick="toggleMark('${sh.id}',${q.n},${j})" style="min-width:34px;height:30px;border-radius:8px;font-weight:900;border:${bw} ${bd};background:${bg};color:${col};cursor:pointer">${esc(optLabel(exam,q,j))}</button>`; }).join(' ');
}

function distractorTableHTML(exam, A){
  const items=A.items.filter(i=>qType(exam.questions.find(q=>q.n===i.n))!=='num');
  if(!items.length) return '<p style="font-size:.84rem;color:#6b7585">لا توجد أسئلة اختيار لتحليل مموّهاتها.</p>';
  const rows=items.map(it=>{
    const q=exam.questions.find(x=>x.n===it.n); const m=qOptCount(q);
    const cells=Array.from({length:m},(_,j)=>{ const isKey=(q.key||[]).includes(j), c=it.optCount[j];
      return `<td style="${isKey?'background:#eaf7ee;font-weight:800;color:#1e8449':''}">${c} <span style="color:#6b7585;font-size:.72rem">(${A.N?Math.round(c/A.N*100):0}%)</span><br><span style="color:#6b7585;font-size:.7rem">أعلى ${it.optU[j]} · أدنى ${it.optL[j]}</span></td>`; }).join('');
    return `<tr><td>${it.n}</td>${cells}${'<td></td>'.repeat(6-m)}<td>${it.blank}</td><td>${it.dbl}</td></tr>`; }).join('');
  return `<table style="width:100%;border-collapse:collapse;font-size:.8rem" border="1" cellpadding="4" bordercolor="#d9e0ea">
    <tr style="background:#eef3fa;color:#082B5A"><th>#</th>${[0,1,2,3,4,5].map(j=>`<th>${esc(optLabel(exam,{type:'mcq'},j))}</th>`).join('')}<th>فراغ</th><th>مزدوج</th></tr>${rows}</table>

}

function parseExternalRows(exam, rows){
  rows=(rows||[]).filter(r=>Array.isArray(r)&&r.some(c=>String(c).trim()!==''));
  if(!rows.length) return {entries:[], error:'الملف فارغ'};
  let hi=-1; const isNo=c=>/رقم|^no$|^id$|سجل|هويه|serial/i.test(normName(c)), isName=c=>/اسم|name/i.test(normName(c)) && !isNo(c), isAns=c=>/اجاب|answer/i.test(normName(c));
  for(let i=0;i<Math.min(rows.length,5);i++){ if(rows[i].some(c=>isNo(c)||isName(c)||isAns(c))){ hi=i; break; } }
  if(hi<0) return {entries:[], error:'لم يُعثر على صف العناوين (رقم الطالب / الاسم / الإجابات)'};
  const hdr=rows[hi], noC=hdr.findIndex(isNo), nameC=hdr.findIndex(isName), ansC=hdr.findIndex(isAns);
  const qCols={}; hdr.forEach((h,c)=>{ if(c===noC||c===nameC||c===ansC) return; const m=String(h).match(/(\d+)/); if(m && +m[1]>=1 && +m[1]<=exam.questions.length && qCols[+m[1]]===undefined) qCols[+m[1]]=c; });
  const readable=exam.questions.filter(q=>q.type!=='manual'); const entries=[];
  rows.slice(hi+1).forEach(r=>{
    const no=noC>=0?String(r[noC]==null?'':r[noC]).trim():'', name=nameC>=0?String(r[nameC]==null?'':r[nameC]).trim():'';
    if(!no && !name) return;
    const answers={}, put=(q,m)=>{ answers[q.n]={marks:m, flag:m.length===0?'blank':(m.length>1&&qType(q)!=='multi'&&qType(q)!=='num'?'double':'ok'), scores:[], imported:true}; };
    if(ansC>=0){ const toks=tokenizeAnswerString(r[ansC]); readable.forEach((q,i)=>{ if(toks[i]===undefined) return; put(q,tokenToMarks(q,toks[i])); }); }
    else Object.keys(qCols).forEach(n=>{ const q=exam.questions[+n-1]; if(!q||q.type==='manual') return; put(q,tokenToMarks(q,r[qCols[n]])); });
    if(Object.keys(answers).length) entries.push({no, name, answers});
  });
  return {entries, error: entries.length?null:'لم يُعثر على إجابات في الملف'};
}

function examSkillLabels(exam){
  const sub=examSubject(exam), out=[];
  exam.questions.forEach(q=>{ const l=String(q.skillName||'').trim() || ((sub&&sub.skills.find(s=>s.id===q.skillId))||{}).label || ''; if(l && !out.some(x=>normName(x)===normName(l))) out.push(l); });
  return out;
}
function ensureSubjectForClass(exam, grade, section){
  let s=DB.subjects.find(x=>x.examId===exam.id && x.grade===grade && x.section===section) || DB.subjects.find(x=>normName(x.name)===normName(exam.name) && x.grade===grade && x.section===section);
  const labels=examSkillLabels(exam), maxPts=exam.questions.filter(q=>q.type!=='scale').reduce((a,q)=>a+(Number(q.points)||0),0);
  if(!s){ s={id:uid('subj'), name:exam.name, grade, section, skills:[], defaultMax:Math.max(1,maxPts), teacher:'', kind:exam.kind||'', subjectTitle:exam.subjectName||'', examId:exam.id}; DB.subjects.push(s); s._new=true; }
  s.examId=exam.id; if(exam.kind) s.kind=exam.kind; if(exam.subjectName) s.subjectTitle=exam.subjectName;
  labels.forEach(l=>{ if(!s.skills.some(k=>normName(k.label)===normName(l))) s.skills.push({id:uid('sk'),label:l}); });
  if(!s.skills.length) s.defaultMax=Math.max(1,maxPts);
  return s;
}
function applyExamToClasses(exam, mode){
  const sheets=examSheets(exam).filter(s=>s.studentId && !s.excluded && !s.totalOnly);
  const byClass={}; sheets.forEach(sh=>{ const st=DB.students.find(x=>x.id===sh.studentId); if(!st) return; const k=st.grade+'||'+st.section; (byClass[k]=byClass[k]||{grade:st.grade,section:st.section,sheets:[]}).sheets.push(sh); });
  const result={classes:[], applied:0, created:0, skipped:0, noMap:0};
  Object.values(byClass).forEach(c=>{
    const s=ensureSubjectForClass(exam,c.grade,c.section); if(s._new){ result.created++; delete s._new; }
    const latest={}; c.sheets.forEach(sh=>{ if(!latest[sh.studentId]||sh.createdAt>=latest[sh.studentId].createdAt) latest[sh.studentId]=sh; });
    let ap=0;
    Object.keys(latest).forEach(stId=>{
      const sh=latest[stId], sc=scoreSheet(exam,sh), ex=getRecord(s.id,stId), has=ex&&(ex.status||Array.isArray(ex.mistakes)||ex.manualScore!=null);
      if(mode==='fill'&&has){ result.skipped++; return; }
      let rec;
      if(s.skills.length){ const mm=examSkillMistakes(exam,s,sc); if(!mm.assessed.length){ result.noMap++; return; } rec={status:'حاضر',mistakes:mm.missed}; }
      else rec={status:'حاضر', manualScore:Math.round(sc.pct*subjectMax(s)*100)/100};
      DB.scores[s.id]=DB.scores[s.id]||{}; DB.scores[s.id][stId]=rec; ap++;
    });
    result.applied+=ap; result.classes.push({subject:s.name,grade:c.grade,section:c.section,applied:ap,subjectId:s.id});
  });
  saveDB(); return result;
}

/* ================= استيراد الطلاب: أعمدة إضافية وعمود الصف/الفصل المدمج ================= */
function splitClassCell(v){
  v=String(v==null?'':v).trim(); if(!v) return {grade:'',section:''};
  if(/[\/\\|،,-]/.test(v)){ const p=v.split(/\s*[\/\\|،,-]\s*/).filter(Boolean); return {grade:p.slice(0,-1).join(' ')||p[0], section:p.length>1?p[p.length-1]:''}; }
  const t=v.split(/\s+/); if(t.length>1 && t[t.length-1].length<=2) return {grade:t.slice(0,-1).join(' '), section:t[t.length-1]};
  return {grade:v, section:''};
}
function parseStudentRows(rows){
  rows = (rows||[]).filter(r=>Array.isArray(r) && r.some(c=>String(c).trim()!==''));
  if(!rows.length) return [];
  const isNoCol = c=>/رقم|^\s*(no|id)\s*$/i.test(String(c));
  const isBoth = c=>{ const t=normName(c); return /الصف/.test(t) && /(الفصل|الشعبه)/.test(t); };
  const isName = c=>/اسم|الطالب|الطالبة|name/i.test(String(c)) && !isNoCol(c);
  const isGrade = c=>/^\s*(الصف|المرحلة|grade)/i.test(String(c)) && !isBoth(c);
  const isSec = c=>/^\s*(الفصل|الشعبة|section|class)/i.test(String(c)) && !isBoth(c);
  let headerIdx=-1, nameCol=-1, gradeCol=-1, secCol=-1, noCol=-1, bothCol=-1, hdr=null;
  for(let i=0;i<Math.min(rows.length,6);i++){
    const n = rows[i].findIndex(isName);
    if(n>=0){ headerIdx=i; hdr=rows[i]; nameCol=n; gradeCol=hdr.findIndex(isGrade); secCol=hdr.findIndex(isSec); noCol=hdr.findIndex(isNoCol); bothCol=hdr.findIndex(isBoth); break; }
  }
  let dataRows;
  if(headerIdx>=0){ dataRows = rows.slice(headerIdx+1); }
  else {
    const width = Math.max(...rows.map(r=>r.length)); let best=0, bestScore=-1;
    for(let c=0;c<width;c++){ const score = rows.filter(r=>{ const v=String(r[c]==null?'':r[c]).trim(); return v && isNaN(Number(v)); }).length; if(score>bestScore){ bestScore=score; best=c; } }
    nameCol = best; dataRows = rows;
  }
  const known=new Set([nameCol,gradeCol,secCol,noCol,bothCol]);
  const extraCols = hdr ? hdr.map((h,c)=>({c,label:String(h==null?'':h).trim()})).filter(x=>x.label && !known.has(x.c)) : [];
  const out = [];
  dataRows.forEach(r=>{
    const name = String(r[nameCol]==null?'':r[nameCol]).trim();
    if(!name || !isNaN(Number(name))) return;
    let grade = gradeCol>=0 ? String(r[gradeCol]||'').trim() : '', section = secCol>=0 ? String(r[secCol]||'').trim() : '';
    if(bothCol>=0 && (!grade||!section)){ const sp=splitClassCell(r[bothCol]); if(!grade) grade=sp.grade; if(!section) section=sp.section; }
    const x={name, grade, section, no: noCol>=0 ? String(r[noCol]==null?'':r[noCol]).trim() : ''};
    if(extraCols.length){ x.extra={}; extraCols.forEach(e=>{ const v=String(r[e.c]==null?'':r[e.c]).trim(); if(v) x.extra[e.label]=v; }); }
    out.push(x);
  });
  return out;
}
function confirmImport(){
  let added=0, skipped=0;
  const wantExtras=(document.getElementById('impExtras')||{}).checked;
  pendingImport.forEach(x=>{
    if(DB.students.some(s=>s.name===x.name && s.grade===x.grade && s.section===x.section)){ skipped++; return; }
    const st={id:uid('st'), name:x.name, grade:x.grade, section:x.section, no:x.no||''};
    if(wantExtras && x.extra){ st.extra={}; Object.keys(x.extra).forEach(label=>{ let f=studentFields().find(k=>normName(k.label)===normName(label)); if(!f){ f={id:uid('sf'),label}; studentFields().push(f); } st.extra[f.id]=x.extra[label]; }); }
    DB.students.push(st); added++;
  });
  pendingImport = []; saveDB();
  toast('أُضيف '+added+' طالبًا'+(skipped?' — تخطّي '+skipped+' مكرر':'')); renderApp();
}

    <div class="tbl-wrap" style="max-height:220px;overflow:auto"><table>

}

      ${rows||'<tr><td colspan="9" class="empty">لا توجد اختبارات — أضف اختبارًا أدناه أو استورد كشف درجات</td></tr>'}</table></div>

/* ---- محلّل كشف الدرجات ---- */
var pendingBoard=null;
function niceMax(v){ const L=[5,10,15,20,25,30,40,50,60,100]; for(const x of L) if(v<=x) return x; return Math.ceil(v/10)*10; }
function parseScoreboardRows(rows){
  rows=(rows||[]).filter(r=>Array.isArray(r)&&r.some(c=>String(c).trim()!==''));
  if(!rows.length) return {error:'الملف فارغ'};
  const isNo=c=>/رقم|^no$|^id$|سجل|هويه/i.test(normName(c)), isBoth=c=>{ const t=normName(c); return /الصف/.test(t)&&/(الفصل|الشعبه)/.test(t); };
  const isName=c=>/اسم|الطالب|name/i.test(normName(c)) && !isNo(c), isGrade=c=>/^(الصف|المرحله|grade)/i.test(normName(c))&&!isBoth(c), isSec=c=>/^(الفصل|الشعبه|section|class)/i.test(normName(c))&&!isBoth(c);
  let hi=-1; for(let i=0;i<Math.min(rows.length,6);i++){ if(rows[i].some(isName)){ hi=i; break; } }
  if(hi<0) return {error:'لم يُعثر على عمود «اسم الطالب»'};
  const hdr=rows[hi], nameC=hdr.findIndex(isName), noC=hdr.findIndex(isNo), gradeC=hdr.findIndex(isGrade), secC=hdr.findIndex(isSec), bothC=hdr.findIndex(isBoth);
  let data=rows.slice(hi+1), maxRow=null;
  if(data.length && /العظمي|النهايه|الدرجه الكليه|الدرجه القصوي|max/i.test(normName(data[0][nameC]))){ maxRow=data[0]; data=data.slice(1); }
  const skip=new Set([nameC,noC,gradeC,secC,bothC]); const cols=[];
  hdr.forEach((h,c)=>{
    if(skip.has(c)) return; const label=String(h==null?'':h).trim(); if(!label) return;
    const vals=data.map(r=>r[c]).filter(v=>String(v).trim()!==''); if(!vals.length) return;
    const numeric=vals.filter(v=>!isNaN(Number(v))).length; if(numeric<Math.max(1,Math.ceil(vals.length*0.5))) return;
    let name=label, max=null; let m=label.match(/[\(\[]\s*(\d+(?:\.\d+)?)\s*[\)\]]\s*$/) || label.match(/(?:\/|من)\s*(\d+(?:\.\d+)?)\s*$/);
    if(m){ max=Number(m[1]); name=label.slice(0,m.index).trim().replace(/[-–—:]+$/,'').trim()||label; }
    if(max==null && maxRow && maxRow[c]!=='' && !isNaN(Number(maxRow[c]))) max=Number(maxRow[c]);
    const obs=Math.max(...vals.filter(v=>!isNaN(Number(v))).map(Number)); if(max==null) max=niceMax(obs);
    cols.push({c,name,max,include:true});
  });
  if(!cols.length) return {error:'لم يُعثر على أعمدة درجات رقمية'};
  const recs=[]; data.forEach(r=>{
    const name=String(r[nameC]==null?'':r[nameC]).trim(); if(!name||!isNaN(Number(name))) return;
    let grade=gradeC>=0?String(r[gradeC]||'').trim():'', section=secC>=0?String(r[secC]||'').trim():'';
    if(bothC>=0&&(!grade||!section)){ const sp=splitClassCell(r[bothC]); if(!grade) grade=sp.grade; if(!section) section=sp.section; }
    recs.push({name, no:noC>=0?String(r[noC]==null?'':r[noC]).trim():'', grade, section, vals:cols.map(k=>r[k.c])});
  });
  return {cols, recs, hasClass:(gradeC>=0&&secC>=0)||bothC>=0};
}
function handleBoardFile(file){
  if(!file) return; if(typeof XLSX==='undefined'){ toast('مكتبة إكسل لم تُحمَّل'); return; }
  const fr=new FileReader();
  fr.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}); const p=parseScoreboardRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));
    if(p.error){ toast(p.error); return; } p.kind=((document.getElementById('bKind')||{}).value||'').trim(); p.dg=((document.getElementById('bGrade')||{}).value||'').trim(); p.ds=((document.getElementById('bSection')||{}).value||'').trim(); pendingBoard=p; renderApp(); }catch(e){ console.error(e); toast('تعذرت قراءة الملف'); } };
  fr.readAsArrayBuffer(file);
}
function boardApply(opts){
  const p=pendingBoard; const fv=(id,k)=>{ const el=document.getElementById(id); const v=el?String(el.value||'').trim():''; return v||String(p[k]||''); };
  const kind=fv('bKind','kind'), dg=fv('bGrade','dg'), ds=fv('bSection','ds');
  const sum={students:0,newStudents:0,records:0,subjectsNew:0,subjectsUsed:0,skippedSkills:[],noClass:0,absent:0};
  const created=new Set();
  p.recs.forEach(r=>{
    const grade=r.grade||dg, section=r.section||ds; if(!grade||!section){ sum.noClass++; return; }
    let st=null;
    if(r.no){ const hits=DB.students.filter(s=>normNo(s.no)===normNo(r.no)&&s.grade===grade&&s.section===section); if(hits.length===1) st=hits[0]; }
    if(!st) st=DB.students.find(s=>normName(s.name)===normName(r.name)&&s.grade===grade&&s.section===section);
    if(!st){ if(!opts.create) { sum.noClass++; return; } if(opts.dry){ sum.newStudents++; st={id:'__n'}; } else { st={id:uid('st'),name:r.name,grade,section,no:r.no||''}; DB.students.push(st); sum.newStudents++; } }
    sum.students++;
    p.cols.forEach((k,i)=>{
      if(!k.include) return; const v=r.vals[i]; if(v===''||v==null) return;
      let s=DB.subjects.find(x=>normName(x.name)===normName(k.name)&&x.grade===grade&&x.section===section);
      if(!s){ const key=k.name+'|'+grade+'|'+section; if(!created.has(key)){ created.add(key); sum.subjectsNew++; }
        if(opts.dry) return; s={id:uid('subj'),name:k.name,kind:kind.trim(),grade,section,skills:[],defaultMax:k.max,teacher:''}; DB.subjects.push(s); }
      else { const key='u'+s.id; if(!created.has(key)){ created.add(key); sum.subjectsUsed++; } if(s.skills.length){ if(!sum.skippedSkills.includes(s.name)) sum.skippedSkills.push(s.name); return; } }
      if(opts.dry){ sum.records++; return; }
      const ex=getRecord(s.id,st.id), has=ex&&(ex.status||ex.manualScore!=null||Array.isArray(ex.mistakes)); if(opts.mode==='fill'&&has) return;
      DB.scores[s.id]=DB.scores[s.id]||{};
      const t=String(v).trim();
      if(isNaN(Number(t))){ if(/^(غ|غائب|غياب)$/.test(t)){ DB.scores[s.id][st.id]={status:'غائب'}; sum.absent++; } return; }
      DB.scores[s.id][st.id]={status:'حاضر', manualScore:Math.max(0,Math.min(s.defaultMax,Number(t)))}; sum.records++;
    });
  });
  if(!opts.dry) saveDB(); return sum;
}
function showBoardPreview(){
  const box=document.getElementById('boardPreview'); if(!box||!pendingBoard) return; const p=pendingBoard;
  const create=(document.getElementById('bCreate')||{checked:true}).checked, mode=(document.getElementById('bMode')||{value:'replace'}).value;
  const sum=boardApply({create,mode,dry:true});
  box.innerHTML=`<p style="margin-top:12px"><b>${p.recs.length}</b> طالبًا · <b>${p.cols.length}</b> عمود درجات ${p.hasClass?'· الفصول من الملف':'· بلا أعمدة صف/فصل (يُستخدم الافتراضي)'}</p>
    <div class="tbl-wrap"><table><tr><th>تضمين</th><th>مسمّى الاختبار</th><th>الدرجة العظمى</th></tr>
      ${p.cols.map((k,i)=>`<tr><td><input type="checkbox" ${k.include?'checked':''} onchange="pendingBoard.cols[${i}].include=this.checked;showBoardPreview()"></td>
        <td><input value="${esc(k.name)}" onchange="pendingBoard.cols[${i}].name=this.value;showBoardPreview()"></td>
        <td><input type="number" min="1" step="any" value="${k.max}" style="width:90px" onchange="pendingBoard.cols[${i}].max=Number(this.value)||1;showBoardPreview()"></td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:8px"><label style="display:flex;gap:6px;align-items:center;font-weight:700;font-size:.85rem"><input type="checkbox" id="bCreate" ${create?'checked':''} onchange="showBoardPreview()"> إنشاء الطلاب غير الموجودين</label>
      <div class="field" style="margin:0"><select id="bMode" onchange="showBoardPreview()"><option value="replace" ${mode==='replace'?'selected':''}>استبدال الرصد الموجود</option><option value="fill" ${mode==='fill'?'selected':''}>تعبئة غير المرصودين فقط</option></select></div></div>
    <div class="kpi-grid" style="margin:10px 0"><div class="kpi"><div class="n">${sum.records}</div><div class="l">درجة ستُرصد</div></div><div class="kpi"><div class="n">${sum.subjectsNew}</div><div class="l">اختبارات جديدة</div></div>
      <div class="kpi"><div class="n">${sum.newStudents}</div><div class="l">طلاب جدد</div></div><div class="kpi"><div class="n" style="color:${sum.noClass?'var(--bad)':'inherit'}">${sum.noClass}</div><div class="l">بلا فصل/غير مطابق</div></div></div>
    ${sum.skippedSkills.length?`<p class="hint" style="color:var(--warn)">اختبارات لها مهارات لن تُحدَّث بدرجة عامة: ${sum.skippedSkills.map(esc).join('، ')}</p>`:''}
    <button class="btn btn-primary" onclick="confirmBoardImport()" ${sum.records?'':'disabled'}>✓ تطبيق الاستيراد</button> <button class="btn btn-ghost" onclick="pendingBoard=null;renderApp()">إلغاء</button>`;
}
function confirmBoardImport(){
  const create=(document.getElementById('bCreate')||{checked:true}).checked, mode=(document.getElementById('bMode')||{value:'replace'}).value;
  const sum=boardApply({create,mode}); pendingBoard=null;
  toast(`رُصدت ${sum.records} درجة · ${sum.subjectsNew} اختبار جديد · ${sum.newStudents} طالب جديد`); renderApp();
}
function downloadBoardTemplate(){
  if(typeof XLSX==='undefined'){ toast('مكتبة إكسل لم تُحمَّل'); return; }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['اسم الطالب','رقم الطالب','الصف','الفصل','لغتي (20)','رياضيات (20)','علوم (20)'],['أحمد سالم','000001','الرابع','أ',18,15,19],['منى خالد','000002','الرابع','أ',16,'غ',14],['فيصل عمر','000003','الخامس','ب',12,17,15]]),'الكشف'); XLSX.writeFile(wb,'قالب_كشف_الدرجات.xlsx');
}

/* ================= تشغيل التطبيق ================= */
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(e.key==='s' || e.key==='S'){ e.preventDefault(); saveCheckpoint(); }
  else if((e.key==='z'||e.key==='Z') && !['input','textarea'].includes(tag)){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.key==='y'||e.key==='Y') && !['input','textarea'].includes(tag)){ e.preventDefault(); redo(); }
});
initHistory();
