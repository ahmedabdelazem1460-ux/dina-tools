<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام تحليل الاختبارات التشخيصية — مدارس دينا العالمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{
  --navy:#082B5A; --blue:#005499; --cyan:#3AB1DB; --navy2:#06223f;
  --ink:#17212f; --muted:#667386; --line:#e3e9f2; --bg:#f2f5fa; --card:#ffffff;
  --good:#1e8449; --good-bg:#eaf7ee; --bad:#c0392b; --bad-bg:#fdedec; --warn:#b7791f; --warn-bg:#fdf3e0;
  --radius:16px; --shadow:0 1px 2px rgba(8,43,90,.05),0 8px 24px rgba(8,43,90,.06);
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{line-height:1.55}
h1,h2,h3{margin:0 0 .4em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.92rem}
::selection{background:rgba(58,177,219,.28)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c6d2e2;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ===== الهيكل ===== */
#app-shell{display:flex;min-height:100vh}
#sidebar{width:274px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:60;box-shadow:-6px 0 24px rgba(8,43,90,.18)}
.side-brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.side-logo{background:#fff;border-radius:12px;padding:6px 10px;display:flex;align-items:center;justify-content:center;min-width:54px;height:46px}
.side-logo img{height:34px;display:block}
.side-logo b{color:var(--navy);font-size:1.35rem;font-weight:900}
.side-name{font-weight:900;font-size:1rem;line-height:1.25}
.side-name small{display:block;font-weight:500;font-size:.72rem;color:#9ccbe6;margin-top:2px}
nav#tabs{padding:4px 12px 16px;flex:1}
.nav-group{margin-top:14px}
.nav-title{font-size:.7rem;font-weight:800;letter-spacing:.4px;color:#6fb9dc;padding:0 10px 6px;text-transform:uppercase}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;text-align:right;background:none;border:none;color:#d6e6f5;padding:10px 12px;border-radius:11px;font-weight:700;font-size:.9rem;transition:.15s;position:relative}
.nav-item .nav-ic{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.07);font-size:.95rem;flex:none}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(58,177,219,.30),rgba(58,177,219,.10));color:#fff}
.nav-item.active::before{content:'';position:absolute;right:-12px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--cyan)}
.nav-item.active .nav-ic{background:var(--cyan);color:var(--navy)}
.side-foot{padding:12px 18px 16px;font-size:.72rem;color:#8fb3cf;border-top:1px solid rgba(255,255,255,.08)}
#content{flex:1;min-width:0}
#topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#topbar .brand{display:none;align-items:center;gap:8px;font-weight:900;color:var(--navy)}
#topbar .badge{width:32px;height:32px;border-radius:9px;background:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);flex:none}
#topbar .spacer{flex:1}
#menuBtn{display:none;background:var(--navy);color:#fff;border:none;border-radius:10px;width:40px;height:40px;font-size:1.2rem}
.cur-lbl{font-size:.75rem;color:var(--muted);font-weight:700}
#topbar select{background:#fff;border:1px solid #d5dee9;border-radius:10px;padding:8px 10px;max-width:290px;font-weight:700;color:var(--navy)}
.pill{background:#eef3fa;color:var(--navy);border:1px solid #d9e3f0;border-radius:10px;padding:8px 12px;font-size:.83rem;font-weight:700;transition:.15s}
.pill:hover{background:#e2eaf5}
.pill[disabled]{opacity:.4;cursor:not-allowed}
#saveStamp{font-size:.7rem;color:var(--muted)}
main#app{max-width:1260px;margin:0 auto;padding:22px 22px 70px}
#navOverlay{display:none}

/* ===== رأس الصفحة ===== */
.page-head{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;background:linear-gradient(115deg,var(--navy) 0%,var(--blue) 62%,#1d86c2 100%);color:#fff;border-radius:20px;padding:20px 24px;margin-bottom:18px;box-shadow:0 10px 30px rgba(8,43,90,.22)}
.page-head::after{content:'';position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(58,177,219,.55),transparent 70%)}
.ph-icon{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none;z-index:1}
.ph-txt{z-index:1}.ph-txt h1{font-size:1.45rem;font-weight:900;margin:0}.ph-txt p{margin:2px 0 0;color:#cfe6f5;font-size:.9rem;max-width:760px}
.ph-deco{position:absolute;left:18px;bottom:-12px;width:120px;height:120px;z-index:0}

/* ===== البطاقات والمكونات ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.03rem;color:var(--navy);display:flex;align-items:center;gap:9px;margin-bottom:12px;font-weight:800}
.card>h2::before,.card>.row>h2::before{content:'';width:4px;height:18px;border-radius:3px;background:linear-gradient(var(--cyan),var(--blue));flex:none}
.card h3{color:var(--navy)}
.sub-h{margin-top:18px;font-size:.92rem;color:var(--navy);font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start}
.grid2 .card{margin-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:.76rem;font-weight:800;color:var(--muted)}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{padding:9px 12px;border:1px solid #d5dee9;border-radius:10px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(58,177,219,.22)}
input[disabled],select[disabled]{background:#f1f4f8;color:#8a97a8}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:16px;height:16px}
input[type=range]{accent-color:var(--blue)}
textarea{resize:vertical;min-height:46px}
.btn{border:none;border-radius:11px;padding:9px 17px;font-weight:800;font-size:.87rem;transition:transform .12s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.nav-item:focus-visible,.pill:focus-visible{outline:3px solid rgba(58,177,219,.55);outline-offset:2px}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;box-shadow:0 4px 12px rgba(0,84,153,.28)}
.btn-primary:hover{box-shadow:0 6px 16px rgba(0,84,153,.36)}
.btn-ghost{background:#eef3fa;color:var(--navy)}.btn-ghost:hover{background:#e0e9f5}
.btn-danger{background:var(--bad-bg);color:var(--bad)}.btn-danger:hover{background:#fadbd8}
.btn-cta{background:linear-gradient(135deg,#4fc3ec,var(--cyan));color:var(--navy);box-shadow:0 6px 16px rgba(58,177,219,.4)}
.btn-light{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}.btn-light:hover{background:rgba(255,255,255,.26)}
.btn-sm{padding:5px 11px;font-size:.78rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1}
.toolbar.sub{background:#f6f9fd;border:1px dashed #cfdbea;border-radius:12px;padding:8px 12px;font-size:.85rem}
.search{min-width:230px}

/* ===== الجداول ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 10px;border-bottom:1px solid #edf1f7;text-align:center}
th{background:#f1f5fa;color:var(--navy);font-weight:800;font-size:.78rem;position:sticky;top:0;z-index:1;white-space:nowrap}
td:first-child,th:first-child{text-align:right}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:#fafcfe}
tr:hover td{background:#f1f7fd !important}
tr:last-child td{border-bottom:none}
.tbl-wrap table input:not([type=checkbox]){padding:6px 9px;border-radius:8px}

/* ===== مؤشرات وشارات ===== */
.badge-level{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.76rem;font-weight:800}
.badge-level.tag{background:#e8f2fb;color:var(--blue);font-size:.7rem;padding:2px 9px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,#f7faff,#f1f5fb);border:1px solid #e3ebf5;border-radius:14px;padding:14px 10px;text-align:center}
.kpi .n{font-size:1.45rem;font-weight:900;color:var(--navy);line-height:1.2}
.kpi .l{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--c,var(--blue))}
.stat-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;background:color-mix(in srgb,var(--c,#005499) 14%,#fff);flex:none}
.stat-n{font-size:1.55rem;font-weight:900;color:var(--navy);line-height:1.1}.stat-l{font-size:.78rem;color:var(--muted);font-weight:700}
.pillbar{height:10px;border-radius:999px;background:#e9edf3;overflow:hidden}
.pillbar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eaf1fa;border:1px solid #d7e4f3;border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700;color:var(--navy);margin:2px}
.chip button{background:none;border:none;color:var(--bad);font-weight:900;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.92rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px}
.skill-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);font-weight:900;cursor:pointer;background:#fff;transition:.12s}
.skill-toggle:hover{border-color:var(--cyan)}
.skill-toggle.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.skill-toggle.off{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:8px;font-weight:700;font-size:.88rem}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}

/* ===== الرئيسية ===== */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 60%,#2096d0 100%);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:0 14px 36px rgba(8,43,90,.26)}
.hero::before{content:'';position:absolute;left:-80px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(58,177,219,.6),transparent 68%)}
.hero-txt{position:relative;z-index:1}.hero-txt h2{font-size:1.7rem;font-weight:900;margin:0 0 6px;color:#fff}.hero-txt p{margin:0;color:#d4e8f6;max-width:620px}
.hero-logo{position:relative;z-index:1;height:84px;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}
.step-n{width:36px;height:36px;border-radius:50%;background:#e4ebf4;color:var(--muted);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.step-b{flex:1;display:flex;flex-direction:column}.step-b b{color:var(--navy)}.step-b span{font-size:.8rem;color:var(--muted)}
.step.done{background:var(--good-bg);border-color:#cfe9d7}.step.done .step-n{background:var(--good);color:#fff}
.step.now{border-color:var(--cyan);background:#f0faff;box-shadow:0 0 0 3px rgba(58,177,219,.18)}.step.now .step-n{background:var(--cyan);color:var(--navy)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.shortcuts button{display:flex;align-items:center;gap:10px;background:#f4f8fd;border:1px solid #dde7f3;border-radius:13px;padding:12px;font-weight:800;color:var(--navy);text-align:right;transition:.15s}
.shortcuts button:hover{background:#e6f1fb;border-color:var(--cyan);transform:translateY(-2px)}
.shortcuts button span{font-size:1.35rem}

#toast{position:fixed;bottom:22px;right:50%;transform:translate(50%,14px);max-width:420px;background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:.88rem;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:999;text-align:center;box-shadow:0 10px 30px rgba(8,43,90,.35)}
#toast.show{opacity:1;transform:translate(50%,0)}
details>summary{cursor:pointer}

/* ===== الطباعة وأوراق الإجابة ===== */
.print-only{display:none}
#printArea{display:none}
.sheet-page{width:210mm;height:297mm;page-break-after:always;overflow:hidden;position:relative;background:#fff}
.sheet-page svg{width:210mm;height:297mm;display:block}
.sheet-prev svg{width:100%;height:auto;display:block}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
  body.print-sheets #app-shell,body.print-sheets #toast{display:none !important}
  body.print-sheets #printArea{display:block}
  body.print-sheets{background:#fff}
  #sidebar,#topbar,.page-head,#navOverlay,.no-print{display:none !important}
  #app-shell{display:block}
  main#app{max-width:100%;padding:0;margin:0}
  .card{box-shadow:none;border:none;page-break-inside:avoid}
  .print-only{display:block}
  .page-break{page-break-before:always}
  body{background:#fff}
}

/* ===== شاشات صغيرة ===== */
@media (max-width:960px){
  #sidebar{position:fixed;right:0;top:0;transform:translateX(105%);transition:transform .25s;width:min(300px,86vw)}
  body.nav-open #sidebar{transform:none}
  body.nav-open #navOverlay{display:block;position:fixed;inset:0;background:rgba(6,22,44,.5);z-index:55}
  #menuBtn{display:block}
  #topbar .brand{display:flex}
  #topbar{padding:8px 12px}
  main#app{padding:14px 12px 60px}
  .page-head{padding:16px;border-radius:16px}.ph-txt h1{font-size:1.15rem}.ph-icon{width:44px;height:44px;font-size:1.3rem}
  .hero{flex-direction:column;align-items:flex-start;padding:20px}.hero-logo{height:60px}
  .cur-lbl{display:none}
}
/* ===== الوضع الداكن ===== */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#e8eef6;--muted:#9db0c6;--line:#243247;--bg:#0c1522;--card:#111d2e;--good-bg:#12301f;--bad-bg:#3a1a17;--warn-bg:#3a2c12;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  :root:not([data-theme="light"]) #topbar{background:rgba(17,29,46,.9)}
  :root:not([data-theme="light"]) input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:#0c1522;color:var(--ink);border-color:#2a3a52}
  :root:not([data-theme="light"]) th{background:#16253a}
  :root:not([data-theme="light"]) .kpi{background:#16253a;border-color:#243247}
  :root:not([data-theme="light"]) .btn-ghost,:root:not([data-theme="light"]) .pill{background:#1a2b42;color:#d6e6f5;border-color:#2a3a52}
  :root:not([data-theme="light"]) tr:hover td{background:#16253a !important}
  :root:not([data-theme="light"]) table tr:nth-child(even) td{background:#0f1a2a}
  :root:not([data-theme="light"]) .step{background:#0f1a2a}
  :root:not([data-theme="light"]) .chip{background:#1a2b42;border-color:#2a3a52;color:#d6e6f5}
  :root:not([data-theme="light"]) .shortcuts button{background:#14243a;border-color:#243247;color:#d6e6f5}
  :root:not([data-theme="light"]) #topbar select{background:#0c1522;color:#d6e6f5}
}
</style>
</head>
<body>

<div id="app-shell">
  <aside id="sidebar" class="no-print" aria-label="القائمة الرئيسية">
    <div class="side-brand"><div class="side-logo" id="sideLogo"><b>د</b></div><div class="side-name" id="sideName">مدارس دينا<small>منظومة الاختبارات والتحليل</small></div></div>
    <nav id="tabs"></nav>
    <div class="side-foot">تُحفظ البيانات محليًا في متصفحك · خذ نسخة احتياطية دوريًا</div>
  </aside>
  <div id="navOverlay" onclick="toggleNav(false)"></div>
  <div id="content">
    <header id="topbar" class="no-print">
      <button id="menuBtn" type="button" onclick="toggleNav()" aria-label="القائمة">☰</button>
      <div class="brand"><span id="topbarLogoWrap" style="display:none;background:#fff;border-radius:9px;padding:3px 8px;border:1px solid #e3e9f2"><img id="topbarLogo" style="height:26px;display:block" alt="شعار"></span><span class="badge" id="topbarBadge">د</span><span id="schoolNameLabel">مدارس دينا العالمية</span></div>
      <div class="spacer"></div>
      <span class="cur-lbl">الاختبار الحالي</span>
      <select id="subjectSwitcher" aria-label="الاختبار الحالي"></select>
      <button class="pill" id="newSubjectBtn" type="button">+ اختبار جديد</button>
      <span style="display:flex;gap:6px;align-items:center">
        <button class="pill" id="undoBtn" type="button" title="تراجع (Ctrl+Z)">↩ تراجع</button>
        <button class="pill" id="redoBtn" type="button" title="إعادة (Ctrl+Y)">↪ إعادة</button>
        <button class="pill" id="saveBtn" type="button" title="حفظ نقطة (Ctrl+S)" style="background:linear-gradient(135deg,#4fc3ec,var(--cyan));color:var(--navy);border-color:var(--cyan)">💾 حفظ</button>
        <span id="saveStamp"></span></span>
    </header>
    <main id="app"></main>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   نظام تحليل الاختبارات التشخيصية — نسخة مرنة (بدون عدد مهارات ثابت)
   تخزين محلي بالكامل (localStorage) + تصدير/استيراد JSON
   مدارس دينا الأهلية
   ========================================================= */

function loadDB(){
  try{

      if(parsed && parsed.meta && parsed.students && parsed.subjects) return parsed;
    }
  }catch(e){ console.warn('تعذرت قراءة البيانات المحفوظة', e); }
  return defaultDB();
}

let UI = { subjectId: (DB.subjects[0] && DB.subjects[0].id) || null, tab:'home', cardStudentId:null };

/* ===== سجل التراجع/الإعادة + نقطة الحفظ ===== */
var undoStack = [], redoStack = [], currentSnap = null, applyingHistory = false;
function initHistory(){ currentSnap = JSON.stringify(DB); undoStack=[]; redoStack=[]; updateHistoryButtons(); }
function saveDB(){
  const snap = JSON.stringify(DB);
  if(!applyingHistory && currentSnap !== null && snap !== currentSnap){
    undoStack.push(currentSnap); if(undoStack.length>60) undoStack.shift();
    redoStack = [];
  }
  currentSnap = snap;
  try{ localStorage.setItem(LS_KEY, snap); }
  catch(e){ toast('تعذر الحفظ محليًا — المساحة ممتلئة؟'); }
  updateHistoryButtons();
}
function updateHistoryButtons(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u) u.disabled = undoStack.length===0;
  if(r) r.disabled = redoStack.length===0;
}
function undo(){
  if(!undoStack.length){ toast('لا يوجد ما يمكن التراجع عنه'); return; }
  redoStack.push(currentSnap);
  const prev = undoStack.pop();
  applyingHistory = true; DB = JSON.parse(prev); saveDB(); applyingHistory = false;
  ensureSubjectValid(); toast('تم التراجع'); renderApp();
}
function redo(){
  if(!redoStack.length){ toast('لا يوجد ما يمكن إعادته'); return; }
  undoStack.push(currentSnap);
  const nxt = redoStack.pop();
  applyingHistory = true; DB = JSON.parse(nxt); saveDB(); applyingHistory = false;
  ensureSubjectValid(); toast('تمت الإعادة'); renderApp();
}
function ensureSubjectValid(){
  if(!DB.subjects.find(s=>s.id===UI.subjectId)) UI.subjectId = (DB.subjects[0]&&DB.subjects[0].id)||null;
}
function saveCheckpoint(){
  try{
    localStorage.setItem(LS_SAVED_KEY, JSON.stringify({at:Date.now(), db:DB}));
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    showSaveStamp(); toast('✓ تم حفظ البيانات');
  }catch(e){ toast('تعذر الحفظ — المساحة ممتلئة؟'); }
}
function showSaveStamp(){
  const el=document.getElementById('saveStamp'); if(!el) return;
  try{
    const c = JSON.parse(localStorage.getItem(LS_SAVED_KEY)||'null');
    el.textContent = c ? 'آخر حفظ: '+new Date(c.at).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}) : '';
  }catch(e){}
}
function restoreCheckpoint(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_SAVED_KEY)||'null');
    if(!c){ toast('لا توجد نقطة حفظ'); return; }
    if(!confirm('سيُسترجع آخر ما حفظته بزر «حفظ» وتُلغى التعديلات اللاحقة. متابعة؟')) return;
    DB = c.db; saveDB(); ensureSubjectValid(); toast('تم الاسترجاع'); renderApp();
  }catch(e){ toast('تعذر الاسترجاع'); }
}
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2400);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(n){ return (Math.round(n*1000)/10)+'%'; }

function currentSubject(){ return DB.subjects.find(s=>s.id===UI.subjectId) || null; }
function subjectStudents(subject){
  if(!subject) return [];
  return DB.students.filter(st => st.grade===subject.grade && st.section===subject.section);
}
function getRecord(subjectId, studentId){
  DB.scores[subjectId] = DB.scores[subjectId] || {};
  return DB.scores[subjectId][studentId] || null;
}
function setRecord(subjectId, studentId, rec){
  DB.scores[subjectId] = DB.scores[subjectId] || {};
  DB.scores[subjectId][studentId] = rec;
  saveDB();
}
function sortLevels(){ DB.meta.levels.sort((a,b)=> b.min - a.min); }
function levelFor(p){
  const levels = DB.meta.levels;
  for(const l of levels){ if(p >= l.min) return l; }
  return levels[levels.length-1];
}
function levelColor(levelName){
  const l = DB.meta.levels.find(x=>x.name===levelName);
  const c = (l && l.color) || '#005499';
  return {fg:c, bg:hexToTint(c)};
}
function hexToTint(hex){
  hex = hex.replace('#','');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return `rgba(${r},${g},${b},0.12)`;
}

function computeResult(subjectId, studentId){
  const subject = DB.subjects.find(s=>s.id===subjectId);
  const rec = getRecord(subjectId, studentId);
  if(!subject) return {present:false, status:'—'};
  if(rec && (rec.status==='غائب' || rec.status==='لم يختبر')){
    return {present:false, status: rec.status};
  }
  // حالة فارغة = حاضر افتراضيًا، بشرط وجود رصد فعلي (أو اختيار «حاضر» صراحة)
  const hasData = rec && (rec.status==='حاضر' || Array.isArray(rec.mistakes) || (rec.manualScore!=null && rec.manualScore!==''));
  if(!hasData){
    return {present:false, status:'لم يُرصد'};
  }
  if(subject.skills.length > 0){
    const total = subject.skills.length;
    const missedSet = new Set(rec.mistakes||[]);
    const masteredSkills = subject.skills.filter(sk=>!missedSet.has(sk.id));
    const missedSkills = subject.skills.filter(sk=>missedSet.has(sk.id));
    const p = total>0 ? masteredSkills.length/total : 0;
    return {present:true, pct:p, total, masteredCount:masteredSkills.length, missedCount:missedSkills.length, masteredSkills, missedSkills, mode:'skills'};
  } else {
    const max = (Number(subject.defaultMax)||100);
    const score = (rec.manualScore!=null && rec.manualScore!=='') ? Number(rec.manualScore) : 0;
    const p = max>0 ? Math.min(1, score/max) : 0;
    return {present:true, pct:p, score:Math.min(score,max), max, mode:'general'};
  }
}

function parseNumberList(str){
  if(!str) return [];
  return String(str).split(/[,،]/).map(s=>s.trim()).filter(Boolean).map(Number).filter(n=>!isNaN(n));
}

function addSkill(subjId){
  const input = document.getElementById('newSkillLabel');
  const label = input.value.trim();
  if(!label){ toast('اكتب اسم المهارة'); return; }
  const s = DB.subjects.find(x=>x.id===subjId);
  s.skills.push({id:uid('sk'), label});
  saveDB(); editSubjectSkills(subjId);
}
function moveSkill(subjId, i, d){
  const s = DB.subjects.find(x=>x.id===subjId), j=i+d;
  if(!s || j<0 || j>=s.skills.length) return;
  [s.skills[i], s.skills[j]] = [s.skills[j], s.skills[i]]; saveDB(); editSubjectSkills(subjId);
}
function bulkAddSkills(subjId){
  const lines = document.getElementById('bulkSkills').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length){ toast('اكتب مهارة واحدة على الأقل'); return; }
  const s = DB.subjects.find(x=>x.id===subjId);
  lines.forEach(label=> s.skills.push({id:uid('sk'), label}));
  saveDB(); toast('أُضيفت '+lines.length+' مهارة'); editSubjectSkills(subjId);
}
function renameSkill(subjId, skillId, val){
  const s = DB.subjects.find(x=>x.id===subjId);
  const sk = s.skills.find(x=>x.id===skillId);
  if(sk){ sk.label = val.trim() || sk.label; saveDB(); toast('تم التحديث'); }
}
function removeSkill(subjId, skillId){
  if(!confirm('حذف هذه المهارة؟')) return;
  const s = DB.subjects.find(x=>x.id===subjId);
  s.skills = s.skills.filter(x=>x.id!==skillId);
  // clean up any recorded mistakes referencing it
  const subjScores = DB.scores[subjId]||{};
  Object.values(subjScores).forEach(rec=>{ if(rec.mistakes) rec.mistakes = rec.mistakes.filter(id=>id!==skillId); });
  saveDB(); editSubjectSkills(subjId);
}
function updateDefaultMax(subjId, val){
  const s = DB.subjects.find(x=>x.id===subjId);
  s.defaultMax = Math.max(1, Number(val)||100);
  saveDB(); toast('تم التحديث');
}

var pendingImport = [];
function handleExcelFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('مكتبة إكسل لم تُحمَّل — تحقق من الاتصال بالإنترنت'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      showImportPreview(parseStudentRows(rows));
    }catch(e){ console.error(e); toast('تعذرت قراءة الملف'); }
  };
  reader.readAsArrayBuffer(file);
}
function downloadStudentsTemplate(){
  if(typeof XLSX==='undefined'){ toast('مكتبة إكسل لم تُحمَّل'); return; }
  const ws = XLSX.utils.aoa_to_sheet([['اسم الطالب','الصف','الفصل'],['أحمد سالم','الرابع','أ'],['منى خالد','الرابع','أ']]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
  XLSX.writeFile(wb, 'قالب_أسماء_الطلاب.xlsx');
}
function updateStudentField(id, field, val){
  const st = DB.students.find(x=>x.id===id); if(!st) return;
  val = val.trim(); if(!val && field!=='no'){ toast('لا يمكن ترك الحقل فارغًا'); renderApp(); return; }
  st[field]=val; saveDB(); toast('تم التحديث'); renderApp();
}

function deleteStudent(id){
  if(!confirm('حذف هذا الطالب؟ ستُحذف كل درجاته في كل المواد.')) return;
  DB.students = DB.students.filter(s=>s.id!==id);

function updateStatus(subjId, stId, val){
  const rec = getRecord(subjId, stId) || {};
  rec.status = val; setRecord(subjId, stId, rec); renderApp();
}
function updateMistakes(subjId, stId, val){
  const subject = DB.subjects.find(s=>s.id===subjId);
  const nums = parseNumberList(val);
  const bad = nums.filter(n=>!subject.skills[n-1]);
  if(bad.length) toast('أرقام خارج النطاق (1 إلى '+subject.skills.length+') تم تجاهلها: '+bad.join('،'));
  const ids = nums.map(n=> subject.skills[n-1] ? subject.skills[n-1].id : null).filter(Boolean);
  const rec = getRecord(subjId, stId) || {};
  rec.mistakes = ids; setRecord(subjId, stId, rec); renderApp();
}
function subjectMax(subject){
  return subject.skills.length>0 ? subject.skills.length : (Number(subject.defaultMax)||100);
}
function updateManual(subjId, stId, field, val){
  const subject = DB.subjects.find(s=>s.id===subjId);
  const rec = getRecord(subjId, stId) || {};
  let v = val===''? null : Number(val);
  if(v!=null && field==='manualScore'){
    const mx = subjectMax(subject);
    if(isNaN(v) || v<0){ toast('أدخل درجة صحيحة'); renderApp(); return; }
    if(v>mx){ toast('الدرجة أكبر من الحد الأقصى ('+mx+') — تم ضبطها عليه'); v = mx; }
  }
  rec[field] = v;
  setRecord(subjId, stId, rec); renderApp();
}
function activeStudents(subjId){
  const subject = DB.subjects.find(s=>s.id===subjId);
  return subjectStudents(subject).filter(st=>{
    const r = getRecord(subjId, st.id);
    return !(r && (r.status==='غائب' || r.status==='لم يختبر'));
  });
}
function applyBulkScore(subjId){
  const subject = DB.subjects.find(s=>s.id===subjId);
  const raw = document.getElementById('bulkScore').value;
  if(raw===''){ toast('اكتب الدرجة أولًا'); return; }
  let v = Number(raw), mx = subjectMax(subject);
  if(isNaN(v) || v<0){ toast('درجة غير صحيحة'); return; }
  if(v>mx){ toast('الدرجة أكبر من الحد الأقصى ('+mx+')'); return; }
  const list = activeStudents(subjId);
  list.forEach(st=>{ const rec = getRecord(subjId, st.id) || {}; rec.manualScore = v; DB.scores[subjId] = DB.scores[subjId]||{}; DB.scores[subjId][st.id]=rec; });
  saveDB(); toast('تم تطبيق الدرجة '+v+' على '+list.length+' طالبًا'); renderApp();
}
function applyBulkMistakes(subjId){
  const subject = DB.subjects.find(s=>s.id===subjId);
  const nums = parseNumberList(document.getElementById('bulkMistakes').value);
  const bad = nums.filter(n=>!subject.skills[n-1]);
  if(bad.length){ toast('أرقام خارج النطاق (1 إلى '+subject.skills.length+'): '+bad.join('،')); return; }
  const ids = nums.map(n=>subject.skills[n-1].id);
  const list = activeStudents(subjId);
  list.forEach(st=>{ const rec = getRecord(subjId, st.id) || {}; rec.mistakes = ids.slice(); DB.scores[subjId] = DB.scores[subjId]||{}; DB.scores[subjId][st.id]=rec; });
  saveDB(); toast('تم التطبيق على '+list.length+' طالبًا'); renderApp();
}
function applyBulkStatus(subjId){
  const v = document.getElementById('bulkStatus').value;
  if(!v){ toast('اختر الحالة'); return; }
  const subject = DB.subjects.find(s=>s.id===subjId);
  const list = subjectStudents(subject);
  list.forEach(st=>{ const rec = getRecord(subjId, st.id) || {}; rec.status = v; DB.scores[subjId] = DB.scores[subjId]||{}; DB.scores[subjId][st.id]=rec; });
  saveDB(); toast('تم تطبيق الحالة على '+list.length+' طالبًا'); renderApp();
}
function openSkillToggles(subjId, stId){
  const subject = DB.subjects.find(s=>s.id===subjId);
  const st = DB.students.find(x=>x.id===stId);
  const rec = getRecord(subjId, stId) || {mistakes:[]};
  const missed = new Set(rec.mistakes||[]);
  const toggles = subject.skills.map((sk,i)=>{
    const isOn = !missed.has(sk.id); // "on" = mastered
    return `<button type="button" class="skill-toggle ${isOn?'on':'off'}" title="${esc(sk.label)}"
              onclick="toggleSkill('${subjId}','${stId}','${sk.id}')">${i+1}</button>`;
  }).join(' ');
  document.getElementById('skillToggleModal').innerHTML = `
    <div class="card" style="position:sticky;bottom:10px;border:2px solid var(--cyan)">
      <h2>تحديد يدوي — ${esc(st.name)}</h2>
      <p class="hint">أخضر = متقن، أحمر = غير متقن. اضغط للتبديل.</p>
      <div>${toggles}</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="document.getElementById('skillToggleModal').innerHTML=''">إغلاق</button>
    </div>`;
}
function toggleSkill(subjId, stId, skillId){
  const rec = getRecord(subjId, stId) || {mistakes:[]};
  rec.mistakes = rec.mistakes || [];
  const i = rec.mistakes.indexOf(skillId);
  if(i>=0) rec.mistakes.splice(i,1); else rec.mistakes.push(skillId);
  setRecord(subjId, stId, rec);
  renderApp();
  setTimeout(()=>openSkillToggles(subjId, stId), 0);
}

let chartInstances = {};
function destroyChart(key){ if(chartInstances[key]){ chartInstances[key].destroy(); delete chartInstances[key]; } }

function renderDashboardTab(main){
  const subject = currentSubject();
  if(!subject){ main.innerHTML = noSubjectCard(); return; }
  const students = subjectStudents(subject);
  const results = students.map(st=>({st, res:computeResult(subject.id, st.id)}));
  const present = results.filter(r=>r.res.present);
  const absentCount = results.filter(r=>r.res.status==='غائب').length;
  const untestedCount = results.filter(r=>r.res.status==='لم يختبر' || (!r.res.present && r.res.status!=='غائب')).length;

  // raw score (not %) per present student, for KPI row + level ranges
  function rawScore(r){
    if(r.res.mode==='skills') return {score:r.res.masteredCount, max:r.res.total};
    return {score:r.res.score, max:r.res.max};
  }
  const subjMax = present.length ? rawScore(present[0]).max : (subject.skills.length||subject.defaultMax||100);
  const scores = present.map(r=>rawScore(r).score);
  const highScore = scores.length ? Math.max(...scores) : 0;
  const lowScore = scores.length ? Math.min(...scores) : 0;
  const sumScore = scores.reduce((a,b)=>a+b,0);
  const avgScore = scores.length ? sumScore/scores.length : 0;
  const avgPct = present.length ? present.reduce((a,r)=>a+r.res.pct,0)/present.length : 0;

  const byLevel = {};
  DB.meta.levels.forEach(l=> byLevel[l.name]=0);
  present.forEach(r=>{ const lv = levelFor(r.res.pct); byLevel[lv.name]++; });

  // level ranges in raw-score units, derived from % thresholds × subject max
  const sortedLevels = DB.meta.levels; // already sorted desc by min
  const levelRanges = sortedLevels.map((l,i)=>{
    const lo = Math.round(l.min*subjMax*100)/100;
    const hi = i===0 ? subjMax : Math.round((sortedLevels[i-1].min*subjMax - 0.01)*100)/100;
    return {name:l.name, color:l.color, lo, hi, count: byLevel[l.name]||0};
  });

  let skillStats = [];
  if(subject.skills.length>0){
    skillStats = subject.skills.map(sk=>{
      let masteredN=0, total=0;
      present.forEach(r=>{
        total++;
        const missed = new Set(r.res.missedSkills ? r.res.missedSkills.map(s=>s.id) : []);
        if(!missed.has(sk.id)) masteredN++;
      });
      return {label:sk.label, pct: total? masteredN/total : 0, masteredN, total};
    });
  }

  const ringHtml = sortedLevels.map(l=>{
    const n = byLevel[l.name]||0;
    const p = present.length ? Math.round(n/present.length*100) : 0;
    return `
      <div style="text-align:center">
        <div style="width:86px;height:86px;border-radius:50%;margin:0 auto;
          background:conic-gradient(${l.color} ${p*3.6}deg, #e9edf3 0deg);
          display:flex;align-items:center;justify-content:center">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;color:${l.color}">${p}%</div>
        </div>
        <div style="font-size:.8rem;font-weight:800;margin-top:6px;color:var(--navy)">${esc(l.name)}</div>
      </div>`;
  }).join('');

  const maxCount = Math.max(1, ...sortedLevels.map(l=>byLevel[l.name]||0));
  const barsHtml = sortedLevels.map(l=>{
    const n = byLevel[l.name]||0;
    const h = Math.round(n/maxCount*90)+10;
    return `
      <div style="text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">

function csvEsc(v){ v=String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }

/* ================= محرّك التحليل الذكي ================= */
function passMark(){ const L=DB.meta.levels; return L.length>=2 ? L[L.length-2].min : 0.5; }
function quantile(sortedAsc, q){
  const n=sortedAsc.length; if(!n) return 0;
  const pos=(n-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos);
  return sortedAsc[lo] + (sortedAsc[hi]-sortedAsc[lo])*(pos-lo);
}
function levelIndexOf(p){ const L=DB.meta.levels; for(let i=0;i<L.length;i++){ if(p>=L[i].min) return i; } return L.length-1; }

function analyzeSubject(subject){
  const students = subjectStudents(subject);
  const rows = students.map(st=>({st, res:computeResult(subject.id, st.id)}));
  const present = rows.filter(r=>r.res.present);
  const N = present.length;
  const sorted = present.map(r=>r.res.pct).sort((a,b)=>a-b);
  const mean = N ? sorted.reduce((a,b)=>a+b,0)/N : 0;
  const sd = N ? Math.sqrt(sorted.reduce((a,b)=>a+(b-mean)*(b-mean),0)/N) : 0;
  const hist = new Array(10).fill(0);
  sorted.forEach(p=>{ hist[Math.min(9, Math.floor(p*10+1e-9))]++; });
  const ranking = present.slice().sort((a,b)=>b.res.pct-a.res.pct);
  let lastP=null, lastRank=0;
  ranking.forEach((r,i)=>{ if(r.res.pct!==lastP){ lastRank=i+1; lastP=r.res.pct; } r.rank=lastRank;
    r.below = sorted.filter(x=>x<r.res.pct-1e-12).length; r.percentile = N? Math.round(r.below/N*100):0; });
  const pm = passMark();
  const atRisk = ranking.filter(r=>r.res.pct<pm).reverse();
  const nearNext = present.filter(r=>{
    const i=levelIndexOf(r.res.pct); if(i===0) return false;
    const gap = DB.meta.levels[i-1].min - r.res.pct; return gap>1e-9 && gap<=0.05+1e-9;
  });
  const top = ranking.filter(r=>levelIndexOf(r.res.pct)===0);
  const levelCounts = DB.meta.levels.map(l=>({level:l, count:present.filter(r=>levelFor(r.res.pct).name===l.name).length}));
  let items = [];
  if(subject.skills.length>0 && N>0){
    const k = Math.max(1, Math.round(N*0.27));
    const upper = ranking.slice(0,k), lower = ranking.slice(-k);
    items = subject.skills.map((sk,i)=>{
      const missed = r=> new Set(r.res.missedSkills.map(s=>s.id)).has(sk.id);
      const masteredN = present.filter(r=>!missed(r)).length;
      const p = masteredN/N;
      const pu = upper.filter(r=>!missed(r)).length/k, pl = lower.filter(r=>!missed(r)).length/k;
      const D = pu-pl;
      const diff = p>=0.8 ? 'سهل' : (p>=0.4 ? 'متوسط الصعوبة' : 'صعب');
      let disc, note;
      if(N<6){ disc='عيّنة صغيرة'; note='يلزم 6 طلاب على الأقل لحساب التمييز'; }
      else {
        disc = D>=0.4 ? 'تمييز ممتاز' : D>=0.3 ? 'تمييز جيد' : D>=0.2 ? 'تمييز مقبول' : 'تمييز ضعيف';
        note = D<0.2 ? 'راجع صياغة السؤال/المهارة' : (p<pm ? 'مهارة تحتاج تدخلًا علاجيًا' : 'سؤال سليم');
      }
      const missing = present.filter(missed).map(r=>r.st.name);
      return {idx:i+1, id:sk.id, label:sk.label, p, masteredN, D, diff, disc, note, missing, mastered: present.filter(r=>!missed(r)).map(r=>r.st.name)};
    });
  }
  return {rows, present, N, mean, sd, median:quantile(sorted,.5), q1:quantile(sorted,.25), q3:quantile(sorted,.75),
    min:sorted[0]||0, max:sorted[N-1]||0, hist, ranking, atRisk, nearNext, top, levelCounts, items, pm,
    passRate: N? present.filter(r=>r.res.pct>=pm).length/N : 0,
    absent: rows.filter(r=>r.res.status==='غائب').length,
    untested: rows.filter(r=>!r.res.present && r.res.status!=='غائب').length};
}

function generateInsights(subject, A){
  const out=[]; const add=(type,text)=>out.push({type,text});
  if(!A.N){ add('info','لا توجد بيانات مرصودة بعد لهذه المادة.'); return out; }
  const lv = levelFor(A.mean);
  add(A.mean>=A.pm?'good':'bad', `متوسط تحصيل الفصل ${pct(A.mean)} (مستوى «${lv.name}») ونسبة النجاح ${pct(A.passRate)} من ${A.N} طالبًا.`);
  if(A.atRisk.length) add('bad', `${A.atRisk.length} طالبًا (${pct(A.atRisk.length/A.N)}) دون الحد المقبول (${pct(A.pm)}) ويحتاجون خطة علاجية: ${A.atRisk.slice(0,6).map(r=>r.st.name).join('، ')}${A.atRisk.length>6?' …':''}.`);
  else add('good','لا يوجد طلاب دون الحد المقبول.');
  if(A.items.length){
    const best=A.items.reduce((a,b)=>b.p>a.p?b:a), worst=A.items.reduce((a,b)=>b.p<a.p?b:a);
    add('good', `أقوى مهارة: «${best.label}» (${pct(best.p)}).`);
    add(worst.p<A.pm?'bad':'warn', `أضعف مهارة: «${worst.label}» (${pct(worst.p)}).`);
    const weak = A.items.filter(i=>i.p<A.pm);
    if(weak.length) add('bad', `${weak.length} مهارة دون الحد المقبول وتحتاج تدخلًا صفيًا جماعيًا: ${weak.map(i=>i.label).join('، ')}.`);
    const poorQ = A.items.filter(i=>A.N>=6 && i.D<0.2);
    if(poorQ.length) add('warn', `أسئلة بتمييز ضعيف ينبغي مراجعتها: ${poorQ.map(i=>i.label).join('، ')}.`);
  }
  if(A.sd>0.2) add('warn', `تباين كبير بين الطلاب (الانحراف المعياري ${pct(A.sd)}) — يُنصح بالتدريس المتمايز وتقسيم الطلاب لمجموعات.`);
  else add('info', `مستوى الفصل متجانس نسبيًا (الانحراف المعياري ${pct(A.sd)}).`);
  if(A.nearNext.length) add('info', `${A.nearNext.length} طلاب على بُعد 5% أو أقل من المستوى الأعلى — فرصة رفع سريعة: ${A.nearNext.slice(0,5).map(r=>r.st.name).join('، ')}.`);
  if(A.top.length) add('good', `${A.top.length} طلاب في المستوى الأعلى «${DB.meta.levels[0].name}» مرشحون لأنشطة الإثراء: ${A.top.slice(0,5).map(r=>r.st.name).join('، ')}.`);
  if(A.absent||A.untested) add('info', `استُبعد من التحليل ${A.absent} غائبًا و${A.untested} لم يُختبروا/لم يُرصدوا.`);
  return out;
}
const REMEDIAL_STRATEGIES = [
  'إعادة تدريس المهارة بأسلوب مختلف (نمذجة ثم ممارسة موجّهة ثم مستقلة)',
  'تدريب قصير يومي (10 دقائق) مع تغذية راجعة فورية',
  'التعلم بالأقران: إقران طالب متقن بطالب غير متقن',
  'اختبار قصير متابِع بعد أسبوعين لقياس التحسن'
];
function smartAdvice(subject, res){
  if(!res.present) return '';
  const idx = levelIndexOf(res.pct), L = DB.meta.levels, n=L.length;
  const lvName = L[idx].name;
  let action;
  if(idx===0) action='أداء متميز: يُنصح بأنشطة إثرائية وتكليفات قيادية (قائد مجموعة/مساعد معلم).';
  else if(res.pct>=passMark()) action='أداء جيد يحتاج دعمًا موجهًا: تدريبات قصيرة ومراجعة دورية لرفع المستوى.';
  else action='يحتاج خطة علاجية مكثفة: جلسات دعم أسبوعية، تغذية راجعة فورية، وإشراك ولي الأمر في المتابعة.';
  let parts = [`المستوى الحالي «${lvName}» (${pct(res.pct)}). ${action}`];
  if(res.mode==='skills'){
    if(res.missedSkills.length) parts.push('المهارات المستهدفة بالعلاج: '+res.missedSkills.map(s=>s.label).join('، ')+'.');
    if(res.masteredSkills.length) parts.push('نقاط القوة: '+res.masteredSkills.slice(0,3).map(s=>s.label).join('، ')+(res.masteredSkills.length>3?' وغيرها':'')+'.');
  }
  return parts.join(' ');
}

  ['histChart','lvlChart','diffChart','subjCmp'].forEach(destroyChart);
  const mk=(id,cfg)=>{ const el=document.getElementById(id); if(el) chartInstances[id]=new Chart(el,cfg); };
  if(A.N){

    mk('lvlChart',{type:'doughnut',data:{labels:A.levelCounts.map(x=>x.level.name),

/* ================= تبويب: مقارنة اختبارين (قبلي/بعدي) ================= */
function renderCompareTab(main){
  const subject = currentSubject();
  if(!subject){ main.innerHTML = noSubjectCard(); return; }
  const others = DB.subjects.filter(s=>s.id!==subject.id && s.grade===subject.grade && s.section===subject.section);
  const base = DB.subjects.find(s=>s.id===subject.compareTo && s.id!==subject.id);
  let body = '';
  if(!others.length){
    body = '<p class="empty">أضف مادة/اختبارًا آخر لنفس الصف والفصل (مثل الاختبار القبلي) لتتمكن من المقارنة.</p>';
  } else if(!base){
    body = '<p class="empty">اختر الاختبار السابق للمقارنة من القائمة أعلاه.</p>';
  } else {
    const cmp = compareSubjects(base, subject);
    body = compareHTML(base, subject, cmp);
    setTimeout(()=>{
      destroyChart('cmpLevels');
      const el=document.getElementById('cmpLevels');
      if(el) chartInstances.cmpLevels=new Chart(el,{type:'bar',data:{labels:DB.meta.levels.map(l=>l.name),datasets:[
        {label:'قبلي: '+base.name,data:cmp.levelsBefore,backgroundColor:'#9aa6b8'},
        {label:'بعدي: '+subject.name,data:cmp.levelsAfter,backgroundColor:'#005499'}]},
        options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
      destroyChart('cmpSkills');
      const el2=document.getElementById('cmpSkills');
      if(el2 && cmp.skills.length) chartInstances.cmpSkills=new Chart(el2,{type:'bar',data:{labels:cmp.skills.map(s=>s.label),datasets:[
        {label:'قبلي',data:cmp.skills.map(s=>Math.round(s.before*1000)/10),backgroundColor:'#9aa6b8'},
        {label:'بعدي',data:cmp.skills.map(s=>Math.round(s.after*1000)/10),backgroundColor:'#3AB1DB'}]},
        options:{scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
    },0);
  }
  main.innerHTML = `
    <div class="card no-print">
      <h2>📈 مقارنة اختبارين (قبلي / بعدي)</h2>
      <div class="row">
        <div class="field"><label>الاختبار الحالي (البعدي)</label><input disabled value="${esc(subject.name)} — ${esc(subject.grade)} ${esc(subject.section)}"></div>
        <div class="field"><label>الاختبار السابق (القبلي)</label>
          <select onchange="setCompareTo(this.value)"><option value="">— اختر —</option>
            ${others.map(o=>`<option value="${o.id}" ${o.id===subject.compareTo?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
        <button class="btn btn-primary" onclick="window.print()">🖨 طباعة / PDF</button>
      </div>
      <p class="hint">يُطابَق الطلاب بالمعرّف نفسه، والمهارات بالاسم المتطابق. الاختبار السابق هو أي مادة/اختبار آخر مضاف لنفس الصف والفصل.</p>
    </div>
    ${body}`;
}
function setCompareTo(id){ const s=currentSubject(); s.compareTo=id||null; saveDB(); renderApp(); }
function compareSubjects(base, cur){
  const A0=analyzeSubject(base), A1=analyzeSubject(cur);
  const m0 = new Map(A0.present.map(r=>[r.st.id,r]));
  const rows = A1.present.filter(r=>m0.has(r.st.id)).map(r=>{
    const b=m0.get(r.st.id); return {st:r.st, before:b.res.pct, after:r.res.pct, delta:r.res.pct-b.res.pct};
  }).sort((a,b)=>b.delta-a.delta);
  const n=rows.length;
  const avgB = n? rows.reduce((a,r)=>a+r.before,0)/n:0, avgA = n? rows.reduce((a,r)=>a+r.after,0)/n:0;
  const levelsBefore = DB.meta.levels.map(l=>rows.filter(r=>levelFor(r.before).name===l.name).length);
  const levelsAfter  = DB.meta.levels.map(l=>rows.filter(r=>levelFor(r.after).name===l.name).length);
  const skills = [];
  A1.items.forEach(it=>{ const o=A0.items.find(x=>x.label.trim()===it.label.trim()); if(o) skills.push({label:it.label,before:o.p,after:it.p}); });
  return {rows, n, avgB, avgA, gain:avgA-avgB, improved:rows.filter(r=>r.delta>0.0001).length, declined:rows.filter(r=>r.delta<-0.0001).length,
    same:rows.filter(r=>Math.abs(r.delta)<=0.0001).length, levelsBefore, levelsAfter, skills};
}
function compareHTML(base, cur, c){
  if(!c.n) return '<div class="card"><p class="empty">لا يوجد طلاب مشتركون مرصودون في الاختبارين.</p></div>';
  const arrow = d=> d>0.0001?`<span style="color:var(--good);font-weight:900">▲ +${Math.round(d*1000)/10}%</span>`:(d<-0.0001?`<span style="color:var(--bad);font-weight:900">▼ ${Math.round(d*1000)/10}%</span>`:'<span class="hint">— ثابت</span>');
  return `
  <div class="card">
    ${reportHeaderHTML('مقارنة الأداء: '+base.name+' ← '+cur.name+' ('+cur.grade+' '+cur.section+')')}
    <div class="kpi-grid">
      <div class="kpi"><div class="n">${pct(c.avgB)}</div><div class="l">المتوسط القبلي</div></div>
      <div class="kpi"><div class="n">${pct(c.avgA)}</div><div class="l">المتوسط البعدي</div></div>
      <div class="kpi"><div class="n" style="color:${c.gain>=0?'var(--good)':'var(--bad)'}">${c.gain>=0?'+':''}${Math.round(c.gain*1000)/10}%</div><div class="l">التغير</div></div>
      <div class="kpi"><div class="n">${c.improved}</div><div class="l">تحسّنوا</div></div>
      <div class="kpi"><div class="n">${c.declined}</div><div class="l">تراجعوا</div></div>
      <div class="kpi"><div class="n">${c.same}</div><div class="l">ثابتون</div></div>
    </div>
    <div style="margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:700;background:${c.gain>=0?'var(--good-bg)':'var(--bad-bg)'};color:${c.gain>=0?'var(--good)':'var(--bad)'}">
      ${c.gain>0.0001?`✓ تحسّن متوسط الفصل بمقدار ${Math.round(c.gain*1000)/10} نقطة مئوية، وتحسّن ${c.improved} من ${c.n} طالبًا (${pct(c.improved/c.n)}).`:(c.gain<-0.0001?`⚠ تراجع متوسط الفصل بمقدار ${Math.abs(Math.round(c.gain*1000)/10)} نقطة مئوية — يلزم مراجعة الخطة العلاجية.`:'لا تغيّر في متوسط الفصل.')}
    </div>
    <div class="row" style="align-items:flex-start;gap:16px;margin-top:16px">
      <div style="flex:1;min-width:280px"><h3 style="color:var(--navy);font-size:.9rem">انتقال الطلاب بين المستويات</h3><canvas id="cmpLevels" height="150"></canvas></div>

/* ================= تصدير Excel لتقرير المادة ================= */
function exportXLSXReport(){
  const subject=currentSubject(); if(!subject){ toast('اختر مادة'); return; }
  if(typeof XLSX==='undefined'){ toast('مكتبة إكسل لم تُحمَّل — تحقق من الاتصال'); return; }
  const A=analyzeSubject(subject);
  const head=['الترتيب','الطالب','الحالة','النسبة %','المستوى'].concat(subject.skills.map((s,i)=>(i+1)+'. '+s.label));
  const body=A.rows.map(r=>{
    if(!r.res.present) return ['',r.st.name,r.res.status,'','']; 
    const rk=A.ranking.find(x=>x.st.id===r.st.id);
    const base=[rk?rk.rank:'',r.st.name,'حاضر',Math.round(r.res.pct*1000)/10,levelFor(r.res.pct).name];
    if(r.res.mode==='skills'){ const ms=new Set(r.res.missedSkills.map(s=>s.id)); subject.skills.forEach(s=>base.push(ms.has(s.id)?'✗':'✓')); }
    return base;
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head].concat(body)), 'النتائج');
  if(A.items.length){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['#','المهارة','نسبة الإتقان %','الصعوبة','معامل التمييز','التقييم','غير المتقنين']].concat(
      A.items.map(i=>[i.idx,i.label,Math.round(i.p*1000)/10,i.diff,A.N>=6?Math.round(i.D*100)/100:'',i.note,i.missing.join('، ')]))), 'تحليل المهارات');
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['المؤشر','القيمة'],['عدد الحاضرين',A.N],['المتوسط %',Math.round(A.mean*1000)/10],['الوسيط %',Math.round(A.median*1000)/10],
    ['الانحراف المعياري %',Math.round(A.sd*1000)/10],['نسبة النجاح %',Math.round(A.passRate*1000)/10],['عدد طلاب العلاج',A.atRisk.length]]), 'الملخص');
  XLSX.writeFile(wb, subject.name+'_تقرير_تحليل.xlsx');
}


/* ================= أدوات مشتركة: تطبيع الأسماء ================= */
function normName(s){
  return String(s==null?'':s).replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim().toLowerCase();
}

/* ================= تقرير الطالب الشامل (كل المواد) ================= */
function classList(){
  const m=new Map();
  DB.students.forEach(s=>{ const k=s.grade+'||'+s.section; if(!m.has(k)) m.set(k,{key:k,grade:s.grade,section:s.section}); });
  return [...m.values()];
}
function buildClassContext(grade, section){
  const subjects = DB.subjects.filter(s=>s.grade===grade && s.section===section);
  const analyses = {}; subjects.forEach(s=>{ analyses[s.id]=analyzeSubject(s); });
  const students = DB.students.filter(s=>s.grade===grade && s.section===section);
  const overall = students.map(st=>{
    const rows = subjects.map(sub=>{
      const res = computeResult(sub.id, st.id), A = analyses[sub.id];
      const rk = A.ranking.find(r=>r.st.id===st.id);
      return {subject:sub, res, A, rank: rk?rk.rank:null};
    });
    const pres = rows.filter(r=>r.res.present);
    return {st, rows, n:pres.length, avg: pres.length ? pres.reduce((a,r)=>a+r.res.pct,0)/pres.length : null};
  });
  const ranked = overall.filter(o=>o.avg!=null).sort((a,b)=>b.avg-a.avg);
  let last=null, lr=0; ranked.forEach((o,i)=>{ if(o.avg!==last){ lr=i+1; last=o.avg; } o.rank=lr; });
  const classAvg = ranked.length ? ranked.reduce((a,o)=>a+o.avg,0)/ranked.length : 0;
  return {grade, section, subjects, analyses, students, overall, ranked, classAvg};
}
function studentOverallAdvice(o, ctx){
  const pres = o.rows.filter(r=>r.res.present);
  if(!pres.length) return 'لا توجد نتائج مرصودة لهذا الطالب بعد.';
  const pm = passMark();
  const best = pres.reduce((a,b)=>b.res.pct>a.res.pct?b:a), worst = pres.reduce((a,b)=>b.res.pct<a.res.pct?b:a);
  const weakSubs = pres.filter(r=>r.res.pct<pm).map(r=>r.subject.name);
  const lvl = levelFor(o.avg), idx = levelIndexOf(o.avg);
  const parts = [`المستوى العام «${lvl.name}» (${pct(o.avg)}) على ${pres.length} مواد، وترتيبه ${o.rank} من ${ctx.ranked.length} في الفصل.`];
  if(pres.length>1) parts.push(`أقوى مادة: ${best.subject.name} (${pct(best.res.pct)})، وأضعفها: ${worst.subject.name} (${pct(worst.res.pct)}).`);
  if(weakSubs.length) parts.push(`يحتاج دعمًا علاجيًا في: ${weakSubs.join('، ')}.`);
  const missed = []; pres.forEach(r=>{ if(r.res.mode==='skills') r.res.missedSkills.forEach(s=>missed.push(r.subject.name+': '+s.label)); });
  if(missed.length) parts.push('المهارات المستهدفة بالعلاج: '+missed.slice(0,6).join('، ')+(missed.length>6?' وغيرها':'')+'.');
  parts.push(idx===0 ? 'يُنصح بأنشطة إثرائية وتكليفات قيادية.' : (weakSubs.length ? 'يُنصح بخطة علاجية مكثفة ومتابعة أسبوعية مع ولي الأمر.' : 'يُنصح بتدريبات داعمة لرفع المستوى.'));
  return parts.join(' ');
}

/* ================= استيراد رصد مادة من إكسل ================= */
var pendingScores = null;
function parseMark(v){
  const t = String(v==null?'':v).trim().toLowerCase();
  if(['1','1.0','✓','✔','صح','نعم','yes','true','y','متقن'].includes(t)) return 1;
  if(['0','0.0','✗','✘','x','خطأ','خطا','غلط','لا','no','false','n','غير متقن'].includes(t)) return 0;
  return null;
}
function parseStatus(v){
  const t = normName(v);
  if(!t) return '';
  if(t.startsWith('غائب')||t.startsWith('غياب')) return 'غائب';
  if(t.includes('لم يختبر')||t.includes('لم يختبر'.replace('ي','ي'))) return 'لم يختبر';
  if(t.startsWith('حاضر')||t.startsWith('حضور')) return 'حاضر';
  return '';
}
function parseScoreRows(rows, subject){
  rows = (rows||[]).filter(r=>Array.isArray(r) && r.some(c=>String(c).trim()!==''));
  if(!rows.length) return {entries:[], found:{}, error:'الملف فارغ'};
  const isName = c=>/اسم|الطالب|الطالبه|name/i.test(normName(c));
  let hi=-1, nameCol=-1;
  for(let i=0;i<Math.min(rows.length,6);i++){ const n=rows[i].findIndex(isName); if(n>=0){ hi=i; nameCol=n; break; } }
  const found = {statusCol:-1, mistakesCol:-1, scoreCol:-1, skillCols:{}};
  let data;
  if(hi>=0){
    const header = rows[hi]; data = rows.slice(hi+1);
    header.forEach((h,c)=>{
      if(c===nameCol) return; const t=normName(h); if(!t) return;
      if(/الحال|status/.test(t)) { found.statusCol=c; return; }
      if(/اخطاء|خاطئ|mistake/.test(t)) { found.mistakesCol=c; return; }
      if(/^(الدرجه|المجموع|score|total)/.test(t)) { found.scoreCol=c; return; }
      if(subject.skills.length){
        let idx = subject.skills.findIndex(sk=>normName(sk.label)===t);
        if(idx<0) idx = subject.skills.findIndex(sk=>t.includes(normName(sk.label)) && normName(sk.label).length>2);
        if(idx<0){ const m=String(h).match(/(\d+)/); if(m && +m[1]>=1 && +m[1]<=subject.skills.length) idx=+m[1]-1; }
        if(idx>=0 && found.skillCols[idx]===undefined) found.skillCols[idx]=c;
      }
    });
  } else {
    nameCol=0; data=rows;
    if(subject.skills.length) for(let k=0;k<subject.skills.length;k++) found.skillCols[k]=k+1; else found.scoreCol=1;
  }
  const entries=[];
  data.forEach(r=>{
    const name=String(r[nameCol]==null?'':r[nameCol]).trim();
    if(!name || !isNaN(Number(name))) return;
    const e={name, status:found.statusCol>=0?parseStatus(r[found.statusCol]):'', mistakeNums:null, marks:{}, score:null};
    if(found.mistakesCol>=0){ const raw=String(r[found.mistakesCol]==null?'':r[found.mistakesCol]); e.mistakeNums = parseNumberList(raw); }
    Object.keys(found.skillCols).forEach(k=>{ const mk=parseMark(r[found.skillCols[k]]); if(mk!==null) e.marks[k]=mk; });

function applyScoreImport(subject, entries, opts){
  opts = opts||{};

  const sum = {updated:0, skipped:0, created:0, unmatched:[], invalid:0, total:entries.length};
  const mx = subjectMax(subject);
  entries.forEach(e=>{
    let st = byName.get(normName(e.name));
    if(!st){
      if(opts.createMissing){
        sum.created++;
        if(!opts.dry){ st={id:uid('st'),name:e.name,grade:subject.grade,section:subject.section}; DB.students.push(st); byName.set(normName(e.name),st); }
        else st={id:'__new__'};
      } else { sum.unmatched.push(e.name); return; }
    }
    const existing = st.id==='__new__' ? null : getRecord(subject.id, st.id);
    const hasData = existing && (existing.status || Array.isArray(existing.mistakes) || (existing.manualScore!=null));
    if(opts.mode==='fill' && hasData){ sum.skipped++; return; }
    let rec = null;
    if(e.status==='غائب' || e.status==='لم يختبر') rec={status:e.status};
    else if(subject.skills.length){
      let ids=null;
      if(e.mistakeNums){ ids = e.mistakeNums.map(n=>subject.skills[n-1]?subject.skills[n-1].id:null).filter(Boolean); }
      else if(Object.keys(e.marks).length){ ids = Object.keys(e.marks).filter(k=>e.marks[k]===0).map(k=>subject.skills[+k].id); }
      if(ids) rec={status:e.status||'حاضر', mistakes:ids};
      else if(e.status) rec={status:e.status};
    } else if(e.score!=null){
      rec={status:e.status||'حاضر', manualScore:Math.max(0,Math.min(mx,e.score))};
    } else if(e.status) rec={status:e.status};
    if(!rec){ sum.invalid++; return; }
    sum.updated++;
    if(!opts.dry){ DB.scores[subject.id]=DB.scores[subject.id]||{}; DB.scores[subject.id][st.id]=rec; }
  });
  if(!opts.dry){ saveDB(); }
  return sum;
}

/* ================= دمج نسخة احتياطية (من معلم آخر) ================= */
var pendingMerge = null;
function mergeInto(target, inc, opts){
  opts = opts||{}; const conflict = opts.conflict||'skip';
  const sum={subjectsAdded:0, subjectsMerged:0, studentsAdded:0, recordsAdded:0, recordsUpdated:0, recordsSkipped:0, skillsAdded:0};
  const stKey = s=>normName(s.name)+'|'+normName(s.grade)+'|'+normName(s.section);
  const sjKey = s=>normName(s.name)+'|'+normName(s.grade)+'|'+normName(s.section);
  const stMap={}, sjMap={}, skMap={};
  const tStudents=new Map(target.students.map(s=>[stKey(s),s]));
  (inc.students||[]).forEach(s=>{
    let t=tStudents.get(stKey(s));
    if(!t){ t={id:uid('st'),name:s.name,grade:s.grade,section:s.section}; target.students.push(t); tStudents.set(stKey(s),t); sum.studentsAdded++; }
    stMap[s.id]=t.id;
  });
  const tSubjects=new Map(target.subjects.map(s=>[sjKey(s),s]));
  (inc.subjects||[]).forEach(s=>{
    let t=tSubjects.get(sjKey(s));
    if(!t){
      t={id:uid('subj'),name:s.name,grade:s.grade,section:s.section,skills:[],defaultMax:s.defaultMax||100,teacher:s.teacher||''};
      target.subjects.push(t); tSubjects.set(sjKey(s),t); sum.subjectsAdded++;
    } else sum.subjectsMerged++;
    sjMap[s.id]=t.id;
    (s.skills||[]).forEach(sk=>{
      let ts=t.skills.find(x=>normName(x.label)===normName(sk.label));
      if(!ts){ ts={id:uid('sk'),label:sk.label}; t.skills.push(ts); sum.skillsAdded++; }
      skMap[s.id+'|'+sk.id]=ts.id;
    });
  });
  Object.keys(inc.scores||{}).forEach(oldSid=>{
    const newSid=sjMap[oldSid]; if(!newSid) return;
    Object.keys(inc.scores[oldSid]).forEach(oldStId=>{
      const newStId=stMap[oldStId]; if(!newStId) return;
      const rec=JSON.parse(JSON.stringify(inc.scores[oldSid][oldStId]));
      if(Array.isArray(rec.mistakes)) rec.mistakes=rec.mistakes.map(id=>skMap[oldSid+'|'+id]).filter(Boolean);
      delete rec.manualMax;
      target.scores[newSid]=target.scores[newSid]||{};
      const ex=target.scores[newSid][newStId];
      const hasData=ex && (ex.status||Array.isArray(ex.mistakes)||ex.manualScore!=null);
      if(hasData){ if(conflict==='skip'){ sum.recordsSkipped++; return; } sum.recordsUpdated++; }
      else sum.recordsAdded++;
      target.scores[newSid][newStId]=rec;
    });
  });
  return sum;
}
function handleMergeFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed.students||!parsed.subjects||!parsed.scores) throw new Error('bad');

}

      <div class="kpi"><div class="n">${sum.recordsUpdated}</div><div class="l">رصد مُحدَّث</div></div>
      <div class="kpi"><div class="n">${sum.recordsSkipped}</div><div class="l">رصد متخطّى</div></div></div>

}

function makeQuestions(n, opts, type){

/* ---- تخطيط الورقة (مصدر واحد للرسم والقراءة) ---- */
function packItems(items, rows, k){

  for(const it of items){ if(used+it.rows>rows){ if(cols.length>=k) return null; cols.push([]); used=0; } cols[cols.length-1].push(it); used+=it.rows; }
  return cols;
}
function examLayout(exam){

  L.titleBox = {x:14, y:20, w:182, h:14};

  const idRight = LO.idSide==='right';
  let yEnd = 38;

    const gx0 = idRight ? 142 : 14, gx1 = idRight ? 196 : 68, labelW=5, xFirst = gx0+labelW+4+1.8, pitchX = Math.min(6.4,(gx1-xFirst)/N), pitchY=4.7, y0=47.5;
    const cols=[]; for(let c=0;c<N;c++){ const cx=xFirst+c*pitchX, bubbles=[]; for(let d=0;d<10;d++) bubbles.push({d,cx,cy:y0+d*pitchY}); cols.push({cx,bubbles}); }
    L.idGrid = {x:gx0, y:38, w:gx1-gx0, h:60, r:1.8, labelX:gx0+2.5, titleY:42.5, N, cols, pitchY, y0};
    const fr = idRight ? 138 : 196, fl = idRight ? 14 : 72;
    fields.forEach((f,i)=>L.fields.push({id:f.id,label:f.label,xr:fr,xl:fl,y:38+i*8.5+6}));
    yEnd = Math.max(38+fields.length*8.5, 98);
  } else {
    const rows = Math.ceil(fields.length/2);
    fields.forEach((f,i)=>{ const col=i%2,row=Math.floor(i/2); L.fields.push({id:f.id,label:f.label,xr:col===0?196:102,xl:col===0?108:14,y:38+row*8.5+6}); });
    yEnd = 38 + rows*8.5;
  }
  (exam.header.notes||[]).filter(t=>String(t).trim()).forEach(t=>{ L.notes.push({text:String(t),y:yEnd+3.5}); yEnd+=5.5; });
  if((exam.header.instructions||'').trim()){ L.instrY = yEnd+4; yEnd += 9; }

  const items=[]; qs.forEach((q,idx)=>{ if(String(q.section||'').trim()) items.push({kind:'sec',text:String(q.section).trim(),rows:1}); items.push({kind:'q',q,idx,rows:qType(q)==='num'?qDigits(q):1}); });

  const colNeed = Math.max(...need), kMax = Math.max(1, Math.floor(182/colNeed));
  const base = ({tight:6.4, normal:7.2, wide:8.2})[LO.spacing] || 7.2, minPitch = Math.max(5.6, 2*qr+1.6);

  // موازنة الأعمدة

  const colStep=182/found.k; L.pitch=found.pitch; L.cols=found.k; L.rowsPer=rowsPer; L.qTop=qTop; let maxUsed=0;
  found.cols.forEach((col,c)=>{

    col.forEach(it=>{
      if(it.kind==='sec'){ L.sections.push({text:it.text,xr:colRight,w:colStep-3,y:qTop+(r+0.5)*found.pitch}); r+=1; return; }
      const q=it.q, t=qType(q), row={n:q.n,type:t,labelX:colRight-3,cy:qTop+(r+0.5)*found.pitch,colRight,groups:[],bubbles:[]};
      if(t==='num'){ for(let d=0;d<qDigits(q);d++){ const g=[]; for(let j=0;j<10;j++) g.push({i:j,g:d,cx:colRight-12-j*4.8,cy:qTop+(r+d+0.5)*found.pitch,label:String(j)}); row.groups.push(g); } }

      row.bubbles=[].concat(...row.groups); L.rows.push(row); r+=it.rows;
    });
    maxUsed=Math.max(maxUsed,r);
  });
  L.rows.sort((a,b)=>a.n-b.n);
  L.bottom=qTop+maxUsed*found.pitch;
  return L;
}

function omrOtsu(gray){

function omrHomography(src,dst){
  const A=[], b=[];

function omrRead(exam, gray, w, h, opts){

  const mk = omrFindMarkers(gray,w,h); if(!mk.ok) return {ok:false, error:mk.error};
  const L = examLayout(exam); if(!L.ok) return {ok:false, error:L.error};
  const cx=mk.points.reduce((a,p)=>a+p[0],0)/4, cy=mk.points.reduce((a,p)=>a+p[1],0)/4;
  const ord = mk.points.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));

      const marks=[], flags=[], all=[];
      row.groups.forEach(g=>{
        const sc=g.map(b=>{ const p=omrApplyH(H,b.cx,b.cy); return omrBubbleScore(gray,w,h,p[0],p[1],rpx); }); all.push(...sc.map(x=>Math.round(x*1000)/1000));

    const sc = g.map(b=>{ const p=omrApplyH(H,b.cx,b.cy); return omrBubbleScore(gray,w,h,p[0],p[1],rpx); });
    const d = omrDecide(sc,T,rel);

/* ---- التصحيح والدرجات ---- */
function omrSameSet(a,b){ const x=a.slice().sort((p,q)=>p-q).join(','), y=b.slice().sort((p,q)=>p-q).join(','); return x===y; }
function numValue(marks){ if(!marks||!marks.length||marks.some(m=>m<0)) return null; return parseInt(marks.join(''),10); }
function scoreSheet(exam, sheet){
  const st = exam.settings||{}; const rows=[]; let total=0, max=0, correct=0, wrong=0, blank=0, dbl=0;
  if(sheet.totalOnly){ const mx=Number(sheet.totalMax)||0, tt=Number(sheet.total)||0; return {rows:[],total:tt,max:mx,pct:mx?Math.min(1,tt/mx):0,correct:0,wrong:0,blank:0,double:0,totalOnly:true}; }
  exam.questions.forEach(q=>{
    const t = qType(q), pts = Number(q.points)||0;
    if(t==='manual'){ max+=pts; const e = Math.max(0, Math.min(pts, Number((sheet.manual||{})[q.n])||0)); total+=e; rows.push({n:q.n,type:t,marks:[],status:'manual',points:pts,earned:e}); return; }
    const a = (sheet.answers||{})[q.n] || {marks:[]}; const marks=(a.marks||[]).slice();
    if(t==='scale'){ rows.push({n:q.n,type:t,marks,status:marks.length?'survey':'blank',points:0,earned:0}); return; }
    max += pts;
    let status, earned=0;
    if(!qHasKey(q)) status='nokey';
    else if(t==='num'){
      if(!marks.length || marks.every(m=>m<0)){ status='blank'; blank++; }
      else { const v=numValue(marks); if(v!==null && v===parseInt(q.keyNum,10)){ status='correct'; correct++; earned=pts; } else { status='wrong'; wrong++; earned=-(Number(st.penalty)||0)*pts; } }
    }
    else if(marks.length===0){ status='blank'; blank++; }
    else if(t!=='multi' && marks.length>1 && st.doubleAsWrong!==false){ status='double'; dbl++; wrong++; }
    else if(omrSameSet(marks, q.key||[])){ status='correct'; correct++; earned=pts; }
    else if(t==='multi' && q.partial){
      const hits=marks.filter(m=>(q.key||[]).includes(m)).length, bad=marks.length-hits, r=Math.max(0,(hits-bad)/(q.key.length||1));
      if(r>0){ status='partial'; earned=pts*r; } else { status='wrong'; wrong++; }
    }
    else { status='wrong'; wrong++; earned = -(Number(st.penalty)||0)*pts; }
    total += earned; rows.push({n:q.n,type:t,marks,status,points:pts,earned});
  });
  total = Math.max(0,total);
  return {rows,total,max,pct:max?total/max:0,correct,wrong,blank,double:dbl};
}
function resolveSkill(q, subject){
  const label = String(q.skillName||'').trim() || ((subject.skills.find(s=>s.id===q.skillId)||{}).label) || '';
  if(!label) return null; const nl=normName(label);
  return subject.skills.find(s=>normName(s.label)===nl) || null;
}
function examSkillMistakes(exam, subject, scored){
  // المهارة غير متقنة إذا قلّت نسبة الدرجة المكتسبة في أسئلتها عن حدّ الإتقان
  const thr = (exam.settings.skillMastery!=null?exam.settings.skillMastery:0.6), by={};
  scored.rows.forEach(r=>{ const q=exam.questions.find(x=>x.n===r.n); if(!q||r.type==='scale'||r.status==='nokey'||!(r.points>0)) return;
    const sk=resolveSkill(q,subject); if(!sk) return; (by[sk.id]=by[sk.id]||{e:0,p:0}); by[sk.id].e+=Math.max(0,r.earned); by[sk.id].p+=r.points; });
  const missed=Object.keys(by).filter(id=>by[id].p>0 && by[id].e/by[id].p < thr);
  return {missed, assessed:Object.keys(by)};
}

/* ---- تحليل الفقرات ---- */
function omrMean(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }

function analyzeExamItems(exam, sheets){
  sheets = sheets.filter(s=>!s.totalOnly);

  const N = scored.length;
  const res = {N, items:[], scaleItems:[], stats:null};
  if(!N) return res;

    if(t==='scale'){

    const pU = upper.filter(x=>x.sc.rows.find(z=>z.n===q.n).status==='correct').length/k27, pL = lower.filter(x=>x.sc.rows.find(z=>z.n===q.n).status==='correct').length/k27;
    const D = pU-pL;
    const adj = scored.map((x,i)=>x.sc.total-rows[i].earned), mAdj=omrMean(adj), sAdj=omrSD(adj);
    let rpb = 0;
    if(sAdj>0 && p>0 && p<1){ const mc = omrMean(adj.filter((v,i)=>rows[i].status==='correct')); rpb = (mc-mAdj)/sAdj*Math.sqrt(p/(1-p)); }
    const flags=[];
    if(!hasKey) flags.push('لا يوجد مفتاح إجابة');
    else {
      if(p>0.9) flags.push('سهل جدًا'); else if(p<0.2) flags.push('صعب جدًا');
      if(N>=6){ if(D<0) flags.push('تمييز سالب — راجع المفتاح'); else if(D<0.2) flags.push('تمييز ضعيف'); }
      if(blank/N>0.15) flags.push('فراغات مرتفعة'); if(dbl/N>0.1) flags.push('تظليل مزدوج مرتفع');
      if(t==='mcq'||t==='tf'){ const keyIdx=q.key||[];
        for(let i=0;i<m;i++){ if(keyIdx.includes(i)) continue;
          if(optCount[i]/N<0.05) flags.push('مموّه ضعيف ('+optLabel(exam,q,i)+')');
          else if(N>=6 && optU[i]>optL[i] && optCount[i]/N>=0.2 && optU[i]/k27>=0.25) flags.push('مموّه جذّاب للمتفوقين ('+optLabel(exam,q,i)+')'); } }
    }
    const diffLabel = !hasKey ? '—' : (p>=0.8?'سهل':(p>=0.4?'متوسط':'صعب'));
    let quality = 'جيد';
    if(!hasKey) quality='غير مكتمل';
    else if((N>=6 && D<0) ) quality='معيب';
    else if(flags.some(f=>/تمييز ضعيف|سهل جدًا|صعب جدًا|فراغات|مزدوج|جذّاب/.test(f))) quality='يُراجع';
    if(hasKey){ sumPQ += p*(1-p); nDich++; }
    res.items.push({n:q.n, type:t, skillId:q.skillId, key:q.key||[], p, D, rpb, correct:cnt, blank, dbl, optCount, optU, optL, diffLabel, flags, quality, keyLabel:keyText(exam,q)});
  });
  const dichTotals = scored.map(x=>x.sc.rows.filter(r=>r.type!=='manual'&&r.type!=='scale'&&r.status!=='nokey').reduce((s,r)=>s+(r.status==='correct'?1:0),0));
  const varT = Math.pow(omrSD(dichTotals),2);
  const kr20 = (nDich>1 && varT>0) ? (nDich/(nDich-1))*(1-sumPQ/varT) : null;
  const sem = (kr20!=null && kr20>=0) ? sd*Math.sqrt(1-kr20) : null;
  const sorted = totals.slice().sort((a,b)=>a-b), max = scored[0].sc.max;
  res.stats = {N, mean, sd, median: quantile(sorted,.5), min:sorted[0], max:sorted[N-1], maxPossible:max, kr20, sem,
    avgP: omrMean(res.items.filter(i=>i.quality!=='غير مكتمل').map(i=>i.p)), avgD: omrMean(res.items.filter(i=>i.quality!=='غير مكتمل').map(i=>i.D)),
    blankTotal: scored.reduce((a,x)=>a+x.sc.blank,0), doubleTotal: scored.reduce((a,x)=>a+x.sc.double,0),
    good: res.items.filter(i=>i.quality==='جيد').length, review: res.items.filter(i=>i.quality==='يُراجع').length, bad: res.items.filter(i=>i.quality==='معيب').length};
  return res;
}

/* ---- ربط الأوراق بالطلاب (بالرقم) ---- */
function findStudentByNo(exam, no){
  const n = normNo(no); if(!n || String(no).includes('?')) return null;
  const hits = examStudents(exam).filter(st=>normNo(st.no)===n);
  return hits.length===1 ? hits[0] : null;
}
function autoLinkSheets(exam){
  let linked=0;
  examSheets(exam).forEach(sh=>{
    if(sh.studentId && DB.students.some(s=>s.id===sh.studentId)) return;
    const st = findStudentByNo(exam, sh.studentNo); if(st){ sh.studentId=st.id; linked++; }
  });
  return linked;
}
function sheetNeedsReview(sh){
  if(sh.reviewed) return false;
  if(!sh.studentId) return true;
  if((sh.idFlags||[]).some(f=>f!=='ok')) return true;
  return Object.values(sh.answers||{}).some(a=>!a.edited && (a.flag==='blank'||a.flag==='double'||a.flag==='uncertain'));
}
function sheetFromRead(exam, r, fileName){
  const answers={}; Object.keys(r.answers).forEach(n=>{ const a=r.answers[n]; answers[n]={marks:a.marks.slice(), flag:a.flag, scores:a.scores}; });
  const sh = {id:uid('sh'), examId:exam.id, studentNo:r.studentNo||'', studentId:null, answers, manual:{}, idFlags:r.idFlags||[], fileName:fileName||'', source:'scan', reviewed:false, createdAt:Date.now()};
  return sh;
}

/* ---- تحميل الصورة وتحويلها إلى تدرّج رمادي ---- */
function loadImageGray(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('تعذرت قراءة الملف'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('الملف ليس صورة صالحة (استخدم JPG أو PNG)'));
      img.onload = ()=>{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const sc = Math.min(1, OMR_MAXSIDE/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const d = ctx.getImageData(0,0,w,h).data, gray = new Uint8Array(w*h);
        for(let i=0,p=0;i<gray.length;i++,p+=4) gray[i] = (d[p]*0.299 + d[p+1]*0.587 + d[p+2]*0.114)|0;
        resolve({gray, w, h, dataURL:c.toDataURL('image/jpeg',0.6)});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- تحويل نص إجابات إلى فهارس ---- */
function tokenizeAnswerString(str){
  str=String(str||'').replace(/هـ/g,'ه'); const out=[]; let i=0;
  while(i<str.length){ const ch=str[i];
    if(/\s|,|،|;/.test(ch)){ i++; continue; }
    if(ch==='('||ch==='['){ const close = ch==='(' ? ')' : ']'; let j=str.indexOf(close,i); if(j<0) j=str.length; out.push(str.slice(i+1,j)); i=j+1; continue; }
    out.push(ch); i++; }
  return out;
}

function importExternalAnswers(file){

    const p=parseExternalRows(e,rows); if(p.error){ toast(p.error); return; }
    p.entries.forEach(en=>{
      let stId=null; if(en.no){ const st=findStudentByNo(e,en.no); if(st) stId=st.id; }
      if(!stId && en.name){ const st=examStudents(e).find(s=>normName(s.name)===normName(en.name)); if(st) stId=st.id; }
      DB.sheets.push({id:uid('sh'), examId:e.id, studentNo:en.no, studentId:stId, answers:en.answers, manual:{}, idFlags:[], fileName:'استيراد', source:'import', reviewed:false, createdAt:Date.now()});

    autoLinkSheets(e); saveDB(); toast('تم استيراد '+p.entries.length+' ورقة'); omrGo('scan');
  }catch(x){ console.error(x); toast('تعذرت قراءة الملف'); } };
  fr.readAsArrayBuffer(file);
}

function drawReviewOn(exam, sh, cv, done, interactive){
  const info=OMR_IMG[sh.id]; if(!info||!cv){ if(done) done(); return; }
  const L=examLayout(exam); if(!L.ok){ if(done) done(); return; }
  const img=new Image();
  img.onload=()=>{
    cv.width=interactive?Math.min(700,info.w):info.w; const s=cv.width/info.w; cv.height=Math.round(info.h*s);
    const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height);
    const sc=scoreSheet(exam,sh); const rpx=L.qr*info.pxmm*s;
    L.rows.forEach((row,ri)=>{
      const q=exam.questions.find(x=>x.n===row.n); if(!q||q.type==='manual') return; const r=sc.rows.find(x=>x.n===q.n), a=sh.answers[q.n]||{marks:[]};
      row.bubbles.forEach(b=>{
        const p=omrApplyH(info.H,b.cx,b.cy), x=p[0]*s, y=p[1]*s, isNum=qType(q)==='num', sel=isNum ? a.marks[b.g]===b.i : a.marks.includes(b.i), key=isNum ? String(q.keyNum||'').padStart(qDigits(q),'0')[b.g]===String(b.i) && qHasKey(q) : (q.key||[]).includes(b.i);
        if(sel){ const col = r.status==='correct'?'#1e8449':(r.status==='double'?'#d35400':'#c0392b'); ctx.beginPath(); ctx.arc(x,y,rpx*1.25,0,7); ctx.fillStyle=col+'55'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle=col; ctx.stroke(); }
        else if(key && r.status!=='correct'){ ctx.beginPath(); ctx.setLineDash([3,3]); ctx.arc(x,y,rpx*1.25,0,7); ctx.lineWidth=1.8; ctx.strokeStyle='#1e8449'; ctx.stroke(); ctx.setLineDash([]); }
      });
      if(r.status==='blank' && row.bubbles.length){ const f=omrApplyH(info.H,row.bubbles[0].cx,row.cy), l=omrApplyH(info.H,row.bubbles[row.bubbles.length-1].cx,row.cy); ctx.lineWidth=2.5; ctx.strokeStyle='#e6a700'; const x1=Math.min(f[0],l[0])*s-rpx*1.6, x2=Math.max(f[0],l[0])*s+rpx*1.6; ctx.strokeRect(x1, f[1]*s-rpx*1.5, x2-x1, rpx*3); }
    });
    if(L.idGrid){ sh.idFlags && L.idGrid.cols.forEach((col,ci)=>{ const dgt=(sh.studentNo||'')[ci]; if(dgt==null||dgt==='?') return; const b=col.bubbles[+dgt]; if(!b) return; const p=omrApplyH(info.H,b.cx,b.cy); ctx.beginPath(); ctx.arc(p[0]*s,p[1]*s,L.idGrid.r*info.pxmm*s*1.3,0,7); ctx.lineWidth=2; ctx.strokeStyle='#005499'; ctx.stroke(); }); }
    if(interactive) cv.onclick=ev=>{
      const rect=cv.getBoundingClientRect(), mx=(ev.clientX-rect.left)*(cv.width/rect.width), my=(ev.clientY-rect.top)*(cv.height/rect.height);
      let best=null, bd=1e9;
      L.rows.forEach(row=>{ row.bubbles.forEach(b=>{ const p=omrApplyH(info.H,b.cx,b.cy), d=Math.hypot(p[0]*s-mx,p[1]*s-my); if(d<bd){ bd=d; best={n:row.n,i:b.i,g:b.g,t:row.type}; } }); });
      if(best && bd<=rpx*1.7){ if(best.t==='num'){ const q=exam.questions.find(x=>x.n===best.n), a=sh.answers[best.n]||{marks:[]}, m=(a.marks&&a.marks.length?a.marks.slice():new Array(qDigits(q)).fill(0)); m[best.g]=best.i; setNumAnswer(sh.id,best.n,m.map(x=>x<0?0:x).join('')); } else toggleMark(sh.id,best.n,best.i); }
    };
    if(!interactive){
      const st=DB.students.find(x=>x.id===sh.studentId), sc2=scoreSheet(exam,sh), bh=Math.max(34,cv.height*0.018);
      ctx.fillStyle='rgba(8,43,90,0.88)'; ctx.fillRect(0,0,cv.width,bh);
      ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(bh*0.55)+'px Tajawal, Arial, sans-serif'; ctx.textBaseline='middle'; ctx.direction='rtl'; ctx.textAlign='right';
      ctx.fillText((st?st.name:('رقم '+(sh.studentNo||'؟')))+'  —  '+(Math.round(sc2.total*100)/100)+' / '+sc2.max+'  ('+Math.round(sc2.pct*100)+'%)', cv.width-12, bh/2);
    }
    if(done) done();
  };
  img.onerror=()=>{ if(done) done(); };
  img.src=info.dataURL;
}

function applyExamToSubject(exam, subject, mode){
  const sum={applied:0, skipped:0, noMap:0, dup:0};
  const latest={}; examSheets(exam).filter(s=>s.studentId && !s.excluded).forEach(s=>{ if(!latest[s.studentId] || s.createdAt>=latest[s.studentId].createdAt){ if(latest[s.studentId]) sum.dup++; latest[s.studentId]=s; } else sum.dup++; });
  Object.keys(latest).forEach(stId=>{
    const sh=latest[stId], sc=scoreSheet(exam,sh), ex=getRecord(subject.id,stId);
    const has=ex&&(ex.status||Array.isArray(ex.mistakes)||ex.manualScore!=null);
    if(mode==='fill' && has){ sum.skipped++; return; }
    let rec;
    if(subject.skills.length){ const mm=examSkillMistakes(exam,subject,sc); if(!mm.assessed.length){ sum.noMap++; return; } rec={status:'حاضر', mistakes:mm.missed}; }
    else rec={status:'حاضر', manualScore: Math.round(sc.pct*subjectMax(subject)*100)/100};
    DB.scores[subject.id]=DB.scores[subject.id]||{}; DB.scores[subject.id][stId]=rec; sum.applied++;
  });
  saveDB(); return sum;
}
